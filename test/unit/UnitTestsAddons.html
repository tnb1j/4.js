<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>4.js Unit Tests - Using Files in /examples/jsm</title>
		<!-- if we don't set favicon here, we have to intercept the request for it in puppeteer page to prevent console error -->
		<link rel="icon" type="image/x-icon" href="/files/favicon.ico"/>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/qunit@2.25.0/qunit/qunit.css">
	</head>
	<body>

		<div id="qunit"></div>
		<div id="qunit-fixture"></div>

		<script src="https://cdn.jsdelivr.net/npm/qunit@2.25.0/qunit/qunit.min.js"></script>

		<script>
			window.addEventListener( 'error', ( e ) => console.error( 'WINDOW ERROR:', e.message, e.filename, e.lineno, e.error?.stack || e.error ) );
			window.addEventListener( 'unhandledrejection', ( e ) => console.error( 'UNHANDLED REJECTION:', e.reason?.stack || e.reason ) );
		</script>
		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../../src/Four.js",
					"@tnb1j/4js/webgpu": "../../src/Four.WebGPU.js",
					"@tnb1j/4js/tsl": "../../src/Four.TSL.js",
					"@tnb1j/4js/addons/": "../../examples/jsm/",
					"three": "../../src/Four.js",
					"three/webgpu": "../../src/Four.WebGPU.js",
					"three/tsl": "../../src/Four.TSL.js",
					"three/addons/": "../../examples/jsm/"
				}
			}
		</script>
		<script type="module">
			window.QUnit.on( 'testEnd', ( test ) => {

				if ( test.status === 'failed' ) {

					const errors = test.errors.map( e => e.message || e.source || JSON.stringify( e ) ).join( ' ; ' );
					console.error( `FAIL: ${test.suiteName} > ${test.name}: ${errors}` );

				}

			} );

			window.QUnit.on( 'runEnd', ( runEnd ) => {

				// using these later in puppeteer.unit.js
				window._QUnitStats = runEnd.testCounts;

			} );
		</script>

		<!-- add sources to test below -->
		<script src="./four.addons.unit.js" type="module"></script>
	</body>
</html>
