<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js misc - raycaster - helper</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js misc - raycaster - helper">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>
		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> - raycaster - helper<br/>
			See external <a href="https://github.com/gsimone/things?tab=readme-ov-file#raycasterhelper" target="_blank" rel="noopener">RaycasterHelper</a> for more information.
		</div>

        <script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.webgpu.js",
					"fourjs/webgpu": "../build/4.webgpu.js",
					"fourjs/tsl": "../build/4.tsl.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs/webgpu';
			import { RaycasterHelper } from 'https://cdn.jsdelivr.net/npm/@gsimone/three-raycaster-helper@0.1.0/dist/gsimone-three-raycaster-helper.esm.js';

			let scene, renderer;
			let camera;

			let capsule1, capsule2, capsule3;
			let raycaster, raycasterHelper;

			init();

			function init() {

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				//

				camera = new FOUR.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.z = 10;

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x000000 );

				//

				const geometry = new FOUR.CapsuleGeometry( 0.5, 0.5, 4, 32 );
				const material = new FOUR.MeshNormalMaterial();
				material.side = FOUR.DoubleSide;

				capsule1 = new FOUR.Mesh( geometry, material );
				capsule1.position.x = - 2;
				capsule2 = new FOUR.Mesh( geometry, material );
				capsule2.position.x = 0;
				capsule3 = new FOUR.Mesh( geometry, material );
				capsule3.position.x = 2;

				scene.add( capsule1 );
				scene.add( capsule2 );
				scene.add( capsule3 );

				raycaster = new FOUR.Raycaster( new FOUR.Vector3( - 4, 0, 0 ), new FOUR.Vector3( 1, 0, 0 ) );
				raycaster.near = 1;
				raycaster.far = 8;
				raycasterHelper = new RaycasterHelper( raycaster );
				scene.add( raycasterHelper );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate( time ) {

				const elapsedTime = time / 1000; // ms to s

				[ capsule1, capsule2, capsule3 ].forEach( capsule => {

					capsule.position.y = Math.sin( elapsedTime * 0.5 + capsule.position.x );
					capsule.rotation.z = Math.sin( elapsedTime * 0.5 ) * Math.PI * 1;

				} );

				raycasterHelper.hits = raycaster.intersectObjects( scene.children );
				raycasterHelper.update();

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
