<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - multiple render targets</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - multiple render targets">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Multiple Render Targets</span>
			</div>

			<small>
				Using multiple render targets to output color and normals to separate buffers.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';
			import { mix, vec2, step, texture, uv, screenUV, normalWorld, output, mrt } from '@tnb1j/4js/tsl';

			import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';

			let camera, scene, renderer, torus;
			let renderPipeline, renderTarget;

			init();

			function init() {

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( render );
				document.body.appendChild( renderer.domElement );

				// Create a multi render target with Float buffers

				renderTarget = new FOUR.RenderTarget(
					window.innerWidth * window.devicePixelRatio,
					window.innerHeight * window.devicePixelRatio,
					{ count: 2, minFilter: FOUR.NearestFilter, magFilter: FOUR.NearestFilter }
				);

				// Name our G-Buffer attachments for debugging

				renderTarget.textures[ 0 ].name = 'output';
				renderTarget.textures[ 1 ].name = 'normal';

				// Scene

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x222222 );

				camera = new FOUR.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.1, 50 );
				camera.position.z = 4;

				const loader = new FOUR.TextureLoader();

				const diffuse = loader.load( 'textures/hardwood2_diffuse.jpg' );
				diffuse.colorSpace = FOUR.SRGBColorSpace;
				diffuse.wrapS = FOUR.RepeatWrapping;
				diffuse.wrapT = FOUR.RepeatWrapping;

				const torusMaterial = new FOUR.NodeMaterial();
				torusMaterial.colorNode = texture( diffuse, uv().mul( vec2( 10, 4 ) ) );

				torus = new FOUR.Mesh( new FOUR.TorusKnotGeometry( 1, 0.3, 128, 32 ), torusMaterial );
				scene.add( torus );

				// MRT

				renderer.setMRT( mrt( {
					'output': output,
					'normal': normalWorld
				} ) );

				// Post Processing

				renderPipeline = new FOUR.RenderPipeline( renderer );
				renderPipeline.outputNode = mix( texture( renderTarget.textures[ 0 ] ), texture( renderTarget.textures[ 1 ] ), step( 0.5, screenUV.x ) );

				// Controls

				new OrbitControls( camera, renderer.domElement );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				const dpr = renderer.getPixelRatio();
				renderTarget.setSize( window.innerWidth * dpr, window.innerHeight * dpr );

			}

			function render( time ) {

				torus.rotation.y = ( time / 1000 ) * .4;

				// render scene into target
				renderer.setRenderTarget( renderTarget );
				renderer.render( scene, camera );

				// render post FX
				renderer.setRenderTarget( null );
				renderPipeline.render();

			}

		</script>

	</body>
</html>
