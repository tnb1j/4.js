<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - lottie loader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - lottie loader">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> webgl - lottie<br/></br>
			<input id="scrubber" type="range" value="0" style="width: 300px">
		</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.module.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core';
			import { RoomEnvironment } from '@fourjs/core/addons/environments/RoomEnvironment.js';
			import { RoundedBoxGeometry } from '@fourjs/core/addons/geometries/RoundedBoxGeometry.js';
			import { OrbitControls } from '@fourjs/core/addons/controls/OrbitControls.js';

			import lottie from 'https://cdn.jsdelivr.net/npm/lottie-web@5.13.0/+esm';

			let renderer, scene, camera, controls;
			let mesh;

			init();

			function init() {

				camera = new FOUR.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 10 );
				camera.position.z = 2.5;

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x111111 );

				// lottie

				const loader = new FOUR.FileLoader();
				loader.setResponseType( 'json' );
				loader.load( 'textures/lottie/24017-lottie-logo-animation.json', function ( data ) {

					const container = document.createElement( 'div' );
					const dpr = window.devicePixelRatio;
					container.style.width = data.w * dpr + 'px';
					container.style.height = data.h * dpr + 'px';
					document.body.appendChild( container );

					const animation = lottie.loadAnimation( {
						container: container,
						animType: 'canvas',
						loop: true,
						autoplay: true,
						animationData: data,
						rendererSettings: { dpr: dpr }
					} );

					const texture = new FOUR.CanvasTexture( animation.container );
					texture.minFilter = FOUR.NearestFilter;
					texture.generateMipmaps = false;
					texture.colorSpace = FOUR.SRGBColorSpace;

					animation.addEventListener( 'enterFrame', function () {

						texture.needsUpdate = true;

					} );

					container.style.display = 'none'; // must be done after loadAnimation() otherwise canvas has 0 dimensions

					setupControls( animation );

					// texture = new FOUR.TextureLoader().load( 'textures/uv_grid_directx.jpg' );
					// texture.colorSpace = FOUR.SRGBColorSpace;

					const geometry = new RoundedBoxGeometry( 1, 1, 1, 7, 0.1 );
					const material = new FOUR.MeshStandardMaterial( { roughness: 0, map: texture } );
					mesh = new FOUR.Mesh( geometry, material );
					scene.add( mesh );

				} );

				renderer = new FOUR.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = FOUR.ACESFilmicToneMapping;
				document.body.appendChild( renderer.domElement );

				const environment = new RoomEnvironment();
				const pmremGenerator = new FOUR.PMREMGenerator( renderer );

				scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;

				controls = new OrbitControls( camera, renderer.domElement );
				controls.autoRotate = true;

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function setupControls( animation ) {

				// Lottie animation API
				// https://airbnb.io/lottie/#/web

				// There are a few undocumented properties:
				// console.log( animation );

				const scrubber = document.getElementById( 'scrubber' );
				scrubber.max = animation.totalFrames;

				scrubber.addEventListener( 'pointerdown', function () {

					animation.pause();

				} );

				scrubber.addEventListener( 'pointerup', function () {

					animation.play();

				} );

				scrubber.addEventListener( 'input', function () {

					animation.goToAndStop( parseFloat( scrubber.value ), true );

				} );

				animation.addEventListener( 'enterFrame', function () {

					scrubber.value = animation.currentFrame;

				} );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				controls.update();

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
