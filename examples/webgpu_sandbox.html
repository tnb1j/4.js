<html lang="en">
	<head>
		<title>4.js webgpu - sandbox</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - sandbox">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>WebGPU sandbox</span>
			</div>

			<small>A sandbox for testing basic scene setups.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';
			import { time, vec2, uv, texture, mix, checker, normalLocal, positionLocal, color, oscSine, attribute } from '@tnb1j/4js/tsl';

			import { KTX2Loader } from '@tnb1j/4js/addons/loaders/KTX2Loader.js';

			import { Inspector } from '@tnb1j/4js/addons/inspector/Inspector.js';

			let camera, scene, renderer;

			let box;

			init();

			async function init() {

				camera = new FOUR.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.1, 10 );
				camera.position.z = 4;

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x222222 );

				//

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				// textures

				const textureLoader = new FOUR.TextureLoader();
				const uvTexture = textureLoader.load( './textures/uv_grid_opengl.jpg' );
				uvTexture.wrapS = FOUR.RepeatWrapping;
				uvTexture.wrapT = FOUR.RepeatWrapping;
				uvTexture.name = 'uv_grid';

				const textureDisplace = textureLoader.load( './textures/transition/transition1.png' );
				textureDisplace.wrapS = FOUR.RepeatWrapping;
				textureDisplace.wrapT = FOUR.RepeatWrapping;

				const ktxLoader = await new KTX2Loader()
					.detectSupport( renderer );

				const ktxTexture = await ktxLoader.loadAsync( './textures/ktx2/2d_uastc.ktx2' );

				// box mesh

				const geometryBox = new FOUR.BoxGeometry();
				const materialBox = new FOUR.MeshBasicNodeMaterial();

				// birection speed

				const timerScaleNode = time.mul( vec2( - 0.5, 0.1 ) );
				const animateUV = uv().add( timerScaleNode );

				const textureNode = texture( uvTexture, animateUV );

				materialBox.colorNode = mix( textureNode, checker( animateUV ), 0.5 );

				// test uv 2
				//geometryBox.setAttribute( 'uv1', geometryBox.getAttribute( 'uv' ) );
				//materialBox.colorNode = texture( uvTexture, uv( 1 ) );

				box = new FOUR.Mesh( geometryBox, materialBox );
				box.position.set( 0, 1, 0 );
				scene.add( box );

				// displace example

				const geometrySphere = new FOUR.SphereGeometry( .5, 64, 64 );
				const materialSphere = new FOUR.MeshBasicNodeMaterial();

				const displaceY = texture( textureDisplace ).x.mul( 0.25 );

				const displace = normalLocal.mul( displaceY );

				materialSphere.colorNode = displaceY;
				materialSphere.positionNode = positionLocal.add( displace );

				const sphere = new FOUR.Mesh( geometrySphere, materialSphere );
				sphere.position.set( - 2, - 1, 0 );
				scene.add( sphere );

				// data texture

				const geometryPlane = new FOUR.PlaneGeometry();
				const materialPlane = new FOUR.MeshBasicNodeMaterial();
				materialPlane.colorNode = texture( createDataTexture() ).add( color( 0x0000FF ) );
				materialPlane.transparent = true;

				const plane = new FOUR.Mesh( geometryPlane, materialPlane );
				plane.position.set( 0, - 1, 0 );
				scene.add( plane );

				// compressed texture

				const materialCompressed = new FOUR.MeshBasicNodeMaterial();
				materialCompressed.colorNode = texture( ktxTexture );
				materialCompressed.emissiveNode = oscSine().mix( color( 0x663300 ), color( 0x0000FF ) );
				materialCompressed.alphaTestNode = oscSine();
				materialCompressed.transparent = true;

				const geo = flipY( new FOUR.PlaneGeometry() );
				const planeCompressed = new FOUR.Mesh( geo, materialCompressed );
				planeCompressed.position.set( - 2, 1, 0 );
				scene.add( planeCompressed );

				// points

				const points = [];

				for ( let i = 0; i < 1000; i ++ ) {

					const point = new FOUR.Vector3().random().subScalar( 0.5 );
					points.push( point );

				}

				const geometryPoints = new FOUR.BufferGeometry().setFromPoints( points );
				const materialPoints = new FOUR.PointsNodeMaterial();

				materialPoints.colorNode = positionLocal.mul( 3 );

				const pointCloud = new FOUR.Points( geometryPoints, materialPoints );
				pointCloud.position.set( 2, - 1, 0 );
				scene.add( pointCloud );

				// lines

				const geometryLine = new FOUR.BufferGeometry().setFromPoints( [
					new FOUR.Vector3( - 0.5, - 0.5, 0 ),
					new FOUR.Vector3( 0.5, - 0.5, 0 ),
					new FOUR.Vector3( 0.5, 0.5, 0 ),
					new FOUR.Vector3( - 0.5, 0.5, 0 ),
					new FOUR.Vector3( - 0.5, - 0.5, 0 )
				] );

				geometryLine.setAttribute( 'color', geometryLine.getAttribute( 'position' ) );

				const materialLine = new FOUR.LineBasicNodeMaterial();
				materialLine.colorNode = attribute( 'color' );

				const line = new FOUR.Line( geometryLine, materialLine );
				line.position.set( 2, 1, 0 );
				scene.add( line );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				if ( box ) {

					box.rotation.x += 0.01;
					box.rotation.y += 0.02;

				}

				renderer.render( scene, camera );

			}

			function createDataTexture() {

				const color = new FOUR.Color( 0xff0000 );

				const width = 512;
				const height = 512;

				const size = width * height;
				const data = new Uint8Array( 4 * size );

				const r = Math.floor( color.r * 255 );
				const g = Math.floor( color.g * 255 );
				const b = Math.floor( color.b * 255 );

				for ( let i = 0; i < size; i ++ ) {

					const stride = i * 4;

					data[ stride ] = r;
					data[ stride + 1 ] = g;
					data[ stride + 2 ] = b;
					data[ stride + 3 ] = 255;

				}

				const texture = new FOUR.DataTexture( data, width, height, FOUR.RGBAFormat );
				texture.needsUpdate = true;
				return texture;

			}

			/*
			 * Correct UVs to be compatible with `flipY=false` textures.
			 */
			function flipY( geometry ) {

				const uv = geometry.attributes.uv;

				for ( let i = 0; i < uv.count; i ++ ) {

					uv.setY( i, 1 - uv.getY( i ) );

				}

				return geometry;

			}

		</script>
	</body>
</html>
