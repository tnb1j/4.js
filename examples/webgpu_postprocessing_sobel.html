<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - postprocessing sobel</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - postprocessing sobel">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span> Sobel</span>
			</div>

			<small>Edge Detection with a Sobel operator.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.webgpu.js",
					"@fourjs/core/webgpu": "../build/4.webgpu.js",
					"@fourjs/core/tsl": "../build/4.tsl.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core/webgpu';
			import { pass, renderOutput } from '@fourjs/core/tsl';
			import { sobel } from '@fourjs/core/addons/tsl/display/SobelOperatorNode.js';

			import { OrbitControls } from '@fourjs/core/addons/controls/OrbitControls.js';
			import { GLTFLoader } from '@fourjs/core/addons/loaders/GLTFLoader.js';
			import { RoomEnvironment } from '@fourjs/core/addons/environments/RoomEnvironment.js';
			import { Inspector } from '@fourjs/core/addons/inspector/Inspector.js';

			let camera, scene, renderer, controls;
			let renderPipeline;

			const params = {
				enabled: true
			};

			init();

			async function init() {

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x000000 );

				camera = new FOUR.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 1, 3 );

				//

				const loader = new GLTFLoader();
				const gltf = await loader.loadAsync( 'models/gltf/DragonAttenuation.glb' );
				const model = gltf.scene.children[ 1 ];
				model.material = new FOUR.MeshStandardNodeMaterial();

				scene.add( model );
			
				//

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				renderer.toneMapping = FOUR.LinearToneMapping;
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				const environment = new RoomEnvironment();
				const pmremGenerator = new FOUR.PMREMGenerator( renderer );

				scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;
				pmremGenerator.dispose();

				//

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.enableZoom = false;
				controls.target.set( 0, 0.5, 0 );
				controls.update();


				// postprocessing

				renderPipeline = new FOUR.RenderPipeline( renderer );
				renderPipeline.outputColorTransform = false;

				const scenePass = pass( scene, camera );

				renderPipeline.outputNode = sobel( renderOutput( scenePass ) );

				//

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( params, 'enabled' );

				//

				window.addEventListener( 'resize', onWindowResize );

			}


			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				controls.update();

				if ( params.enabled === true ) {

					renderPipeline.render();

				} else {

					renderer.render( scene, camera );

				}

			}

		</script>
	</body>
</html>
