<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - point light shadow-map</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - PointLight ShadowMap">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>PointLight ShadowMap</span>
			</div>

			<small>Animated point light shadows.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.webgpu.js",
					"@fourjs/core/webgpu": "../build/4.webgpu.js",
					"@fourjs/core/tsl": "../build/4.tsl.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core';

			import { OrbitControls } from '@fourjs/core/addons/controls/OrbitControls.js';

			import { Inspector } from '@fourjs/core/addons/inspector/Inspector.js';

			let camera, scene, renderer;
			let pointLight, pointLight2;

			init();

			async function init() {

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.set( 0, 10, 40 );

				scene = new FOUR.Scene();
				scene.add( new FOUR.AmbientLight( 0x111122, 3 ) );

				// lights

				function createLight( color ) {

					const intensity = 200;

					const light = new FOUR.PointLight( color, intensity, 20 );
					light.castShadow = true;
					light.shadow.bias = - 0.005; // reduces self-shadowing on double-sided objects
					light.shadow.mapSize.width = 128;
					light.shadow.radius = 10;

					let geometry = new FOUR.SphereGeometry( 0.3, 12, 6 );
					let material = new FOUR.MeshBasicMaterial( { color: color } );
					material.color.multiplyScalar( intensity );
					let sphere = new FOUR.Mesh( geometry, material );
					light.add( sphere );

					const texture = new FOUR.CanvasTexture( generateTexture() );
					texture.magFilter = FOUR.NearestFilter;
					texture.wrapT = FOUR.RepeatWrapping;
					texture.wrapS = FOUR.RepeatWrapping;
					texture.repeat.set( 1, 4.5 );

					geometry = new FOUR.SphereGeometry( 2, 32, 8 );
					material = new FOUR.MeshPhongNodeMaterial( {
						side: FOUR.DoubleSide,
						alphaMap: texture,
						alphaTest: 0.5
					} );

					sphere = new FOUR.Mesh( geometry, material );
					sphere.castShadow = true;
					sphere.receiveShadow = true;
					light.add( sphere );

					return light;

				}

				pointLight = createLight( 0x0088ff );
				scene.add( pointLight );

				pointLight2 = createLight( 0xff8888 );
				scene.add( pointLight2 );
				//

				const geometry = new FOUR.BoxGeometry( 30, 30, 30 );

				const material = new FOUR.MeshPhongNodeMaterial( {
					color: 0xa0adaf,
					shininess: 10,
					specular: 0x111111,
					side: FOUR.BackSide
				} );

				const mesh = new FOUR.Mesh( geometry, material );
				mesh.position.y = 10;
				mesh.receiveShadow = true;
				scene.add( mesh );

				//

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				// renderer.shadowMap.type = FOUR.BasicShadowMap;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 10, 0 );
				controls.update();



				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function generateTexture() {

				const canvas = document.createElement( 'canvas' );
				canvas.width = 2;
				canvas.height = 2;

				const context = canvas.getContext( '2d' );
				context.fillStyle = 'white';
				context.fillRect( 0, 1, 2, 1 );

				return canvas;

			}

			function animate() {

				let time = performance.now() * 0.001;

				pointLight.position.x = Math.sin( time * 0.6 ) * 9;
				pointLight.position.y = Math.sin( time * 0.7 ) * 9 + 6;
				pointLight.position.z = Math.sin( time * 0.8 ) * 9;

				pointLight.rotation.x = time;
				pointLight.rotation.z = time;

				time += 10000;

				pointLight2.position.x = Math.sin( time * 0.6 ) * 9;
				pointLight2.position.y = Math.sin( time * 0.7 ) * 9 + 6;
				pointLight2.position.z = Math.sin( time * 0.8 ) * 9;

				pointLight2.rotation.x = time;
				pointLight2.rotation.z = time;

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
