<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - instancing morph target animations</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - instancing morph target animations">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Instancing Morph</span>
			</div>

			<small>
				Rendering instances which are individually animated via morph targets.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.webgpu.js",
					"@fourjs/core/webgpu": "../build/4.webgpu.js",
					"@fourjs/core/tsl": "../build/4.tsl.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core/webgpu';

			import { GLTFLoader } from '@fourjs/core/addons/loaders/GLTFLoader.js';
			import { Inspector } from '@fourjs/core/addons/inspector/Inspector.js';

			let camera, scene, renderer, mesh, mixer, dummy;

			const offset = 5000;

			const timeOffsets = new Float32Array( 1024 );

			for ( let i = 0; i < 1024; i ++ ) {

				timeOffsets[ i ] = Math.random() * 3;

			}

			const timer = new FOUR.Timer();
			timer.connect( document );


			init();

			function init() {

				camera = new FOUR.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 100, 10000 );

				scene = new FOUR.Scene();

				scene.background = new FOUR.Color( 0x99DDFF );

				scene.fog = new FOUR.Fog( 0x99DDFF, 5000, 10000 );

				//

				const light = new FOUR.DirectionalLight( 0xffffff, 1 );

				light.position.set( 200, 1000, 50 );

				light.shadow.mapSize.width = 2048;
				light.shadow.mapSize.height = 2048;
				light.castShadow = true;

				light.shadow.camera.left = - 5000;
				light.shadow.camera.right = 5000;
				light.shadow.camera.top = 5000;
				light.shadow.camera.bottom = - 5000;
				light.shadow.camera.far = 2000;

				light.shadow.camera.updateProjectionMatrix();

				scene.add( light );

				const hemi = new FOUR.HemisphereLight( 0x99DDFF, 0x669933, 1 / 3 );

				scene.add( hemi );

				const ground = new FOUR.Mesh(
					new FOUR.PlaneGeometry( 1000000, 1000000 ),
					new FOUR.MeshStandardMaterial( { color: 0x669933 } )
				);

				ground.rotation.x = - Math.PI / 2;

				ground.receiveShadow = true;

				scene.add( ground );

				const loader = new GLTFLoader();

				loader.load( 'models/gltf/Horse.glb', function ( glb ) {

					dummy = glb.scene.children[ 0 ];

					mesh = new FOUR.InstancedMesh( dummy.geometry, new FOUR.MeshStandardNodeMaterial( {
						flatShading: true,
					} ), 1024 );

					mesh.castShadow = true;

					for ( let x = 0, i = 0; x < 32; x ++ ) {

						for ( let y = 0; y < 32; y ++ ) {

							dummy.position.set( offset - 300 * x + 200 * Math.random(), 0, offset - 300 * y );

							dummy.updateMatrix();

							mesh.setMatrixAt( i, dummy.matrix );

							mesh.setColorAt( i, new FOUR.Color( `hsl(${Math.random() * 360}, 50%, 66%)` ) );

							i ++;
			
						}

			
					}

					scene.add( mesh );

					mixer = new FOUR.AnimationMixer( glb.scene );

					const action = mixer.clipAction( glb.animations[ 0 ] );

					action.play();
			
				} );


				// renderer

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setAnimationLoop( animate );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.shadowMap.enabled = true;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				timer.update();

				const time = timer.getElapsed();

				const r = 3000;
				camera.position.set( Math.sin( time / 10 ) * r, 1500 + 1000 * Math.cos( time / 5 ), Math.cos( time / 10 ) * r );
				camera.lookAt( 0, 0, 0 );

				if ( mesh ) {

					for ( let i = 0; i < 1024; i ++ ) {

						mixer.setTime( time + timeOffsets[ i ] );

						mesh.setMorphAt( i, dummy );

					}

					mesh.morphTexture.needsUpdate = true;

				}

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
