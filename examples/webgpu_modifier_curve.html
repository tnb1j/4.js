<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - curve modifier</title>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
		/>
		<meta property="og:title" content="4.js webgpu - curve modifier" />
		<meta property="og:type" content="website" />
		<link type="text/css" rel="stylesheet" href="example.css" />
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Curve Modifier</span>
			</div>

			<small>Deform a mesh along a curve using GPU acceleration.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';
			import { TransformControls } from '@tnb1j/4js/addons/controls/TransformControls.js';

			import { Flow } from '@tnb1j/4js/addons/modifiers/CurveModifierGPU.js';
			import { FontLoader } from '@tnb1j/4js/addons/loaders/FontLoader.js';
			import { TextGeometry } from '@tnb1j/4js/addons/geometries/TextGeometry.js';

			const ACTION_SELECT = 1, ACTION_NONE = 0;
			const curveHandles = [];
			const mouse = new FOUR.Vector2();

			let scene,
				camera,
				renderer,
				rayCaster,
				control,
				flow,
				action = ACTION_NONE;

			init();

			function init() {

				scene = new FOUR.Scene();

				camera = new FOUR.PerspectiveCamera(
					40,
					window.innerWidth / window.innerHeight,
					1,
					1000
				);
				camera.position.set( 2, 2, 4 );
				camera.lookAt( scene.position );

				const initialPoints = [
					{ x: 1, y: 0, z: - 1 },
					{ x: 1, y: 0, z: 1 },
					{ x: - 1, y: 0, z: 1 },
					{ x: - 1, y: 0, z: - 1 },
				];

				const boxGeometry = new FOUR.BoxGeometry( 0.1, 0.1, 0.1 );
				const boxMaterial = new FOUR.MeshBasicNodeMaterial();

				for ( const handlePos of initialPoints ) {

					const handle = new FOUR.Mesh( boxGeometry, boxMaterial );
					handle.position.copy( handlePos );
					curveHandles.push( handle );
					scene.add( handle );

				}

				const curve = new FOUR.CatmullRomCurve3(
					curveHandles.map( ( handle ) => handle.position )
				);
				curve.curveType = 'centripetal';
				curve.closed = true;

				const points = curve.getPoints( 50 );
				const line = new FOUR.Line(
					new FOUR.BufferGeometry().setFromPoints( points ),
					new FOUR.LineBasicMaterial( { color: 0x00ff00 } )
				);

				scene.add( line );

				//

				const light = new FOUR.DirectionalLight( 0xffaa33, 3 );
				light.position.set( - 10, 10, 10 );
				scene.add( light );

				const light2 = new FOUR.AmbientLight( 0x003973, 3 );
				scene.add( light2 );

				//

				const loader = new FontLoader();
				loader.load( 'fonts/helvetiker_regular.typeface.json', function ( font ) {

					const geometry = new TextGeometry( 'Hello 4.js!', {
						font: font,
						size: 0.2,
						depth: 0.05,
						curveSegments: 12,
						bevelEnabled: true,
						bevelThickness: 0.02,
						bevelSize: 0.01,
						bevelOffset: 0,
						bevelSegments: 5,
					} );

					geometry.rotateX( Math.PI );

					const material = new FOUR.MeshStandardNodeMaterial( {
						color: 0x99ffff
					} );

					const objectToCurve = new FOUR.Mesh( geometry, material );

					flow = new Flow( objectToCurve );
					flow.updateCurve( 0, curve );
					scene.add( flow.object3D );

				} );

				//

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				renderer.domElement.addEventListener( 'pointerdown', onPointerDown );

				rayCaster = new FOUR.Raycaster();
				control = new TransformControls( camera, renderer.domElement );
				control.addEventListener( 'dragging-changed', function ( event ) {

					if ( ! event.value ) {

						const points = curve.getPoints( 50 );
						line.geometry.setFromPoints( points );
						flow.updateCurve( 0, curve );

					}

				} );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function onPointerDown( event ) {

				action = ACTION_SELECT;
				mouse.x = ( event.clientX / window.innerWidth ) * 2 - 1;
				mouse.y = - ( event.clientY / window.innerHeight ) * 2 + 1;

			}

			function animate() {

				if ( action === ACTION_SELECT ) {

					rayCaster.setFromCamera( mouse, camera );
					action = ACTION_NONE;
					const intersects = rayCaster.intersectObjects( curveHandles, false );
					if ( intersects.length ) {

						const target = intersects[ 0 ].object;
						control.attach( target );
						scene.add( control.getHelper() );

					}

				}

				if ( flow ) {

					flow.moveAlongCurve( 0.001 );

				}

				render();

			}

			function render() {

				renderer.render( scene, camera );

			}
		</script>
	</body>
</html>
