<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - animation - basic</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - animation - basic">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> webgl - animation - basic use
		</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.module.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core';

			import Stats from '@fourjs/core/addons/libs/stats.module.js';

			let stats, timer;
			let scene, camera, renderer, mixer;

			init();

			function init() {

				scene = new FOUR.Scene();

				//

				camera = new FOUR.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.set( 25, 25, 50 );
				camera.lookAt( scene.position );

				//

				const axesHelper = new FOUR.AxesHelper( 10 );
				scene.add( axesHelper );

				//

				const geometry = new FOUR.BoxGeometry( 5, 5, 5 );
				const material = new FOUR.MeshBasicMaterial( { color: 0xffffff, transparent: true } );
				const mesh = new FOUR.Mesh( geometry, material );
				scene.add( mesh );

				// create a keyframe track (i.e. a timed sequence of keyframes) for each animated property
				// Note: the keyframe track type should correspond to the type of the property being animated

				// POSITION
				const positionKF = new FOUR.VectorKeyframeTrack( '.position', [ 0, 1, 2 ], [ 0, 0, 0, 30, 0, 0, 0, 0, 0 ] );

				// SCALE
				const scaleKF = new FOUR.VectorKeyframeTrack( '.scale', [ 0, 1, 2 ], [ 1, 1, 1, 2, 2, 2, 1, 1, 1 ] );

				// ROTATION
				// Rotation should be performed using quaternions, using a FOUR.QuaternionKeyframeTrack
				// Interpolating Euler angles (.rotation property) can be problematic and is currently not supported

				// set up rotation about x axis
				const xAxis = new FOUR.Vector3( 1, 0, 0 );

				const qInitial = new FOUR.Quaternion().setFromAxisAngle( xAxis, 0 );
				const qFinal = new FOUR.Quaternion().setFromAxisAngle( xAxis, Math.PI );
				const quaternionKF = new FOUR.QuaternionKeyframeTrack( '.quaternion', [ 0, 1, 2 ], [ qInitial.x, qInitial.y, qInitial.z, qInitial.w, qFinal.x, qFinal.y, qFinal.z, qFinal.w, qInitial.x, qInitial.y, qInitial.z, qInitial.w ] );

				// COLOR
				const colorKF = new FOUR.ColorKeyframeTrack( '.material.color', [ 0, 1, 2 ], [ 1, 0, 0, 0, 1, 0, 0, 0, 1 ], FOUR.InterpolateDiscrete );

				// OPACITY
				const opacityKF = new FOUR.NumberKeyframeTrack( '.material.opacity', [ 0, 1, 2 ], [ 1, 0, 1 ] );

				// create an animation sequence with the tracks
				// If a negative time value is passed, the duration will be calculated from the times of the passed tracks array
				const clip = new FOUR.AnimationClip( 'Action', 3, [ scaleKF, positionKF, quaternionKF, colorKF, opacityKF ] );

				// setup the FOUR.AnimationMixer
				mixer = new FOUR.AnimationMixer( mesh );

				// create a ClipAction and set it to play
				const clipAction = mixer.clipAction( clip );
				clipAction.play();

				//

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				//

				stats = new Stats();
				document.body.appendChild( stats.dom );

				//

				timer = new FOUR.Timer();
				timer.connect( document );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				if ( mixer ) {

					mixer.update( delta );

				}

				renderer.render( scene, camera );

				stats.update();

			}

		</script>

	</body>
</html>
