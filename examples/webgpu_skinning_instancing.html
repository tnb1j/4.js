<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - skinning instancing</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - skinning instancing">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Skinning Instancing</span>
			</div>

			<small>
				Skinning with multiple instances of the same model.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';
			import { pass, mix, range, color, oscSine, time } from '@tnb1j/4js/tsl';
			import { gaussianBlur } from '@tnb1j/4js/addons/tsl/display/GaussianBlurNode.js';

			import { GLTFLoader } from '@tnb1j/4js/addons/loaders/GLTFLoader.js';

			let camera, scene, renderer;
			let renderPipeline;

			let mixer, timer;

			init();

			function init() {

				camera = new FOUR.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.01, 40 );
				camera.position.set( 1, 2, 3 );

				scene = new FOUR.Scene();
				camera.lookAt( 0, 1, 0 );

				timer = new FOUR.Timer();
				timer.connect( document );

				// lights

				const centerLight = new FOUR.PointLight( 0xff9900, 1, 100 );
				centerLight.position.y = 4.5;
				centerLight.position.z = - 2;
				centerLight.power = 400;
				scene.add( centerLight );

				const cameraLight = new FOUR.PointLight( 0x0099ff, 1, 100 );
				cameraLight.power = 400;
				camera.add( cameraLight );
				scene.add( camera );

				const geometry = new FOUR.PlaneGeometry( 1000, 1000 );
				geometry.rotateX( - Math.PI / 2 );

				const plane = new FOUR.Mesh( geometry, new FOUR.MeshBasicMaterial( { color: 0x000000, visible: true } ) );
				scene.add( plane );

				const loader = new GLTFLoader();
				loader.load( 'models/gltf/Michelle.glb', function ( gltf ) {

					const object = gltf.scene;

					mixer = new FOUR.AnimationMixer( object );

					const action = mixer.clipAction( gltf.animations[ 0 ] );
					action.play();

					const instanceCount = 30;
					const dummy = new FOUR.Object3D();

					object.traverse( ( child ) => {

						if ( child.isMesh ) {

							const oscNode = oscSine( time.mul( .1 ) );

							// random colors between instances from 0x000000 to 0xFFFFFF
							const randomColors = range( new FOUR.Color( 0x000000 ), new FOUR.Color( 0xFFFFFF ) );

							// random [ 0, 1 ] values between instances
							const randomMetalness = range( 0, 1 );

							child.material = new FOUR.MeshStandardNodeMaterial();
							child.material.roughness = .1;
							child.material.metalnessNode = mix( 0.0, randomMetalness, oscNode );
							child.material.colorNode = mix( color( 0xFFFFFF ), randomColors, oscNode );

							child.isInstancedMesh = true;
							child.instanceMatrix = new FOUR.InstancedBufferAttribute( new Float32Array( instanceCount * 16 ), 16 );
							child.count = instanceCount;

							for ( let i = 0; i < instanceCount; i ++ ) {

								dummy.position.x = - 200 + ( ( i % 5 ) * 70 );
								dummy.position.y = Math.floor( i / 5 ) * - 200;

								dummy.updateMatrix();

								dummy.matrix.toArray( child.instanceMatrix.array, i * 16 );

							}

						}

					} );

					scene.add( object );

				} );

				// renderer

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				// post processing

				const scenePass = pass( scene, camera );
				const scenePassColor = scenePass.getTextureNode();
				const scenePassDepth = scenePass.getLinearDepthNode().remapClamp( .15, .3 );

				const scenePassColorBlurred = gaussianBlur( scenePassColor );
				scenePassColorBlurred.directionNode = scenePassDepth;

				renderPipeline = new FOUR.RenderPipeline( renderer );
				renderPipeline.outputNode = scenePassColorBlurred;


				// events

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				if ( mixer ) mixer.update( delta );

				renderPipeline.render();

			}

		</script>
	</body>
</html>
