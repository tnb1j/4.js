<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - frame difference</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - frame difference">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Difference</span>
			</div>

			<small>Saturated color of objects according to the difference from one frame to another.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.webgpu.js",
					"@fourjs/core/webgpu": "../build/4.webgpu.js",
					"@fourjs/core/tsl": "../build/4.tsl.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core/webgpu';
			import { pass, luminance, saturation } from '@fourjs/core/tsl';

			import { OrbitControls } from '@fourjs/core/addons/controls/OrbitControls.js';

			import { Inspector } from '@fourjs/core/addons/inspector/Inspector.js';

			const params = {
				speed: 0
			};

			let camera, renderer, renderPipeline;
			let timer, mesh, controls;

			init();

			function init() {

				renderer = new FOUR.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				renderer.toneMapping = FOUR.NeutralToneMapping;
				document.body.appendChild( renderer.domElement );

				//

				camera = new FOUR.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 1, 100 );
				camera.position.set( 1, 2, 3 );

				const scene = new FOUR.Scene();
				scene.fog = new FOUR.Fog( 0x0487e2, 7, 25 );
				scene.background = new FOUR.Color( 0x0487e2 );

				timer = new FOUR.Timer();
				timer.connect( document );

				const texture = new FOUR.TextureLoader().load( 'textures/crate.gif' );
				texture.colorSpace = FOUR.SRGBColorSpace;

				const geometry = new FOUR.BoxGeometry();
				const material = new FOUR.MeshBasicMaterial( { map: texture } );

				mesh = new FOUR.Mesh( geometry, material );
				scene.add( mesh );

				// post processing

				renderPipeline = new FOUR.RenderPipeline( renderer );

				const scenePass = pass( scene, camera );

				const currentTexture = scenePass.getTextureNode();
				const previousTexture = scenePass.getPreviousTextureNode();

				const frameDiff = previousTexture.sub( currentTexture ).abs();

				const saturationAmount = luminance( frameDiff ).mul( 1000 ).clamp( 0, 3 );

				renderPipeline.outputNode = saturation( currentTexture, saturationAmount );

				//

				controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 2;
				controls.maxDistance = 10;
				controls.enableDamping = true;
				controls.dampingFactor = 0.01;

				window.addEventListener( 'resize', onWindowResize );

				//

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( params, 'speed', 0, 2 );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				controls.update();

				mesh.rotation.y += timer.getDelta() * 5 * params.speed;

				renderPipeline.render();

			}

		</script>

	</body>
</html>
