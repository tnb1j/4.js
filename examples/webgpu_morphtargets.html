<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - morph targets</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - morph targets">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

	<body>
		<div id="container"></div>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Morph Targets</span>
			</div>

			<small>
				Morph targets / blend shapes example with a simple geometry.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.webgpu.js",
					"fourjs/webgpu": "../build/4.webgpu.js",
					"fourjs/tsl": "../build/4.tsl.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs/webgpu';

			import { Inspector } from 'fourjs/addons/inspector/Inspector.js';

			import { OrbitControls } from 'fourjs/addons/controls/OrbitControls.js';

			let container, camera, scene, renderer, mesh;

			init();

			function init() {

				container = document.getElementById( 'container' );

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x8FBCD4 );

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 20 );
				camera.position.z = 10;
				scene.add( camera );

				scene.add( new FOUR.AmbientLight( 0x8FBCD4, 1.5 ) );

				const pointLight = new FOUR.PointLight( 0xffffff, 200 );
				camera.add( pointLight );

				const geometry = createGeometry();

				const material = new FOUR.MeshPhongMaterial( {
					color: 0xff0000,
					flatShading: true
				} );

				mesh = new FOUR.Mesh( geometry, material );
				scene.add( mesh );

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.inspector = new Inspector();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( function () {

					renderer.render( scene, camera );

				} );
				container.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.enableZoom = false;

				window.addEventListener( 'resize', onWindowResize );

				initGUI();

			}

			function createGeometry() {

				const geometry = new FOUR.BoxGeometry( 2, 2, 2, 32, 32, 32 );

				// create an empty array to hold targets for the attribute we want to morph
				// morphing positions and normals is supported
				geometry.morphAttributes.position = [];

				// the original positions of the cube's vertices
				const positionAttribute = geometry.attributes.position;

				// for the first morph target we'll move the cube's vertices onto the surface of a sphere
				const spherePositions = [];

				// for the second morph target, we'll twist the cubes vertices
				const twistPositions = [];
				const direction = new FOUR.Vector3( 1, 0, 0 );
				const vertex = new FOUR.Vector3();

				for ( let i = 0; i < positionAttribute.count; i ++ ) {

					const x = positionAttribute.getX( i );
					const y = positionAttribute.getY( i );
					const z = positionAttribute.getZ( i );

					spherePositions.push(

						x * Math.sqrt( 1 - ( y * y / 2 ) - ( z * z / 2 ) + ( y * y * z * z / 3 ) ),
						y * Math.sqrt( 1 - ( z * z / 2 ) - ( x * x / 2 ) + ( z * z * x * x / 3 ) ),
						z * Math.sqrt( 1 - ( x * x / 2 ) - ( y * y / 2 ) + ( x * x * y * y / 3 ) )

					);

					// stretch along the x-axis so we can see the twist better
					vertex.set( x * 2, y, z );

					vertex.applyAxisAngle( direction, Math.PI * x / 2 ).toArray( twistPositions, twistPositions.length );

				}

				// add the spherical positions as the first morph target
				geometry.morphAttributes.position[ 0 ] = new FOUR.Float32BufferAttribute( spherePositions, 3 );

				// add the twisted positions as the second morph target
				geometry.morphAttributes.position[ 1 ] = new FOUR.Float32BufferAttribute( twistPositions, 3 );

				return geometry;

			}

			function initGUI() {

				// Set up dat.GUI to control targets
				const params = {
					Spherify: 0,
					Twist: 0,
				};

				const gui = renderer.inspector.createParameters( 'Morph Targets' );

				gui.add( params, 'Spherify', 0, 1, 0.01 ).onChange( function ( value ) {

					mesh.morphTargetInfluences[ 0 ] = value;

				} );
				gui.add( params, 'Twist', 0, 1, 0.01 ).onChange( function ( value ) {

					mesh.morphTargetInfluences[ 1 ] = value;

				} );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

		</script>

	</body>
</html>
