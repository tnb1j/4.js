<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - arraycamera</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - arraycamera">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Array Camera</span>
			</div>

			<small>Array cameras allow to render the scene with multiple sub cameras but with a single render call.</small>
		</div>


		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.webgpu.js",
					"@fourjs/core/webgpu": "../build/4.webgpu.js",
					"@fourjs/core/tsl": "../build/4.tsl.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core/webgpu';

			let camera, scene, renderer;
			let mesh;

			const AMOUNT = 6;

			init();

			function init() {

				const subCameras = [];

				for ( let i = 0; i < AMOUNT * AMOUNT; i ++ ) {

					const subCamera = new FOUR.PerspectiveCamera( 40, 1, 0.1, 10 );
					subCamera.viewport = new FOUR.Vector4();

					subCameras.push( subCamera );

				}

				camera = new FOUR.ArrayCamera( subCameras );
				camera.position.z = 3;

				updateCameras();

				scene = new FOUR.Scene();

				scene.add( new FOUR.AmbientLight( 0x999999 ) );

				const light = new FOUR.DirectionalLight( 0xffffff, 3 );
				light.position.set( 0.5, 0.5, 1 );
				light.castShadow = true;
				light.shadow.camera.zoom = 4; // tighter shadow map
				scene.add( light );

				const geometryBackground = new FOUR.PlaneGeometry( 100, 100 );
				const materialBackground = new FOUR.MeshPhongMaterial( { color: 0x000066 } );

				const background = new FOUR.Mesh( geometryBackground, materialBackground );
				background.receiveShadow = true;
				background.position.set( 0, 0, - 1 );
				scene.add( background );

				const geometryCylinder = new FOUR.CylinderGeometry( 0.5, 0.5, 1, 32 );
				const materialCylinder = new FOUR.MeshPhongMaterial( { color: 0xff0000 } );

				mesh = new FOUR.Mesh( geometryCylinder, materialCylinder );
				mesh.castShadow = true;
				mesh.receiveShadow = true;
				scene.add( mesh );

				renderer = new FOUR.WebGPURenderer( /*{ forceWebGL: true }*/ );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				document.body.appendChild( renderer.domElement );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function updateCameras() {

				const ASPECT_RATIO = window.innerWidth / window.innerHeight;
				const WIDTH = window.innerWidth / AMOUNT;
				const HEIGHT = window.innerHeight / AMOUNT;

				camera.aspect = ASPECT_RATIO;
				camera.updateProjectionMatrix();

				for ( let y = 0; y < AMOUNT; y ++ ) {

					for ( let x = 0; x < AMOUNT; x ++ ) {

						const subcamera = camera.cameras[ AMOUNT * y + x ];
						subcamera.copy( camera ); // copy fov, aspect ratio, near, far from the root camera

						subcamera.viewport.set( Math.floor( x * WIDTH ), Math.floor( y * HEIGHT ), Math.ceil( WIDTH ), Math.ceil( HEIGHT ) );
						subcamera.updateProjectionMatrix();

						subcamera.position.x = ( x / AMOUNT ) - 0.5;
						subcamera.position.y = 0.5 - ( y / AMOUNT );
						subcamera.position.z = 1.5 + ( ( x + y ) * .5 );
						subcamera.position.multiplyScalar( 2 );

						subcamera.lookAt( 0, 0, 0 );
						subcamera.updateMatrixWorld();

					}

				}

			}

			function onWindowResize() {

				updateCameras();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				mesh.rotation.x += 0.005;
				mesh.rotation.z += 0.01;

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
