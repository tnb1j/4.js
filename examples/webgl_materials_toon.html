<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - materials</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - materials">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="container"></div>
		<div id="info"><a href="../" target="_blank" rel="noopener">4.js</a> - Toon Material with OutlineEffect</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.module.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core';

			import Stats from '@fourjs/core/addons/libs/stats.module.js';

			import { OrbitControls } from '@fourjs/core/addons/controls/OrbitControls.js';
			import { OutlineEffect } from '@fourjs/core/addons/effects/OutlineEffect.js';
			import { FontLoader } from '@fourjs/core/addons/loaders/FontLoader.js';
			import { TextGeometry } from '@fourjs/core/addons/geometries/TextGeometry.js';

			let container, stats;

			let camera, scene, renderer, effect;
			let particleLight;

			const loader = new FontLoader();
			loader.load( 'fonts/gentilis_regular.typeface.json', function ( font ) {

				init( font );

			} );

			function init( font ) {

				container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new FOUR.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 2500 );
				camera.position.set( 0.0, 400, 400 * 3.5 );

				//

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x444488 );

				//

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				container.appendChild( renderer.domElement );

				// Materials

				const cubeWidth = 400;
				const numberOfSpheresPerSide = 5;
				const sphereRadius = ( cubeWidth / numberOfSpheresPerSide ) * 0.8 * 0.5;
				const stepSize = 1.0 / numberOfSpheresPerSide;

				const geometry = new FOUR.SphereGeometry( sphereRadius, 32, 16 );

				for ( let alpha = 0, alphaIndex = 0; alpha <= 1.0; alpha += stepSize, alphaIndex ++ ) {

					const colors = new Uint8Array( alphaIndex + 2 );

					for ( let c = 0; c <= colors.length; c ++ ) {

						colors[ c ] = ( c / colors.length ) * 256;

					}

					const gradientMap = new FOUR.DataTexture( colors, colors.length, 1, FOUR.RedFormat );
					gradientMap.needsUpdate = true;

					for ( let beta = 0; beta <= 1.0; beta += stepSize ) {

						for ( let gamma = 0; gamma <= 1.0; gamma += stepSize ) {

							// basic monochromatic energy preservation
							const diffuseColor = new FOUR.Color().setHSL( alpha, 0.5, gamma * 0.5 + 0.1 ).multiplyScalar( 1 - beta * 0.2 );

							const material = new FOUR.MeshToonMaterial( {
								color: diffuseColor,
								gradientMap: gradientMap
							} );

							const mesh = new FOUR.Mesh( geometry, material );

							mesh.position.x = alpha * 400 - 200;
							mesh.position.y = beta * 400 - 200;
							mesh.position.z = gamma * 400 - 200;

							scene.add( mesh );

						}

					}

				}

				function addLabel( name, location ) {

					const textGeo = new TextGeometry( name, {

						font: font,

						size: 20,
						depth: 1,
						curveSegments: 1

					} );

					const textMaterial = new FOUR.MeshBasicMaterial();
					const textMesh = new FOUR.Mesh( textGeo, textMaterial );
					textMesh.position.copy( location );
					scene.add( textMesh );

				}

				addLabel( '-gradientMap', new FOUR.Vector3( - 350, 0, 0 ) );
				addLabel( '+gradientMap', new FOUR.Vector3( 350, 0, 0 ) );

				addLabel( '-diffuse', new FOUR.Vector3( 0, 0, - 300 ) );
				addLabel( '+diffuse', new FOUR.Vector3( 0, 0, 300 ) );

				particleLight = new FOUR.Mesh(
					new FOUR.SphereGeometry( 4, 8, 8 ),
					new FOUR.MeshBasicMaterial( { color: 0xffffff } )
				);
				scene.add( particleLight );

				// Lights

				scene.add( new FOUR.AmbientLight( 0xc1c1c1, 3 ) );

				const pointLight = new FOUR.PointLight( 0xffffff, 2, 800, 0 );
				particleLight.add( pointLight );

				//

				effect = new OutlineEffect( renderer );

				//

				stats = new Stats();
				container.appendChild( stats.dom );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 200;
				controls.maxDistance = 2000;

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				stats.begin();
				render();
				stats.end();

			}

			function render() {

				const timer = Date.now() * 0.00025;

				particleLight.position.x = Math.sin( timer * 7 ) * 300;
				particleLight.position.y = Math.cos( timer * 5 ) * 400;
				particleLight.position.z = Math.cos( timer * 3 ) * 300;

				effect.render( scene, camera );

			}

		</script>

	</body>
</html>
