<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - bloom emissive</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - bloom emissive">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Emissive Bloom</span>
			</div>

			<small>Selective Bloom based on the "emissive" material property.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';
			import { pass, mrt, output, emissive, vec4 } from '@tnb1j/4js/tsl';
			import { bloom } from '@tnb1j/4js/addons/tsl/display/BloomNode.js';

			import { HDRLoader } from '@tnb1j/4js/addons/loaders/HDRLoader.js';

			import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';
			import { GLTFLoader } from '@tnb1j/4js/addons/loaders/GLTFLoader.js';

			import { Inspector } from '@tnb1j/4js/addons/inspector/Inspector.js';

			let camera, scene, renderer;
			let renderPipeline;

			init();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				//

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.25, 20 );
				camera.position.set( - 1.8, 0.6, 2.7 );

				scene = new FOUR.Scene();

				new HDRLoader()
					.setPath( 'textures/equirectangular/' )
					.load( 'moonless_golf_1k.hdr', function ( texture ) {

						texture.mapping = FOUR.EquirectangularReflectionMapping;

						scene.background = texture;
						scene.environment = texture;

						// model

						const loader = new GLTFLoader().setPath( 'models/gltf/DamagedHelmet/glTF/' );
						loader.load( 'DamagedHelmet.gltf', function ( gltf ) {

							scene.add( gltf.scene );

						} );

					} );

				//

				renderer = new FOUR.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( render );
				renderer.toneMapping = FOUR.ACESFilmicToneMapping;
				renderer.inspector = new Inspector();
				container.appendChild( renderer.domElement );

				//

				const scenePass = pass( scene, camera );

				// set up MRT with emissive

				const mrtNode = mrt( {
					output: output,
					emissive: vec4( emissive, output.a )
				} );

				mrtNode.setBlendMode( 'emissive', new FOUR.BlendMode( FOUR.NormalBlending ) );

				scenePass.setMRT( mrtNode );

				// optimize the bandwidth

				const emissiveTexture = scenePass.getTexture( 'emissive' );
				emissiveTexture.type = FOUR.UnsignedByteType;

				//

				const outputPass = scenePass.getTextureNode().toInspector( 'Color' );
				const emissivePass = scenePass.getTextureNode( 'emissive' ).toInspector( 'Emissive' );

				const bloomPass = bloom( emissivePass, 2.5, .5 );

				renderPipeline = new FOUR.RenderPipeline( renderer );
				renderPipeline.outputNode = outputPass.add( bloomPass );

				//

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 2;
				controls.maxDistance = 10;
				controls.target.set( 0, 0, - 0.2 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

				//

				const gui = renderer.inspector.createParameters( 'Settings' );

				const bloomFolder = gui.addFolder( 'Bloom' );
				bloomFolder.add( bloomPass.strength, 'value', 0.0, 5.0 ).name( 'strength' );
				bloomFolder.add( bloomPass.radius, 'value', 0.0, 1.0 ).name( 'radius' );

				const toneMappingFolder = gui.addFolder( 'Tone Mapping' );
				toneMappingFolder.add( renderer, 'toneMappingExposure', 0.1, 2 ).name( 'exposure' );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function render() {

				renderPipeline.render();

			}

		</script>

	</body>
</html>
