<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js css2d - label">
		<meta property="og:type" content="website">
		<title>4.js css2d - label</title>
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			.label {
				color: #FFF;
				font-family: sans-serif;
				padding: 2px;
				background: rgba( 0, 0, 0, .6 );
			}
		</style>
	</head>
	<body>
		<div id="info"><a href="../" target="_blank" rel="noopener">4.js</a> css2d - label</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.module.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs';

			import { OrbitControls } from 'fourjs/addons/controls/OrbitControls.js';
			import { CSS2DRenderer, CSS2DObject } from 'fourjs/addons/renderers/CSS2DRenderer.js';

			import { GUI } from 'fourjs/addons/libs/lil-gui.module.min.js';

			let gui;

			let camera, scene, renderer, labelRenderer;

			const layers = {

				'Toggle Name': function () {

					camera.layers.toggle( 0 );

				},
				'Toggle Mass': function () {

					camera.layers.toggle( 1 );

				},
				'Enable All': function () {

					camera.layers.enableAll();

				},

				'Disable All': function () {

					camera.layers.disableAll();

				}

			};

			const timer = new FOUR.Timer();
			timer.connect( document );
			const textureLoader = new FOUR.TextureLoader();

			let moon;

			init();
			animate();

			function init() {

				const EARTH_RADIUS = 1;
				const MOON_RADIUS = 0.27;

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 200 );
				camera.position.set( 10, 5, 20 );
				camera.layers.enableAll();

				scene = new FOUR.Scene();

				const dirLight = new FOUR.DirectionalLight( 0xffffff, 3 );
				dirLight.position.set( 0, 0, 1 );
				dirLight.layers.enableAll();
				scene.add( dirLight );

				const axesHelper = new FOUR.AxesHelper( 5 );
				axesHelper.layers.enableAll();
				scene.add( axesHelper );

				//

				const earthGeometry = new FOUR.SphereGeometry( EARTH_RADIUS, 16, 16 );
				const earthMaterial = new FOUR.MeshPhongMaterial( {
					specular: 0x333333,
					shininess: 5,
					map: textureLoader.load( 'textures/planets/earth_atmos_2048.jpg' ),
					specularMap: textureLoader.load( 'textures/planets/earth_specular_2048.jpg' ),
					normalMap: textureLoader.load( 'textures/planets/earth_normal_2048.jpg' ),
					normalScale: new FOUR.Vector2( 0.85, 0.85 )
				} );
				earthMaterial.map.colorSpace = FOUR.SRGBColorSpace;
				const earth = new FOUR.Mesh( earthGeometry, earthMaterial );
				scene.add( earth );

				const moonGeometry = new FOUR.SphereGeometry( MOON_RADIUS, 16, 16 );
				const moonMaterial = new FOUR.MeshPhongMaterial( {
					shininess: 5,
					map: textureLoader.load( 'textures/planets/moon_1024.jpg' )
				} );
				moonMaterial.map.colorSpace = FOUR.SRGBColorSpace;
				moon = new FOUR.Mesh( moonGeometry, moonMaterial );
				scene.add( moon );

				//

				earth.layers.enableAll();
				moon.layers.enableAll();

				const earthDiv = document.createElement( 'div' );
				earthDiv.className = 'label';
				earthDiv.textContent = 'Earth';
				earthDiv.style.backgroundColor = 'transparent';

				const earthLabel = new CSS2DObject( earthDiv );
				earthLabel.position.set( 1.5 * EARTH_RADIUS, 0, 0 );
				earthLabel.center.set( 0, 1 );
				earth.add( earthLabel );
				earthLabel.layers.set( 0 );

				const earthMassDiv = document.createElement( 'div' );
				earthMassDiv.className = 'label';
				earthMassDiv.textContent = '5.97237e24 kg';
				earthMassDiv.style.backgroundColor = 'transparent';

				const earthMassLabel = new CSS2DObject( earthMassDiv );
				earthMassLabel.position.set( 1.5 * EARTH_RADIUS, 0, 0 );
				earthMassLabel.center.set( 0, 0 );
				earth.add( earthMassLabel );
				earthMassLabel.layers.set( 1 );

				const moonDiv = document.createElement( 'div' );
				moonDiv.className = 'label';
				moonDiv.textContent = 'Moon';
				moonDiv.style.backgroundColor = 'transparent';

				const moonLabel = new CSS2DObject( moonDiv );
				moonLabel.position.set( 1.5 * MOON_RADIUS, 0, 0 );
				moonLabel.center.set( 0, 1 );
				moon.add( moonLabel );
				moonLabel.layers.set( 0 );

				const moonMassDiv = document.createElement( 'div' );
				moonMassDiv.className = 'label';
				moonMassDiv.textContent = '7.342e22 kg';
				moonMassDiv.style.backgroundColor = 'transparent';

				const moonMassLabel = new CSS2DObject( moonMassDiv );
				moonMassLabel.position.set( 1.5 * MOON_RADIUS, 0, 0 );
				moonMassLabel.center.set( 0, 0 );
				moon.add( moonMassLabel );
				moonMassLabel.layers.set( 1 );

				//

				renderer = new FOUR.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				labelRenderer = new CSS2DRenderer();
				labelRenderer.setSize( window.innerWidth, window.innerHeight );
				labelRenderer.domElement.style.position = 'absolute';
				labelRenderer.domElement.style.top = '0px';
				document.body.appendChild( labelRenderer.domElement );

				const controls = new OrbitControls( camera, labelRenderer.domElement );
				controls.minDistance = 5;
				controls.maxDistance = 100;

				//

				window.addEventListener( 'resize', onWindowResize );

				initGui();

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;

				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				labelRenderer.setSize( window.innerWidth, window.innerHeight );

			}


			function animate() {

				timer.update();

				requestAnimationFrame( animate );

				const elapsed = timer.getElapsed();

				moon.position.set( Math.sin( elapsed ) * 5, 0, Math.cos( elapsed ) * 5 );

				renderer.render( scene, camera );
				labelRenderer.render( scene, camera );

			}

			//

			function initGui() {

				gui = new GUI();

				gui.title( 'Camera Layers' );

				gui.add( layers, 'Toggle Name' );
				gui.add( layers, 'Toggle Mass' );
				gui.add( layers, 'Enable All' );
				gui.add( layers, 'Disable All' );

				gui.open();

			}

		</script>
	</body>
</html>
