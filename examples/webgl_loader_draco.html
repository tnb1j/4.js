<!DOCTYPE html>
<html lang="en">
<head>
	<title>4.js webgl - loaders - Draco loader</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - loaders - Draco loader">
		<meta property="og:type" content="website">
	<link type="text/css" rel="stylesheet" href="main.css">
</head>

<body>
	<div id="container"></div>
	<div id="info">
		<a href="../" target="_blank" rel="noopener">4.js</a> -
		<a href="https://github.com/google/draco" target="_blank" rel="noopener">DRACO</a> loader
	</div>

	<script type="importmap">
		{
			"imports": {
				"@fourjs/core": "../build/4.module.js",
				"@fourjs/core/addons/": "./jsm/"
			}
		}
	</script>

	<script type="module">
		import * as FOUR from '@fourjs/core';

		import { DRACOLoader } from '@fourjs/core/addons/loaders/DRACOLoader.js';

		let camera, scene, renderer;

		const container = document.querySelector( '#container' );

		// Configure and create Draco decoder.
		const dracoLoader = new DRACOLoader();

		init();

		function init() {

			camera = new FOUR.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 15 );
			camera.position.set( 3, 0.25, 3 );

			scene = new FOUR.Scene();
			scene.background = new FOUR.Color( 0x443333 );
			scene.fog = new FOUR.Fog( 0x443333, 1, 4 );

			// Ground
			const plane = new FOUR.Mesh(
				new FOUR.PlaneGeometry( 8, 8 ),
				new FOUR.MeshLambertMaterial( { color: 0xcbcbcb } )
			);
			plane.rotation.x = - Math.PI / 2;
			plane.position.y = 0.03;
			plane.receiveShadow = true;
			scene.add( plane );

			// Lights
			const hemiLight = new FOUR.HemisphereLight( 0x8d7c7c, 0x494966, 3 );
			scene.add( hemiLight );

			const spotLight = new FOUR.SpotLight();
			spotLight.intensity = 7;
			spotLight.angle = Math.PI / 16;
			spotLight.penumbra = 0.5;
			spotLight.castShadow = true;
			spotLight.shadow.radius = 8;
			spotLight.position.set( - 1, 1, 1 );
			scene.add( spotLight );

			dracoLoader.load( 'models/draco/bunny.drc', function ( geometry ) {

				geometry.computeVertexNormals();

				const material = new FOUR.MeshStandardMaterial( { color: 0xa5a5a5 } );
				const mesh = new FOUR.Mesh( geometry, material );
				mesh.castShadow = true;
				mesh.receiveShadow = true;
				scene.add( mesh );

				// Release decoder resources.
				dracoLoader.dispose();

			} );

			// renderer
			renderer = new FOUR.WebGLRenderer( { antialias: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			renderer.shadowMap.enabled = true;
			container.appendChild( renderer.domElement );

			window.addEventListener( 'resize', onWindowResize );

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}

		function animate() {

			const timer = Date.now() * 0.0003;

			camera.position.x = Math.sin( timer ) * 0.5;
			camera.position.z = Math.cos( timer ) * 0.5;
			camera.lookAt( 0, 0.1, 0 );

			renderer.render( scene, camera );

		}
	</script>
</body>
</html>
