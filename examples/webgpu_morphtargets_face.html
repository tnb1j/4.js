<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - morph face targets</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - morph face targets">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			body {
				background-color: #666666;
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> webgpu - morph face targets<br/>
			model by <a href="https://www.bannaflak.com/face-cap" target="_blank" rel="noopener">Face Cap</a>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.webgpu.js",
					"@fourjs/core/webgpu": "../build/4.webgpu.js",
					"@fourjs/core/tsl": "../build/4.tsl.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core/webgpu';

			import { OrbitControls } from '@fourjs/core/addons/controls/OrbitControls.js';

			import { RoomEnvironment } from '@fourjs/core/addons/environments/RoomEnvironment.js';
			import { GLTFLoader } from '@fourjs/core/addons/loaders/GLTFLoader.js';
			import { KTX2Loader } from '@fourjs/core/addons/loaders/KTX2Loader.js';
			import { MeshoptDecoder } from '@fourjs/core/addons/libs/meshopt_decoder.module.js';

			import { Inspector } from '@fourjs/core/addons/inspector/Inspector.js';

			init();

			async function init() {

				let mixer;

				const timer = new FOUR.Timer();
				timer.connect( document );

				const camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 20 );
				camera.position.set( - 1.8, 0.8, 3 );

				const scene = new FOUR.Scene();

				const renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = FOUR.ACESFilmicToneMapping;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				const environment = new RoomEnvironment();
				const pmremGenerator = new FOUR.PMREMGenerator( renderer );

				scene.background = new FOUR.Color( 0x666666 );
				scene.environment = pmremGenerator.fromScene( environment, 0.04 ).texture;

				const ktx2Loader = await new KTX2Loader()
					.detectSupport( renderer );

				new GLTFLoader()
					.setKTX2Loader( ktx2Loader )
					.setMeshoptDecoder( MeshoptDecoder )
					.load( 'models/gltf/facecap.glb', ( gltf ) => {

						const mesh = gltf.scene.children[ 0 ];

						scene.add( mesh );

						mixer = new FOUR.AnimationMixer( mesh );

						mixer.clipAction( gltf.animations[ 0 ] ).play();

						// GUI

						const head = mesh.getObjectByName( 'mesh_2' );
						const influences = head.morphTargetInfluences;

						const gui = renderer.inspector.createParameters( 'Morph Targets' );

						for ( const [ key, value ] of Object.entries( head.morphTargetDictionary ) ) {

							gui.add( influences, value, 0, 1, 0.01 )
								.name( key.replace( 'blendShape1.', '' ) )
								.listen();

						}

					} );

				scene.background = new FOUR.Color( 0x666666 );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 2.5;
				controls.maxDistance = 5;
				controls.minAzimuthAngle = - Math.PI / 2;
				controls.maxAzimuthAngle = Math.PI / 2;
				controls.maxPolarAngle = Math.PI / 1.8;
				controls.target.set( 0, 0.15, - 0.2 );

				function animate() {

					timer.update();

					const delta = timer.getDelta();

					if ( mixer ) {

						mixer.update( delta );

					}

					renderer.render( scene, camera );

					controls.update();

				}

				window.addEventListener( 'resize', () => {

					camera.aspect = window.innerWidth / window.innerHeight;
					camera.updateProjectionMatrix();

					renderer.setSize( window.innerWidth, window.innerHeight );

				} );

			}
		</script>
	</body>
</html>
