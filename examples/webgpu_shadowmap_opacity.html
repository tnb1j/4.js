<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - shadowmap + opacity</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - shadowmap + opacity">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Opacity Shadow Map</span>
			</div>

			<small>Shadow Map with custom color and opacity by material.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.webgpu.js",
					"fourjs/webgpu": "../build/4.webgpu.js",
					"fourjs/tsl": "../build/4.tsl.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs/webgpu';
			import { Fn, mix } from 'fourjs/tsl';

			import { Inspector } from 'fourjs/addons/inspector/Inspector.js';

			import { OrbitControls } from 'fourjs/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'fourjs/addons/loaders/GLTFLoader.js';

			let camera, scene, renderer;

			init();

			async function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 40 );
				camera.position.set( - 4, 2, 6 );

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( render );
				renderer.toneMapping = FOUR.AgXToneMapping;
				renderer.toneMappingExposure = 1.5;
				renderer.shadowMap.enabled = true;
				renderer.shadowMap.transmitted = true;
				renderer.inspector = new Inspector();
				container.appendChild( renderer.domElement );

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x9e9eff );

				// light + shadow

				const hemi = new FOUR.AmbientLight( 0xffffff, .5 );
				scene.add( hemi );

				const dirLight = new FOUR.DirectionalLight( 0x6666ff, 10 );
				dirLight.position.set( 3, 5, 17 );
				dirLight.castShadow = true;
				dirLight.shadow.camera.near = 0.1;
				dirLight.shadow.camera.far = 50;
				dirLight.shadow.camera.right = 5;
				dirLight.shadow.camera.left = - 5;
				dirLight.shadow.camera.top	= 5;
				dirLight.shadow.camera.bottom = - 5;
				dirLight.shadow.mapSize.width = 2048;
				dirLight.shadow.mapSize.height = 2048;
				dirLight.shadow.radius = 4;

				dirLight.shadow.autoUpdate = false;
				dirLight.shadow.needsUpdate = true;

				scene.add( dirLight );

				//

				const loader = new GLTFLoader();
				const gltf = await loader.loadAsync( 'models/gltf/DragonAttenuation.glb' );
				gltf.scene.position.set( 0, 0, - .5 );

				const floor = gltf.scene.children[ 0 ];
				floor.scale.x += 4;
				floor.scale.y += 4;

				const dragon = gltf.scene.children[ 1 ];
				dragon.position.set( - 1.5, - 0.8, 1 );

				const dragon2 = dragon.clone();
				dragon2.material = dragon.material.clone();
				dragon2.material.attenuationColor = new FOUR.Color( 0xff0000 );
				dragon2.position.x += 4;
				gltf.scene.add( dragon2 );

				// shadow node

				const customShadow = Fn( ( [ color, opacity = 1 ] ) => {

					//return vec4( color, opacity ); // opacity by blending
					return mix( 1, color, opacity ); // opacity by color

				} );

				// apply shadow

				floor.receiveShadow = true;

				dragon.castShadow = dragon2.castShadow = true;
				dragon.receiveShadow = dragon2.receiveShadow = true;

				dragon.material.castShadowNode = customShadow( dragon.material.attenuationColor );
				dragon2.material.castShadowNode = customShadow( dragon2.material.attenuationColor );

				//

				scene.add( gltf.scene );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 0.1;
				controls.maxDistance = 10;
				controls.target.set( 0, 0, 0 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function render() {

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
