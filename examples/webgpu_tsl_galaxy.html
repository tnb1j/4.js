<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - galaxy</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - galaxy">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Galaxy</span>
			</div>

			<small>
				Based on <a href="https://threejs-journey.com/lessons/animated-galaxy" target="_blank" rel="noopener">4.js Journey</a> lessons.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';
			import { color, cos, float, mix, range, sin, time, uniform, uv, vec3, vec4, TWO_PI } from '@tnb1j/4js/tsl';

			import { Inspector } from '@tnb1j/4js/addons/inspector/Inspector.js';

			import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';

			let camera, scene, renderer, controls;

			init();

			function init() {

				camera = new FOUR.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 4, 2, 5 );

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x201919 );

				// galaxy

				const material = new FOUR.SpriteNodeMaterial( {
					depthWrite: false,
					blending: FOUR.AdditiveBlending
				} );

				const size = uniform( 0.08 );
				material.scaleNode = range( 0, 1 ).mul( size );

				const radiusRatio = range( 0, 1 );
				const radius = radiusRatio.pow( 1.5 ).mul( 5 ).toVar();

				const branches = 3;
				const branchAngle = range( 0, branches ).floor().mul( TWO_PI.div( branches ) );
				const angle = branchAngle.add( time.mul( radiusRatio.oneMinus() ) );

				const position = vec3(
					cos( angle ),
					0,
					sin( angle )
				).mul( radius );

				const randomOffset = range( vec3( - 1 ), vec3( 1 ) ).pow3().mul( radiusRatio ).add( 0.2 );

				material.positionNode = position.add( randomOffset );

				const colorInside = uniform( color( '#ffa575' ) );
				const colorOutside = uniform( color( '#311599' ) );
				const colorFinal = mix( colorInside, colorOutside, radiusRatio.oneMinus().pow( 2 ).oneMinus() );
				const alpha = float( 0.1 ).div( uv().sub( 0.5 ).length() ).sub( 0.2 );
				material.colorNode = vec4( colorFinal, alpha );

				const mesh = new FOUR.InstancedMesh( new FOUR.PlaneGeometry( 1, 1 ), material, 20000 );
				scene.add( mesh );

				// renderer

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.minDistance = 0.1;
				controls.maxDistance = 50;

				// events

				window.addEventListener( 'resize', onWindowResize );

				// debug

				const gui = renderer.inspector.createParameters( 'Parameters' );

				gui.add( size, 'value', 0, 1, 0.001 ).name( 'size' );

				gui.addColor( { color: colorInside.value.getHex( FOUR.SRGBColorSpace ) }, 'color' )
					.name( 'colorInside' )
					.onChange( function ( value ) {

						colorInside.value.set( value );

					} );

				gui.addColor( { color: colorOutside.value.getHex( FOUR.SRGBColorSpace ) }, 'color' )
					.name( 'colorOutside' )
					.onChange( function ( value ) {

						colorOutside.value.set( value );

					} );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				controls.update();

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
