<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - masking</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - masking">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info" class="invert">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Masking</span>
			</div>

			<small>Masking via Post Processing.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';
			import { pass, texture } from '@tnb1j/4js/tsl';
			import { Inspector } from '@tnb1j/4js/addons/inspector/Inspector.js';

			let camera, renderPipeline, renderer;
			let box, torus;

			init();

			function init() {

				// scene

				const baseScene = new FOUR.Scene();
				baseScene.background = new FOUR.Color( 0xe0e0e0 );

				const maskScene1 = new FOUR.Scene();
				box = new FOUR.Mesh( new FOUR.BoxGeometry( 4, 4, 4 ) );
				maskScene1.add( box );

				const maskScene2 = new FOUR.Scene();
				torus = new FOUR.Mesh( new FOUR.TorusGeometry( 3, 1, 16, 32 ) );
				maskScene2.add( torus );

				camera = new FOUR.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.z = 10;

				// textures

				const texture1 = new FOUR.TextureLoader().load( 'textures/758px-Canestra_di_frutta_(Caravaggio).jpg' );
				texture1.colorSpace = FOUR.SRGBColorSpace;
				texture1.minFilter = FOUR.LinearFilter;
				texture1.generateMipmaps = false;
				texture1.flipY = false;

				const texture2 = new FOUR.TextureLoader().load( 'textures/2294472375_24a3b8ef46_o.jpg' );
				texture2.colorSpace = FOUR.SRGBColorSpace;
				texture2.flipY = false;

				// renderer

				renderer = new FOUR.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				window.addEventListener( 'resize', onWindowResize );

				// post processing

				const base = pass( baseScene, camera );
				const sceneMask1 = pass( maskScene1, camera ).a;
				const sceneMask2 = pass( maskScene2, camera ).a;

				let compose = base;
				compose = sceneMask1.mix( compose, texture( texture1 ) );
				compose = sceneMask2.mix( compose, texture( texture2 ) );

				renderPipeline = new FOUR.RenderPipeline( renderer );
				renderPipeline.outputNode = compose;

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			}

			function animate() {

				const time = performance.now() * 0.001 + 6000;

				box.position.x = Math.cos( time / 1.5 ) * 2;
				box.position.y = Math.sin( time ) * 2;
				box.rotation.x = time;
				box.rotation.y = time / 2;

				torus.position.x = Math.cos( time ) * 2;
				torus.position.y = Math.sin( time / 1.5 ) * 2;
				torus.rotation.x = time;
				torus.rotation.y = time / 2;

				renderPipeline.render();

			}

		</script>
	</body>
</html>
