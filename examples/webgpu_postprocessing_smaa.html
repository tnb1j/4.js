<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - postprocessing smaa</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - postprocessing smaa">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>SMAA</span>
			</div>

			<small>Subpixel Morphological Anti-Aliasing.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.webgpu.js",
					"fourjs/webgpu": "../build/4.webgpu.js",
					"fourjs/tsl": "../build/4.tsl.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs/webgpu';
			import { pass } from 'fourjs/tsl';
			import { smaa } from 'fourjs/addons/tsl/display/SMAANode.js';

			import { Inspector } from 'fourjs/addons/inspector/Inspector.js';

			let camera, scene, renderer, renderPipeline;

			const params = {
				enabled: true,
				autoRotate: true

			};

			init();

			function init() {

				renderer = new FOUR.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				//

				camera = new FOUR.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.z = 300;

				scene = new FOUR.Scene();

				const geometry = new FOUR.BoxGeometry( 120, 120, 120 );
				const material1 = new FOUR.MeshBasicMaterial( { color: 0xffffff, wireframe: true } );

				const mesh1 = new FOUR.Mesh( geometry, material1 );
				mesh1.position.x = - 100;
				scene.add( mesh1 );

				const texture = new FOUR.TextureLoader().load( 'textures/brick_diffuse.jpg' );
				texture.colorSpace = FOUR.SRGBColorSpace;

				const material2 = new FOUR.MeshBasicMaterial( { map: texture } );

				const mesh2 = new FOUR.Mesh( geometry, material2 );
				mesh2.position.x = 100;
				scene.add( mesh2 );

				// post processing

				renderPipeline = new FOUR.RenderPipeline( renderer );

				const scenePass = pass( scene, camera ).toInspector( 'Color' );
				const smaaPass = smaa( scenePass );

				renderPipeline.outputNode = smaaPass;

				//

				window.addEventListener( 'resize', onWindowResize );

				const gui = renderer.inspector.createParameters( 'Settings' );

				const smaaFolder = gui.addFolder( 'SMAA' );
				smaaFolder.add( params, 'enabled' ).onChange( ( value ) => {
			
					if ( value === true ) {

						renderPipeline.outputNode = smaaPass;

					} else {

						renderPipeline.outputNode = scenePass;

					}

					renderPipeline.needsUpdate = true;

				} );

				const sceneFolder = gui.addFolder( 'Scene' );
				sceneFolder.add( params, 'autoRotate' );

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			}

			function animate() {

				if ( params.autoRotate === true ) {

					for ( let i = 0; i < scene.children.length; i ++ ) {

						const child = scene.children[ i ];

						child.rotation.x += 0.005;
						child.rotation.y += 0.01;

					}

				}

				renderPipeline.render();

			}

		</script>

	</body>
</html>
