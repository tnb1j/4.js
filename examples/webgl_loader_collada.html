<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - collada</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - collada">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="container"></div>
		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> collada loader<br/>
			Elf Girl by <a href="https://sketchfab.com/yellow09" target="_blank" rel="noopener">halloween</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC Attribution</a>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.module.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js';

			import Stats from '@tnb1j/4js/addons/libs/stats.module.js';

			import { ColladaLoader } from '@tnb1j/4js/addons/loaders/ColladaLoader.js';

			let container, stats, timer;
			let camera, scene, renderer, elf;

			init();

			function init() {

				container = document.getElementById( 'container' );

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 2000 );
				camera.position.set( 8, 10, 8 );
				camera.lookAt( 0, 3, 0 );

				scene = new FOUR.Scene();

				timer = new FOUR.Timer();
				timer.connect( document );

				// loading manager

				const loadingManager = new FOUR.LoadingManager( function () {

					scene.add( elf );

				} );

				// collada

				const loader = new ColladaLoader( loadingManager );
				loader.load( './models/collada/elf/elf.dae', function ( collada ) {

					elf = collada.scene;

				} );

				//

				const ambientLight = new FOUR.AmbientLight( 0xffffff );
				scene.add( ambientLight );

				const directionalLight = new FOUR.DirectionalLight( 0xffffff, 2.5 );
				directionalLight.position.set( 1, 1, 0 ).normalize();
				scene.add( directionalLight );

				//

				renderer = new FOUR.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				container.appendChild( renderer.domElement );

				//

				stats = new Stats();
				container.appendChild( stats.dom );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				render();
				stats.update();

			}

			function render() {

				const delta = timer.getDelta();

				if ( elf !== undefined ) {

					elf.rotation.z += delta * 0.5;

				}

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
