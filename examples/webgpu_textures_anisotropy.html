<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - anisotropic texture filtering</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - anisotropic texture filtering">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			body {
				color: #444;
				background-color: #f1f1f1;
			}
			a {
				color: #08f;
			}

			.lbl {
				color: #fff;
				font-size: 16px;
				font-weight: bold;
				position: absolute;
				bottom: 0px;
				z-index: 100;
				text-shadow: #000 1px 1px 1px;
				background-color: rgba(0,0,0,0.85);
				padding: 1em;
			}

			#lbl_left {
				text-align:left;
				left:0px;
			}

			#lbl_right {
				text-align:left;
				right:0px
			}

			.g { color:#aaa }
			.c { color:#fa0 }
		</style>
	</head>

	<body>

		<div id="info" class="invert">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Anisotropic Texture Filtering</span>
			</div>

			<small>
				Anisotropic texture filtering example.
			</small>
		</div>

		<div id="lbl_left" class="lbl">
		anisotropy: <span class="c" id="val_left"></span><br/>
		</div>

		<div id="lbl_right" class="lbl">
		anisotropy: <span class="c" id="val_right"></span><br/>
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.webgpu.js",
					"fourjs/webgpu": "../build/4.webgpu.js",
					"fourjs/tsl": "../build/4.tsl.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs/webgpu';

			let container;

			let camera, scene1, scene2, renderer;

			let mouseX = 0, mouseY = 0;

			init();

			function init() {

				const SCREEN_WIDTH = window.innerWidth;
				const SCREEN_HEIGHT = window.innerHeight;

				container = document.createElement( 'div' );
				document.body.appendChild( container );

				renderer = new FOUR.WebGPURenderer( { antialias: true, forceWebGL: false } );

				// RENDERER

				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( SCREEN_WIDTH, SCREEN_HEIGHT );
				renderer.setAnimationLoop( render );
				renderer.autoClear = false;

				renderer.domElement.style.position = 'relative';
				container.appendChild( renderer.domElement );

				//

				camera = new FOUR.PerspectiveCamera( 35, SCREEN_WIDTH / SCREEN_HEIGHT, 1, 25000 );
				camera.position.z = 1500;

				scene1 = new FOUR.Scene();
				scene1.fog = new FOUR.Fog( 0xf2f7ff, 1, 25000 );

				scene2 = new FOUR.Scene();
				scene2.fog = new FOUR.Fog( 0xf2f7ff, 1, 25000 );

				scene1.add( new FOUR.AmbientLight( 0xeef0ff, 3 ) );
				scene2.add( new FOUR.AmbientLight( 0xeef0ff, 3 ) );

				const light1 = new FOUR.DirectionalLight( 0xffffff, 6 );
				light1.position.set( 1, 1, 1 );
				scene1.add( light1 );

				const light2 = new FOUR.DirectionalLight( 0xffffff, 6 );
				light2.position.set( 1, 1, 1 );
				scene2.add( light2 );

				// GROUND

				const textureLoader = new FOUR.TextureLoader();

				const maxAnisotropy = renderer.getMaxAnisotropy();

				const texture1 = textureLoader.load( 'textures/crate.gif' );
				const material1 = new FOUR.MeshPhongMaterial( { color: 0xffffff, map: texture1 } );

				texture1.colorSpace = FOUR.SRGBColorSpace;
				texture1.anisotropy = renderer.getMaxAnisotropy();
				texture1.wrapS = texture1.wrapT = FOUR.RepeatWrapping;
				texture1.repeat.set( 512, 512 );

				const texture2 = textureLoader.load( 'textures/crate.gif' );
				const material2 = new FOUR.MeshPhongMaterial( { color: 0xffffff, map: texture2 } );

				texture2.colorSpace = FOUR.SRGBColorSpace;
				texture2.anisotropy = 1;
				texture2.wrapS = texture2.wrapT = FOUR.RepeatWrapping;
				texture2.repeat.set( 512, 512 );

				if ( maxAnisotropy > 0 ) {

					document.getElementById( 'val_left' ).innerHTML = texture1.anisotropy;
					document.getElementById( 'val_right' ).innerHTML = texture2.anisotropy;

				} else {

					document.getElementById( 'val_left' ).innerHTML = 'not supported';
					document.getElementById( 'val_right' ).innerHTML = 'not supported';

				}

				//

				const geometry = new FOUR.PlaneGeometry( 100, 100 );

				const mesh1 = new FOUR.Mesh( geometry, material1 );
				mesh1.rotation.x = - Math.PI / 2;
				mesh1.scale.set( 1000, 1000, 1000 );

				const mesh2 = new FOUR.Mesh( geometry, material2 );
				mesh2.rotation.x = - Math.PI / 2;
				mesh2.scale.set( 1000, 1000, 1000 );

				scene1.add( mesh1 );
				scene2.add( mesh2 );

				//

				document.addEventListener( 'mousemove', onDocumentMouseMove );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function onDocumentMouseMove( event ) {

				const windowHalfX = window.innerWidth / 2;
				const windowHalfY = window.innerHeight / 2;

				mouseX = ( event.clientX - windowHalfX );
				mouseY = ( event.clientY - windowHalfY );

			}

			function render() {

				const SCREEN_WIDTH = window.innerWidth;
				const SCREEN_HEIGHT = window.innerHeight;

				camera.position.x += ( mouseX - camera.position.x ) * .05;
				camera.position.y = FOUR.MathUtils.clamp( camera.position.y + ( - ( mouseY - 200 ) - camera.position.y ) * .05, 50, 1000 );

				camera.lookAt( scene1.position );
				renderer.clear();

				renderer.setScissorTest( true );

				renderer.setScissor( 0, 0, SCREEN_WIDTH / 2 - 2, SCREEN_HEIGHT );
				renderer.render( scene1, camera );

				renderer.setScissorTest( true );

				renderer.setScissor( SCREEN_WIDTH / 2, 0, SCREEN_WIDTH / 2 - 2, SCREEN_HEIGHT );
				renderer.render( scene2, camera );

				renderer.setScissorTest( false );

			}

		</script>

	</body>
</html>
