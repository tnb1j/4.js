<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - postprocessing</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - postprocessing">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Post Processing</span>
			</div>

			<small>Mix of simple post processing effects.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.webgpu.js",
					"@fourjs/core/webgpu": "../build/4.webgpu.js",
					"@fourjs/core/tsl": "../build/4.tsl.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core/webgpu';
			import { pass } from '@fourjs/core/tsl';
			import { dotScreen } from '@fourjs/core/addons/tsl/display/DotScreenNode.js';
			import { rgbShift } from '@fourjs/core/addons/tsl/display/RGBShiftNode.js';
			import { Inspector } from '@fourjs/core/addons/inspector/Inspector.js';

			let camera, renderer, renderPipeline;
			let object;

			init();

			function init() {

				renderer = new FOUR.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				//

				camera = new FOUR.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.z = 400;

				const scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x000000 );
				scene.fog = new FOUR.Fog( 0x000000, 1, 1000 );

				object = new FOUR.Object3D();
				scene.add( object );

				const geometry = new FOUR.SphereGeometry( 1, 4, 4 );
				const material = new FOUR.MeshPhongMaterial( { color: 0xffffff, flatShading: true } );

				for ( let i = 0; i < 100; i ++ ) {

					const mesh = new FOUR.Mesh( geometry, material );
					mesh.position.set( Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5 ).normalize();
					mesh.position.multiplyScalar( Math.random() * 400 );
					mesh.rotation.set( Math.random() * 2, Math.random() * 2, Math.random() * 2 );
					mesh.scale.x = mesh.scale.y = mesh.scale.z = Math.random() * 50;
					object.add( mesh );

				}

				scene.add( new FOUR.AmbientLight( 0xcccccc ) );

				const light = new FOUR.DirectionalLight( 0xffffff, 3 );
				light.position.set( 1, 1, 1 );
				scene.add( light );

				// postprocessing

				renderPipeline = new FOUR.RenderPipeline( renderer );

				const scenePass = pass( scene, camera );
				const scenePassColor = scenePass.getTextureNode().toInspector( 'Scene Color' );

				const dotScreenPass = dotScreen( scenePassColor );
				dotScreenPass.scale.value = 0.3;

				const rgbShiftPass = rgbShift( dotScreenPass );
				rgbShiftPass.amount.value = 0.001;

				renderPipeline.outputNode = rgbShiftPass;

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				object.rotation.x += 0.005;
				object.rotation.y += 0.01;

				renderPipeline.render();

			}

		</script>

	</body>
</html>
