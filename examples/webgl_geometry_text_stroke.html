<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - simple text from json</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - simple text from json">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			body {
				background-color: #f0f0f0;
				color: #444;
			}
			a {
				color: #08f;
			}
		</style>
	</head>
	<body>
		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> webgl - simple text from json fonts
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.module.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs';

			import { OrbitControls } from 'fourjs/addons/controls/OrbitControls.js';
			import { SVGLoader } from 'fourjs/addons/loaders/SVGLoader.js';
			import { FontLoader } from 'fourjs/addons/loaders/FontLoader.js';

			let camera, scene, renderer;

			init();

			function init( ) {

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 10000 );
				camera.position.set( 0, - 400, 1000 );

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0xf0f0f0 );

				const loader = new FontLoader();
				loader.load( 'fonts/MPLUSRounded1c/MPLUSRounded1c-Regular.typeface.json', function ( font ) {

					const color = new FOUR.Color( 0x006699 );

					const matDark = new FOUR.MeshBasicMaterial( {
						color: color,
						side: FOUR.DoubleSide
					} );

					const matLite = new FOUR.MeshBasicMaterial( {
						color: color,
						transparent: true,
						opacity: 0.4,
						side: FOUR.DoubleSide
					} );

					const material = {
						dark: matDark,
						lite: matLite,
						color: color
					};

					const english = '   4.js\nStroke text.'; // Left to right

					const hebrew = 'טקסט קו'; // Right to left

					const chinese = '文字描邊'; // Top to bottom

					const message1 = generateStrokeText( font, material, english, 80, 'ltr' );

					const message2 = generateStrokeText( font, material, hebrew, 80, 'rtl' );

					const message3 = generateStrokeText( font, material, chinese, 80, 'tb' );

					message1.position.x = - 100;

					message2.position.x = - 100;
					message2.position.y = - 300;

					message3.position.x = 300;
					message3.position.y = - 300;

					scene.add( message1, message2, message3 );

					render();

				} ); //end load function

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 0, 0 );
				controls.update();

				controls.addEventListener( 'change', render );

				window.addEventListener( 'resize', onWindowResize );

			} // end init

			function generateStrokeText( font, material, message, size, direction = 'ltr' ) {

				const shapes = font.generateShapes( message, size, direction );

				const geometry = new FOUR.ShapeGeometry( shapes );

				const strokeText = new FOUR.Group();

				geometry.computeBoundingBox();

				const xMid = - 0.5 * ( geometry.boundingBox.max.x - geometry.boundingBox.min.x );

				geometry.translate( xMid, 0, 0 );

				// make shape ( N.B. edge view not visible )

				const text = new FOUR.Mesh( geometry, material.lite );

				text.position.z = - 150;

				strokeText.add( text );

				// make line shape ( N.B. edge view remains visible )

				const holeShapes = [];

				for ( let i = 0; i < shapes.length; i ++ ) {

					const shape = shapes[ i ];

					if ( shape.holes && shape.holes.length > 0 ) {

						for ( let j = 0; j < shape.holes.length; j ++ ) {

							const hole = shape.holes[ j ];
							holeShapes.push( hole );

						}

					}

				}

				shapes.push( ...holeShapes );

				const style = SVGLoader.getStrokeStyle( 5, material.color.getStyle() );

				for ( let i = 0; i < shapes.length; i ++ ) {

					const shape = shapes[ i ];

					const points = shape.getPoints();

					const geometry = SVGLoader.pointsToStroke( points, style );

					geometry.translate( xMid, 0, 0 );

					const strokeMesh = new FOUR.Mesh( geometry, material.dark );
					strokeText.add( strokeMesh );

				}

				return strokeText;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				render();

			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
