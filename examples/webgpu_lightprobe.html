<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - light probe</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - light probe">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Light Probe</span>
			</div>

			<small>
				Light probes and environment lighting.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';

			import { Inspector } from '@tnb1j/4js/addons/inspector/Inspector.js';

			import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';

			import { LightProbeGenerator } from '@tnb1j/4js/addons/lights/LightProbeGenerator.js';

			import { LightProbeHelper } from '@tnb1j/4js/addons/helpers/LightProbeHelperGPU.js';

			let mesh, renderer, scene, camera;

			let gui;

			let lightProbe;
			let directionalLight;

			// linear color space
			const API = {
				lightProbeIntensity: 1.0,
				directionalLightIntensity: 0.6,
				envMapIntensity: 1
			};

			init();

			function init() {

				// renderer
				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				// tone mapping
				renderer.toneMapping = FOUR.NoToneMapping;

				// scene
				scene = new FOUR.Scene();

				// camera
				camera = new FOUR.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.set( 0, 0, 30 );

				// controls
				const controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 10;
				controls.maxDistance = 50;
				controls.enablePan = false;

				// probe
				lightProbe = new FOUR.LightProbe();
				scene.add( lightProbe );

				// light
				directionalLight = new FOUR.DirectionalLight( 0xffffff, API.directionalLightIntensity );
				directionalLight.position.set( 10, 10, 10 );
				scene.add( directionalLight );

				// envmap
				const genCubeUrls = function ( prefix, postfix ) {

					return [
						prefix + 'px' + postfix, prefix + 'nx' + postfix,
						prefix + 'py' + postfix, prefix + 'ny' + postfix,
						prefix + 'pz' + postfix, prefix + 'nz' + postfix
					];

				};

				const urls = genCubeUrls( 'textures/cube/pisa/', '.png' );

				new FOUR.CubeTextureLoader().load( urls, function ( cubeTexture ) {

					scene.background = cubeTexture;

					lightProbe.copy( LightProbeGenerator.fromCubeTexture( cubeTexture ) );
					lightProbe.intensity = API.lightProbeIntensity;
					lightProbe.position.set( - 10, 0, 0 ); // position not used in scene lighting calculations (helper honors the position, however)

					const geometry = new FOUR.SphereGeometry( 5, 64, 32 );
					//const geometry = new FOUR.TorusKnotGeometry( 4, 1.5, 256, 32, 2, 3 );

					const material = new FOUR.MeshStandardMaterial( {
						color: 0xffffff,
						metalness: 0,
						roughness: 0,
						envMap: cubeTexture,
						envMapIntensity: API.envMapIntensity,
					} );

					// mesh
					mesh = new FOUR.Mesh( geometry, material );
					scene.add( mesh );

					// helper
					const helper = new LightProbeHelper( lightProbe, 1 );
					scene.add( helper );

				} );


				// gui
				gui = renderer.inspector.createParameters( 'Intensity' );

				gui.add( API, 'lightProbeIntensity', 0, 1, 0.02 )
					.name( 'light probe' )
					.onChange( function () {

						lightProbe.intensity = API.lightProbeIntensity;

					} );

				gui.add( API, 'directionalLightIntensity', 0, 1, 0.02 )
					.name( 'directional light' )
					.onChange( function () {

						directionalLight.intensity = API.directionalLightIntensity;

					} );

				gui.add( API, 'envMapIntensity', 0, 1, 0.02 )
					.name( 'envMap' )
					.onChange( function () {

						mesh.material.envMapIntensity = API.envMapIntensity;

					} );

				// listener
				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				renderer.setSize( window.innerWidth, window.innerHeight );

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();


			}

			function animate() {

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
