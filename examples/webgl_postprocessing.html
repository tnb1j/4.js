<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - postprocessing</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - postprocessing">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>
		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.module.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core';

			import { EffectComposer } from '@fourjs/core/addons/postprocessing/EffectComposer.js';
			import { RenderPass } from '@fourjs/core/addons/postprocessing/RenderPass.js';
			import { ShaderPass } from '@fourjs/core/addons/postprocessing/ShaderPass.js';

			import { RGBShiftShader } from '@fourjs/core/addons/shaders/RGBShiftShader.js';
			import { DotScreenShader } from '@fourjs/core/addons/shaders/DotScreenShader.js';
			import { OutputPass } from '@fourjs/core/addons/postprocessing/OutputPass.js';

			let camera, renderer, composer;
			let object;

			init();

			function init() {

				renderer = new FOUR.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				//

				camera = new FOUR.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.z = 400;

				const scene = new FOUR.Scene();
				scene.fog = new FOUR.Fog( 0x000000, 1, 1000 );

				object = new FOUR.Object3D();
				scene.add( object );

				const geometry = new FOUR.SphereGeometry( 1, 4, 4 );
				const material = new FOUR.MeshPhongMaterial( { color: 0xffffff, flatShading: true } );

				for ( let i = 0; i < 100; i ++ ) {

					const mesh = new FOUR.Mesh( geometry, material );
					mesh.position.set( Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5 ).normalize();
					mesh.position.multiplyScalar( Math.random() * 400 );
					mesh.rotation.set( Math.random() * 2, Math.random() * 2, Math.random() * 2 );
					mesh.scale.x = mesh.scale.y = mesh.scale.z = Math.random() * 50;
					object.add( mesh );

				}

				scene.add( new FOUR.AmbientLight( 0xcccccc ) );

				const light = new FOUR.DirectionalLight( 0xffffff, 3 );
				light.position.set( 1, 1, 1 );
				scene.add( light );

				// postprocessing

				composer = new EffectComposer( renderer );
				composer.addPass( new RenderPass( scene, camera ) );

				const effect1 = new ShaderPass( DotScreenShader );
				effect1.uniforms[ 'scale' ].value = 4;
				composer.addPass( effect1 );

				const effect2 = new ShaderPass( RGBShiftShader );
				effect2.uniforms[ 'amount' ].value = 0.0015;
				composer.addPass( effect2 );

				const effect3 = new OutputPass();
				composer.addPass( effect3 );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );
				composer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				object.rotation.x += 0.005;
				object.rotation.y += 0.01;

				composer.render();

			}

		</script>

	</body>
</html>
