<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - exporter - ply</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - exporter - ply">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>
		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> webgl - exporter - ply
		</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.module.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core';

			import { OrbitControls } from '@fourjs/core/addons/controls/OrbitControls.js';
			import { PLYExporter } from '@fourjs/core/addons/exporters/PLYExporter.js';
			import { GUI } from '@fourjs/core/addons/libs/lil-gui.module.min.js';

			let scene, camera, renderer, exporter, mesh;

			const params = {
				exportASCII: exportASCII,
				exportBinaryBigEndian: exportBinaryBigEndian,
				exportBinaryLittleEndian: exportBinaryLittleEndian
			};

			init();

			function init() {

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 4, 2, 4 );

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0xa0a0a0 );
				scene.fog = new FOUR.Fog( 0xa0a0a0, 4, 20 );

				exporter = new PLYExporter();

				//

				const hemiLight = new FOUR.HemisphereLight( 0xffffff, 0x444444, 3 );
				hemiLight.position.set( 0, 20, 0 );
				scene.add( hemiLight );

				const directionalLight = new FOUR.DirectionalLight( 0xffffff, 3 );
				directionalLight.position.set( 0, 20, 10 );
				directionalLight.castShadow = true;
				directionalLight.shadow.camera.top = 2;
				directionalLight.shadow.camera.bottom = - 2;
				directionalLight.shadow.camera.left = - 2;
				directionalLight.shadow.camera.right = 2;
				scene.add( directionalLight );

				// ground

				const ground = new FOUR.Mesh( new FOUR.PlaneGeometry( 40, 40 ), new FOUR.MeshPhongMaterial( { color: 0xcbcbcb, depthWrite: false } ) );
				ground.rotation.x = - Math.PI / 2;
				ground.receiveShadow = true;
				scene.add( ground );

				const grid = new FOUR.GridHelper( 40, 20, 0x000000, 0x000000 );
				grid.material.opacity = 0.2;
				grid.material.transparent = true;
				scene.add( grid );

				// export mesh

				const geometry = new FOUR.BoxGeometry();
				const material = new FOUR.MeshPhongMaterial( { vertexColors: true } );

				// color vertices based on vertex positions
				const positions = geometry.getAttribute( 'position' );
				const colors = new FOUR.Uint8BufferAttribute( positions.array, 3, true );
				const vertex = new FOUR.Vector3();
			
				for ( let i = 0, l = positions.count; i < l; i ++ ) {

					vertex.fromBufferAttribute( positions, i );

					colors.setX( i, vertex.x > 0 ? 0.5 : 0 );
					colors.setY( i, vertex.y > 0 ? 0.5 : 0 );
					colors.setZ( i, vertex.z > 0 ? 0.5 : 0 );

				}

				geometry.setAttribute( 'color', colors );

				mesh = new FOUR.Mesh( geometry, material );
				mesh.castShadow = true;
				mesh.position.y = 0.5;
				scene.add( mesh );

				//

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				document.body.appendChild( renderer.domElement );

				//

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 0.5, 0 );
				controls.update();

				//

				window.addEventListener( 'resize', onWindowResize );

				const gui = new GUI();

				gui.add( params, 'exportASCII' ).name( 'Export PLY (ASCII)' );
				gui.add( params, 'exportBinaryBigEndian' ).name( 'Export PLY (Binary BE)' );
				gui.add( params, 'exportBinaryLittleEndian' ).name( 'Export PLY (Binary LE)' );
				gui.open();

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				renderer.render( scene, camera );

			}

			function exportASCII() {

				exporter.parse( mesh, function ( result ) {

					saveString( result, 'box.ply' );

				} );

			}

			function exportBinaryBigEndian() {

				exporter.parse( mesh, function ( result ) {

					saveArrayBuffer( result, 'box.ply' );

				}, { binary: true } );

			}

			function exportBinaryLittleEndian() {

				exporter.parse( mesh, function ( result ) {

					saveArrayBuffer( result, 'box.ply' );

				}, { binary: true, littleEndian: true } );

			}

			const link = document.createElement( 'a' );
			link.style.display = 'none';
			document.body.appendChild( link );

			function save( blob, filename ) {

				link.href = URL.createObjectURL( blob );
				link.download = filename;
				link.click();

			}

			function saveString( text, filename ) {

				save( new Blob( [ text ], { type: 'text/plain' } ), filename );

			}

			function saveArrayBuffer( buffer, filename ) {

				save( new Blob( [ buffer ], { type: 'application/octet-stream' } ), filename );

			}

		</script>

	</body>
</html>
