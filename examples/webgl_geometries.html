<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - geometries</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - geometries">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info"><a href="../" target="_blank" rel="noopener">4.js</a> webgl - geometries</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.module.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js';

			import Stats from '@tnb1j/4js/addons/libs/stats.module.js';

			import { ParametricGeometry } from '@tnb1j/4js/addons/geometries/ParametricGeometry.js';
			import { plane, klein, mobius } from '@tnb1j/4js/addons/geometries/ParametricFunctions.js';

			let camera, scene, renderer, stats;

			init();

			function init() {

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 2000 );
				camera.position.y = 500;

				scene = new FOUR.Scene();

				let object, geometry;

				const ambientLight = new FOUR.AmbientLight( 0xcccccc, 1.5 );
				scene.add( ambientLight );

				const pointLight = new FOUR.PointLight( 0xffffff, 2.5, 0, 0 );
				camera.add( pointLight );
				scene.add( camera );

				const map = new FOUR.TextureLoader().load( 'textures/uv_grid_opengl.jpg' );
				map.wrapS = map.wrapT = FOUR.RepeatWrapping;
				map.anisotropy = 16;
				map.colorSpace = FOUR.SRGBColorSpace;

				const material = new FOUR.MeshPhongMaterial( { map: map, side: FOUR.DoubleSide } );

				//

				object = new FOUR.Mesh( new FOUR.SphereGeometry( 75, 20, 10 ), material );
				object.position.set( - 300, 0, 300 );
				scene.add( object );

				object = new FOUR.Mesh( new FOUR.IcosahedronGeometry( 75 ), material );
				object.position.set( - 100, 0, 300 );
				scene.add( object );

				object = new FOUR.Mesh( new FOUR.OctahedronGeometry( 75 ), material );
				object.position.set( 100, 0, 300 );
				scene.add( object );

				object = new FOUR.Mesh( new FOUR.TetrahedronGeometry( 75 ), material );
				object.position.set( 300, 0, 300 );
				scene.add( object );

				//

				object = new FOUR.Mesh( new FOUR.PlaneGeometry( 100, 100, 4, 4 ), material );
				object.position.set( - 300, 0, 100 );
				scene.add( object );

				object = new FOUR.Mesh( new FOUR.BoxGeometry( 100, 100, 100, 4, 4, 4 ), material );
				object.position.set( - 100, 0, 100 );
				scene.add( object );

				object = new FOUR.Mesh( new FOUR.CircleGeometry( 50, 20, 0, Math.PI * 2 ), material );
				object.position.set( 100, 0, 100 );
				scene.add( object );

				object = new FOUR.Mesh( new FOUR.RingGeometry( 10, 50, 20, 5, 0, Math.PI * 2 ), material );
				object.position.set( 300, 0, 100 );
				scene.add( object );

				//

				object = new FOUR.Mesh( new FOUR.CylinderGeometry( 25, 75, 100, 40, 5 ), material );
				object.position.set( - 300, 0, - 100 );
				scene.add( object );

				const points = [];

				for ( let i = 0; i < 50; i ++ ) {

					points.push( new FOUR.Vector2( Math.sin( i * 0.2 ) * Math.sin( i * 0.1 ) * 15 + 50, ( i - 5 ) * 2 ) );

				}

				object = new FOUR.Mesh( new FOUR.LatheGeometry( points, 20 ), material );
				object.position.set( - 100, 0, - 100 );
				scene.add( object );

				object = new FOUR.Mesh( new FOUR.TorusGeometry( 50, 20, 20, 20 ), material );
				object.position.set( 100, 0, - 100 );
				scene.add( object );

				object = new FOUR.Mesh( new FOUR.TorusKnotGeometry( 50, 10, 50, 20 ), material );
				object.position.set( 300, 0, - 100 );
				scene.add( object );

				//

				object = new FOUR.Mesh( new FOUR.CapsuleGeometry( 20, 50 ), material );
				object.position.set( - 300, 0, - 300 );
				scene.add( object );

				geometry = new ParametricGeometry( plane, 10, 10 );
				geometry.scale( 100, 100, 100 );
				geometry.center();
				object = new FOUR.Mesh( geometry, material );
				object.position.set( - 100, 0, - 300 );
				scene.add( object );

				geometry = new ParametricGeometry( klein, 20, 20 );
				object = new FOUR.Mesh( geometry, material );
				object.position.set( 100, 0, - 300 );
				object.scale.multiplyScalar( 5 );
				scene.add( object );

				geometry = new ParametricGeometry( mobius, 20, 20 );
				object = new FOUR.Mesh( geometry, material );
				object.position.set( 300, 0, - 300 );
				object.scale.multiplyScalar( 30 );
				scene.add( object );

				//

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				stats = new Stats();
				document.body.appendChild( stats.dom );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				render();
				stats.update();

			}

			function render() {

				const timer = Date.now() * 0.0001;

				camera.position.x = Math.cos( timer ) * 800;
				camera.position.z = Math.sin( timer ) * 800;

				camera.lookAt( scene.position );

				scene.traverse( function ( object ) {

					if ( object.isMesh === true ) {

						object.rotation.x = timer * 5;
						object.rotation.y = timer * 2.5;

					}

				} );

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
