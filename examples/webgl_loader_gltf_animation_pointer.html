<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - animation - keyframes</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - animation - keyframes">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			body {
				background-color: #bfe3dd;
				color: #000;
			}

			a {
				color: #2983ff;
			}
		</style>
	</head>

	<body>

		<div id="container"></div>

		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> + <a href="https://github.com/KhronosGroup/glTF/tree/main/extensions/2.0/Khronos/KHR_animation_pointer" target="_blank" rel="noopener">KHR_animation_pointer</a> using <a href="https://www.npmjs.com/package/@needle-tools/three-animation-pointer" target="_blank" rel="noopener">@needle-tools/three-animation-pointer</a><br/>
			DragonDispersion from <a href="https://github.com/KhronosGroup/glTF-Sample-Assets/tree/main/Models/DragonDispersion" target="_blank" rel="noopener">glTF-Sample-Assets</a>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.module.js",
					"@tnb1j/4js/addons/": "./jsm/",
          			"@needle-tools/three-animation-pointer": "https://cdn.jsdelivr.net/npm/@needle-tools/three-animation-pointer@1.0.7"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js';

			import Stats from '@tnb1j/4js/addons/libs/stats.module.js';

			import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';
			import { RoomEnvironment } from '@tnb1j/4js/addons/environments/RoomEnvironment.js';

			import { GLTFLoader } from '@tnb1j/4js/addons/loaders/GLTFLoader.js';
			import { DRACOLoader, DRACO_GLTF_CONFIG } from '@tnb1j/4js/addons/loaders/DRACOLoader.js';
			import { KTX2Loader } from '@tnb1j/4js/addons/loaders/KTX2Loader.js';
			import { GLTFAnimationPointerExtension } from '@needle-tools/three-animation-pointer';

			let mixer;

			const timer = new FOUR.Timer();
			timer.connect( document );
			const container = document.getElementById( 'container' );

			const stats = new Stats();
			container.appendChild( stats.dom );

			const renderer = new FOUR.WebGLRenderer( { antialias: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			container.appendChild( renderer.domElement );

			const pmremGenerator = new FOUR.PMREMGenerator( renderer );

			const scene = new FOUR.Scene();
			scene.background = new FOUR.Color( 0xbfe3dd );
			scene.environment = pmremGenerator.fromScene( new RoomEnvironment(), 0.04 ).texture;

			const camera = new FOUR.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, .2, 100 );
			camera.position.set( - 3, 2, 6 );

			const controls = new OrbitControls( camera, renderer.domElement );
			controls.target.set( 0, 0.5, 0 );
			controls.update();
			controls.enablePan = false;
			controls.enableDamping = true;

			const dracoLoader = new DRACOLoader();
			dracoLoader.setDecoderPath( DRACO_GLTF_CONFIG );
			

			const ktx2Loader = new KTX2Loader()
				.detectSupport( renderer );

			const loader = new GLTFLoader();
			loader.setDRACOLoader( dracoLoader );
			loader.setKTX2Loader( ktx2Loader );

			loader.register( p => {

				return new GLTFAnimationPointerExtension( p );

			} );

			loader.load( 'https://cloud.needle.tools/-/assets/Z23hmXB27L6Db-optimized/file', function ( gltf ) {

				const model = gltf.scene;
				scene.add( model );

				mixer = new FOUR.AnimationMixer( model );
				mixer.clipAction( gltf.animations[ 0 ] ).play();

				renderer.setAnimationLoop( animate );

			}, undefined, function ( e ) {

				console.error( e );

			} );


			window.onresize = function () {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			};


			function animate() {

				timer.update();

				const delta = timer.getDelta();

				mixer.update( delta );

				controls.update();

				stats.update();

				renderer.render( scene, camera );

			}


		</script>

	</body>

</html>
