<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - webgpu partial texture update</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - webgpu partial texture update">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Partial Texture Update</span>
			</div>

			<small>
				Replace parts of an existing texture with all data of another texture.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';

			let camera, scene, renderer, timer, dataTexture, diffuseMap;

			let last = 0;
			const position = new FOUR.Vector2();
			const color = new FOUR.Color();

			init();

			function init() {

				camera = new FOUR.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.01, 10 );
				camera.position.z = 2;

				scene = new FOUR.Scene();

				timer = new FOUR.Timer();
				timer.connect( document );

				const loader = new FOUR.TextureLoader();
				diffuseMap = loader.load( 'textures/carbon/Carbon.png' );
				diffuseMap.colorSpace = FOUR.SRGBColorSpace;
				diffuseMap.minFilter = FOUR.LinearFilter;
				diffuseMap.generateMipmaps = false;

				const geometry = new FOUR.PlaneGeometry( 2, 2 );
				const material = new FOUR.MeshBasicMaterial( { map: diffuseMap } );

				const mesh = new FOUR.Mesh( geometry, material );
				scene.add( mesh );

				//

				const width = 32;
				const height = 32;

				const data = new Uint8Array( width * height * 4 );
				dataTexture = new FOUR.DataTexture( data, width, height );
				dataTexture.colorSpace = FOUR.SRGBColorSpace;

				//

				renderer = new FOUR.WebGPURenderer( { antialias: true, forceWebGL: false } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				const elapsedTime = timer.getElapsed();


				renderer.render( scene, camera );


				if ( elapsedTime - last > 0.1 ) {

					last = elapsedTime;

					position.x = ( 32 * FOUR.MathUtils.randInt( 1, 16 ) ) - 32;
					position.y = ( 32 * FOUR.MathUtils.randInt( 1, 16 ) ) - 32;

					// generate new color data
					updateDataTexture( dataTexture );

					// perform copy from src to dest texture to a random position

					renderer.copyTextureToTexture( dataTexture, diffuseMap, null, position );

				}

			}

			function updateDataTexture( texture ) {

				const size = texture.image.width * texture.image.height;
				const data = texture.image.data;

				// generate a random color and update texture data

				color.setHex( Math.random() * 0xffffff );

				const r = Math.floor( color.r * 255 );
				const g = Math.floor( color.g * 255 );
				const b = Math.floor( color.b * 255 );

				for ( let i = 0; i < size; i ++ ) {

					const stride = i * 4;

					data[ stride ] = r;
					data[ stride + 1 ] = g;
					data[ stride + 2 ] = b;
					data[ stride + 3 ] = 1;

				}

				texture.needsUpdate = true;

			}

		</script>

	</body>
</html>
