<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - occlusion</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - occlusion">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Occlusion</span>
			</div>

			<small>
				The plane is green when the sphere is completely occluded.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';
			import { uniform } from '@tnb1j/4js/tsl';

			import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';

			let camera, scene, renderer, controls;

			class OcclusionNode extends FOUR.Node {

				constructor( testObject, normalColor, occludedColor ) {

					super( 'vec3' );

					this.updateType = FOUR.NodeUpdateType.OBJECT;

					this.uniformNode = uniform( new FOUR.Color() );

					this.testObject = testObject;
					this.normalColor = normalColor;
					this.occludedColor = occludedColor;

				}

				async update( frame ) {

					const isOccluded = frame.renderer.isOccluded( this.testObject );

					this.uniformNode.value.copy( isOccluded ? this.occludedColor : this.normalColor );

				}

				setup( /* builder */ ) {

					return this.uniformNode;

				}

			}

			init();

			async function init() {

				camera = new FOUR.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.01, 100 );
				camera.position.z = 7;

				scene = new FOUR.Scene();

				// lights

				const ambientLight = new FOUR.AmbientLight( 0xb0b0b0 );

				const light = new FOUR.DirectionalLight( 0xFFFFFF, 1.0 );
				light.position.set( 0.32, 0.39, 0.7 );

				scene.add( ambientLight );
				scene.add( light );

				// models

				const planeGeometry = new FOUR.PlaneGeometry( 2, 2 );
				const sphereGeometry = new FOUR.SphereGeometry( 0.5 );

				const plane = new FOUR.Mesh( planeGeometry, new FOUR.MeshPhongNodeMaterial( { color: 0x00ff00, side: FOUR.DoubleSide } ) );
				const sphere = new FOUR.Mesh( sphereGeometry, new FOUR.MeshPhongNodeMaterial( { color: 0xffff00 } ) );

				const instanceUniform = new OcclusionNode( sphere, new FOUR.Color( 0x0000ff ), new FOUR.Color( 0x00ff00 ) );

				plane.material.colorNode = instanceUniform;

				sphere.position.z = - 1;
				sphere.occlusionTest = true;

				scene.add( plane );
				scene.add( sphere );

				// renderer

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( render );
				document.body.appendChild( renderer.domElement );

				// controls

				controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 3;
				controls.maxDistance = 25;

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
