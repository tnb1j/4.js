<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js svg - sandbox</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js svg - sandbox">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			svg {
				display: block;
			}
		</style>
	</head>
	<body>
		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.module.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core';

			import Stats from '@fourjs/core/addons/libs/stats.module.js';
			import { OrbitControls } from '@fourjs/core/addons/controls/OrbitControls.js';

			import { SVGRenderer, SVGObject } from '@fourjs/core/addons/renderers/SVGRenderer.js';

			FOUR.ColorManagement.enabled = false;

			let camera, scene, renderer, stats, controls;

			let group;

			init();
			animate();

			function init() {

				camera = new FOUR.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 1, 10000 );
				camera.position.z = 500;

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0xf0f0f0 );

				// QRCODE

				const loader = new FOUR.BufferGeometryLoader();
				loader.load( 'models/json/QRCode_buffergeometry.json', function ( geometry ) {

					mesh = new FOUR.Mesh( geometry, new FOUR.MeshLambertMaterial( { vertexColors: true } ) );
					mesh.scale.x = mesh.scale.y = mesh.scale.z = 2;
					scene.add( mesh );

				} );

				// CUBES

				const boxGeometry = new FOUR.BoxGeometry( 100, 100, 100 );

				let mesh = new FOUR.Mesh( boxGeometry, new FOUR.MeshBasicMaterial( { color: 0x0000ff, opacity: 0.5, transparent: true } ) );
				mesh.position.x = 500;
				mesh.rotation.x = Math.random();
				mesh.rotation.y = Math.random();
				mesh.scale.x = mesh.scale.y = mesh.scale.z = 2;
				scene.add( mesh );

				mesh = new FOUR.Mesh( boxGeometry, new FOUR.MeshBasicMaterial( { color: Math.random() * 0xffffff } ) );
				mesh.position.x = 500;
				mesh.position.y = 500;
				mesh.rotation.x = Math.random();
				mesh.rotation.y = Math.random();
				mesh.scale.x = mesh.scale.y = mesh.scale.z = 2;
				scene.add( mesh );

				// PLANE

				mesh = new FOUR.Mesh( new FOUR.PlaneGeometry( 100, 100 ), new FOUR.MeshBasicMaterial( { color: Math.random() * 0xffffff, side: FOUR.DoubleSide } ) );
				mesh.position.y = - 500;
				mesh.scale.x = mesh.scale.y = mesh.scale.z = 2;
				scene.add( mesh );

				// CYLINDER

				mesh = new FOUR.Mesh( new FOUR.CylinderGeometry( 20, 100, 200, 10 ), new FOUR.MeshBasicMaterial( { color: Math.random() * 0xffffff } ) );
				mesh.position.x = - 500;
				mesh.rotation.x = - Math.PI / 2;
				mesh.scale.x = mesh.scale.y = mesh.scale.z = 2;
				scene.add( mesh );

				// POLYFIELD

				const geometry = new FOUR.BufferGeometry();
				const material = new FOUR.MeshBasicMaterial( { vertexColors: true, side: FOUR.DoubleSide } );

				const v = new FOUR.Vector3();
				const v0 = new FOUR.Vector3();
				const v1 = new FOUR.Vector3();
				const v2 = new FOUR.Vector3();
				const color = new FOUR.Color();

				const vertices = [];
				const colors = [];

				for ( let i = 0; i < 100; i ++ ) {

					v.set(
						Math.random() * 1000 - 500,
						Math.random() * 1000 - 500,
						Math.random() * 1000 - 500
					);

					v0.set(
						Math.random() * 100 - 50,
						Math.random() * 100 - 50,
						Math.random() * 100 - 50
					);

					v1.set(
						Math.random() * 100 - 50,
						Math.random() * 100 - 50,
						Math.random() * 100 - 50
					);

					v2.set(
						Math.random() * 100 - 50,
						Math.random() * 100 - 50,
						Math.random() * 100 - 50
					);

					v0.add( v );
					v1.add( v );
					v2.add( v );

					color.setHex( Math.random() * 0xffffff );

					// create a single triangle

					vertices.push( v0.x, v0.y, v0.z );
					vertices.push( v1.x, v1.y, v1.z );
					vertices.push( v2.x, v2.y, v2.z );

					colors.push( color.r, color.g, color.b );
					colors.push( color.r, color.g, color.b );
					colors.push( color.r, color.g, color.b );

				}

				geometry.setAttribute( 'position', new FOUR.Float32BufferAttribute( vertices, 3 ) );
				geometry.setAttribute( 'color', new FOUR.Float32BufferAttribute( colors, 3 ) );

				group = new FOUR.Mesh( geometry, material );
				group.scale.set( 2, 2, 2 );
				scene.add( group );

				// SPRITES

				for ( let i = 0; i < 50; i ++ ) {

					const material = new FOUR.SpriteMaterial( { color: Math.random() * 0xffffff } );
					const sprite = new FOUR.Sprite( material );
					sprite.position.x = Math.random() * 1000 - 500;
					sprite.position.y = Math.random() * 1000 - 500;
					sprite.position.z = Math.random() * 1000 - 500;
					sprite.scale.set( 64, 64, 1 );
					scene.add( sprite );

				}

				// CUSTOM

				const node = document.createElementNS( 'http://www.w3.org/2000/svg', 'circle' );
				node.setAttribute( 'stroke', 'black' );
				node.setAttribute( 'fill', 'red' );
				node.setAttribute( 'r', '40' );

				for ( let i = 0; i < 50; i ++ ) {

					const object = new SVGObject( node.cloneNode() );
					object.position.x = Math.random() * 1000 - 500;
					object.position.y = Math.random() * 1000 - 500;
					object.position.z = Math.random() * 1000 - 500;
					scene.add( object );

				}

				// CUSTOM FROM FILE

				const fileLoader = new FOUR.FileLoader();
				fileLoader.load( 'models/svg/hexagon.svg', function ( svg ) {

					const node = document.createElementNS( 'http://www.w3.org/2000/svg', 'g' );
					const parser = new DOMParser();
					const doc = parser.parseFromString( svg, 'image/svg+xml' );

					node.appendChild( doc.documentElement );

					const object = new SVGObject( node );
					object.position.x = 500;
					scene.add( object );

				} );

				// LIGHTS

				const ambient = new FOUR.AmbientLight( 0x80ffff );
				scene.add( ambient );

				const directional = new FOUR.DirectionalLight( 0xffff00 );
				directional.position.set( - 1, 0.5, 0 );
				scene.add( directional );

				renderer = new SVGRenderer();
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setQuality( 'low' );
				document.body.appendChild( renderer.domElement );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;

				stats = new Stats();
				document.body.appendChild( stats.dom );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				requestAnimationFrame( animate );

				render();
				stats.update();

			}

			function render() {

				group.rotation.x += 0.01;

				controls.update();

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
