<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js WebGL - MDDLoader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js WebGL - MDDLoader">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> - MDDLoader
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.module.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js';

			import { MDDLoader } from '@tnb1j/4js/addons/loaders/MDDLoader.js';

			let camera, scene, renderer, mixer, timer;

			init();

			function init() {

				scene = new FOUR.Scene();

				camera = new FOUR.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 8, 8, 8 );
				camera.lookAt( scene.position );

				timer = new FOUR.Timer();
				timer.connect( document );

				//

				const loader = new MDDLoader();
				loader.load( 'models/mdd/cube.mdd', function ( result ) {

					const morphTargets = result.morphTargets;
					const clip = result.clip;
					// clip.optimize(); // optional

					const geometry = new FOUR.BoxGeometry();
					geometry.morphAttributes.position = morphTargets; // apply morph targets

					const material = new FOUR.MeshNormalMaterial();

					const mesh = new FOUR.Mesh( geometry, material );
					scene.add( mesh );

					mixer = new FOUR.AnimationMixer( mesh );
					mixer.clipAction( clip ).play(); // use clip

				} );

				//

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				if ( mixer ) mixer.update( delta );

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
