<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - light probe from cubeCamera</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - light probe from cubeCamera">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>
		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> webgl - light probe from cubeCamera
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.module.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs';

			import { OrbitControls } from 'fourjs/addons/controls/OrbitControls.js';
			import { LightProbeHelper } from 'fourjs/addons/helpers/LightProbeHelper.js';
			import { LightProbeGenerator } from 'fourjs/addons/lights/LightProbeGenerator.js';

			let renderer, scene, camera, cubeCamera;

			let lightProbe;

			init();

			function init() {

				// renderer
				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				// scene
				scene = new FOUR.Scene();

				// camera
				camera = new FOUR.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.set( 0, 0, 30 );

				const cubeRenderTarget = new FOUR.WebGLCubeRenderTarget( 256 );

				cubeCamera = new FOUR.CubeCamera( 1, 1000, cubeRenderTarget );

				// controls
				const controls = new OrbitControls( camera, renderer.domElement );
				controls.addEventListener( 'change', render );
				controls.minDistance = 10;
				controls.maxDistance = 50;
				controls.enablePan = false;

				// probe
				lightProbe = new FOUR.LightProbe();
				scene.add( lightProbe );

				// envmap
				const genCubeUrls = function ( prefix, postfix ) {

					return [
						prefix + 'px' + postfix, prefix + 'nx' + postfix,
						prefix + 'py' + postfix, prefix + 'ny' + postfix,
						prefix + 'pz' + postfix, prefix + 'nz' + postfix
					];

				};

				const urls = genCubeUrls( 'textures/cube/pisa/', '.png' );

				new FOUR.CubeTextureLoader().load( urls, async function ( cubeTexture ) {

					scene.background = cubeTexture;

					cubeCamera.update( renderer, scene );

					const probe = await LightProbeGenerator.fromCubeRenderTarget( renderer, cubeRenderTarget );

					lightProbe.copy( probe );

					scene.add( new LightProbeHelper( lightProbe, 5 ) );

					render();

				} );

				// listener
				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				renderer.setSize( window.innerWidth, window.innerHeight );

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				render();

			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
