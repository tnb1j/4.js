<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - materials - TIFF texture</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - materials - TIFF texture">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>
		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> - TIFF texture loader</a>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.module.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js';

			import { TIFFLoader } from '@tnb1j/4js/addons/loaders/TIFFLoader.js';

			let renderer, scene, camera;

			init();

			function init() {

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.01, 10 );
				camera.position.set( 0, 0, 4 );

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				scene = new FOUR.Scene();

				const loader = new TIFFLoader();

				const geometry = new FOUR.PlaneGeometry();

				// uncompressed

				loader.load( 'textures/tiff/crate_uncompressed.tif', function ( texture ) {

					texture.colorSpace = FOUR.SRGBColorSpace;

					const material = new FOUR.MeshBasicMaterial( { map: texture } );

					const mesh = new FOUR.Mesh( geometry, material );
					mesh.position.set( - 1.5, 0, 0 );

					scene.add( mesh );

					render();

				} );

				// LZW

				loader.load( 'textures/tiff/crate_lzw.tif', function ( texture ) {

					texture.colorSpace = FOUR.SRGBColorSpace;

					const material = new FOUR.MeshBasicMaterial( { map: texture } );

					const mesh = new FOUR.Mesh( geometry, material );
					mesh.position.set( 0, 0, 0 );

					scene.add( mesh );

					render();

				} );

				// JPEG

				loader.load( 'textures/tiff/crate_jpeg.tif', function ( texture ) {

					texture.colorSpace = FOUR.SRGBColorSpace;

					const material = new FOUR.MeshBasicMaterial( { map: texture } );

					const mesh = new FOUR.Mesh( geometry, material );
					mesh.position.set( 1.5, 0, 0 );

					scene.add( mesh );

					render();

				} );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				render();

			}


			//

			function render() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
