<html lang="en">
	<head>
		<title>4.js webgpu - rtt</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - rtt">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

	<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>WebGPU RTT</span>
			</div>

			<small>Basic Render-to-Texture demo.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.webgpu.js",
					"fourjs/webgpu": "../build/4.webgpu.js",
					"fourjs/tsl": "../build/4.tsl.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs/webgpu';
			import { texture, uniform, saturation, hue } from 'fourjs/tsl';

			import { Inspector } from 'fourjs/addons/inspector/Inspector.js';

			let camera, scene, renderer;
			const mouse = new FOUR.Vector2();

			let quadMesh, renderTarget;

			let box;

			const dpr = window.devicePixelRatio;

			init();

			function init() {

				camera = new FOUR.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.1, 10 );
				camera.position.z = 3;

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x0066FF );

				// textured mesh

				const loader = new FOUR.TextureLoader();
				const uvTexture = loader.load( './textures/uv_grid_opengl.jpg' );

				const geometryBox = new FOUR.BoxGeometry();
				const materialBox = new FOUR.MeshBasicNodeMaterial();
				materialBox.colorNode = texture( uvTexture );

				//

				box = new FOUR.Mesh( geometryBox, materialBox );
				scene.add( box );

				//

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( dpr );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				renderer.inspector = new Inspector();

				renderTarget = new FOUR.RenderTarget( window.innerWidth * dpr, window.innerHeight * dpr );

				window.addEventListener( 'mousemove', onWindowMouseMove );
				window.addEventListener( 'resize', onWindowResize );

				// FX

				// modulate the final color based on the mouse position

				const screenFXNode = uniform( mouse );

				const materialFX = new FOUR.MeshBasicNodeMaterial();

				const scenePassTexture = texture( renderTarget.texture ).toInspector( 'Scene Pass' );
				materialFX.colorNode = hue( saturation( scenePassTexture.rgb, screenFXNode.x.oneMinus() ), screenFXNode.y );

				quadMesh = new FOUR.QuadMesh( materialFX );
				quadMesh.name = 'Post-Processing';

			}

			function onWindowMouseMove( e ) {

				mouse.x = e.offsetX / window.innerWidth;
				mouse.y = e.offsetY / window.innerHeight;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );
				renderTarget.setSize( window.innerWidth * dpr, window.innerHeight * dpr );

			}

			function animate() {

				box.rotation.x += 0.01;
				box.rotation.y += 0.02;

				renderer.setRenderTarget( renderTarget );
				renderer.render( scene, camera );

				renderer.setRenderTarget( null );
				quadMesh.render( renderer );

			}

		</script>
	</body>
</html>
