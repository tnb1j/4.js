<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - mrt mask</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - mrt mask">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>MRT Mask</span>
			</div>

			<small>
				The mask is applied followed by a gaussian blur only on some selected materials.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.webgpu.js",
					"@fourjs/core/webgpu": "../build/4.webgpu.js",
					"@fourjs/core/tsl": "../build/4.tsl.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core/webgpu';
			import { color, screenUV, mrt, output, pass, vec4 } from '@fourjs/core/tsl';
			import { gaussianBlur } from '@fourjs/core/addons/tsl/display/GaussianBlurNode.js';

			import { GLTFLoader } from '@fourjs/core/addons/loaders/GLTFLoader.js';

			import { OrbitControls } from '@fourjs/core/addons/controls/OrbitControls.js';

			let camera, scene, renderer;
			let renderPipeline;
			let spheres, rotate = true;
			let mixer, timer;

			init();

			function init() {

				camera = new FOUR.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.01, 100 );
				camera.position.set( 1, 2, 3 );

				scene = new FOUR.Scene();
				scene.backgroundNode = screenUV.y.mix( color( 0x66bbff ), color( 0x4466ff ) ).mul( .05 );
				camera.lookAt( 0, 1, 0 );

				timer = new FOUR.Timer();
				timer.connect( document );

				// lights

				const light = new FOUR.SpotLight( 0xffffff, 1 );
				light.power = 2000;
				camera.add( light );
				scene.add( camera );

				const loader = new GLTFLoader();
				loader.load( 'models/gltf/Michelle.glb', function ( gltf ) {

					const object = gltf.scene;
					mixer = new FOUR.AnimationMixer( object );

					const material = object.children[ 0 ].children[ 0 ].material;

					// add glow effect
					material.mrtNode = mrt( { mask: output.add( 1 ) } );

					const action = mixer.clipAction( gltf.animations[ 0 ] );
					action.play();

					scene.add( object );

				} );

				// spheres

				const geometry = new FOUR.SphereGeometry( .3, 32, 16 );

				spheres = new FOUR.Group();
				scene.add( spheres );

				function addSphere( color, mrtNode = null ) {

					const distance = 1;
					const id = spheres.children.length;
					const rotation = FOUR.MathUtils.degToRad( id * 90 );

					const material = new FOUR.MeshStandardNodeMaterial( { color } );
					material.mrtNode = mrtNode;

					const mesh = new FOUR.Mesh( geometry, material );
					mesh.position.set(
						Math.cos( rotation ) * distance,
						1,
						Math.sin( rotation ) * distance
					);

					spheres.add( mesh );

				}

				addSphere( 0x0000ff, mrt( { mask: output } ) );
				addSphere( 0x00ff00 );
				addSphere( 0xff0000 );
				addSphere( 0x00ffff );

				// renderer

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = FOUR.NeutralToneMapping;
				renderer.toneMappingExposure = 0.4;
				document.body.appendChild( renderer.domElement );

				// post processing

				const scenePass = pass( scene, camera );
				scenePass.setMRT( mrt( {
					output: output.renderOutput(),
					mask: vec4( 0 ) // empty as default, custom materials can set this
				} ) );

				const colorPass = scenePass.getTextureNode();
				const maskPass = scenePass.getTextureNode( 'mask' );

				renderPipeline = new FOUR.RenderPipeline( renderer );
				renderPipeline.outputColorTransform = false;
				renderPipeline.outputNode = colorPass.add( gaussianBlur( maskPass, 1, 20 ).mul( .3 ) ).renderOutput();

				// controls

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 1, 0 );
				controls.addEventListener( 'start', () => rotate = false );
				controls.addEventListener( 'end', () => rotate = true );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				if ( mixer ) mixer.update( delta );

				if ( rotate ) spheres.rotation.y += delta * 0.5;

				renderPipeline.render();

			}

		</script>
	</body>
</html>
