<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - refraction</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - refraction">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Refraction</span>
			</div>

			<small>
				Refraction using backdrop.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.webgpu.js",
					"fourjs/webgpu": "../build/4.webgpu.js",
					"fourjs/tsl": "../build/4.tsl.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs/webgpu';
			import { viewportSafeUV, viewportSharedTexture, screenUV, texture, uv } from 'fourjs/tsl';

			import { OrbitControls } from 'fourjs/addons/controls/OrbitControls.js';

			import { Inspector } from 'fourjs/addons/inspector/Inspector.js';

			let camera, scene, renderer;

			let cameraControls;

			let smallSphere;

			init();

			function init() {

				// scene
				scene = new FOUR.Scene();

				// camera
				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 500 );
				camera.position.set( 0, 50, 160 );

				//

				const geometry = new FOUR.IcosahedronGeometry( 5, 0 );
				const material = new FOUR.MeshPhongMaterial( { color: 0xffffff, emissive: 0x7b7b7b, flatShading: true } );
				smallSphere = new FOUR.Mesh( geometry, material );
				scene.add( smallSphere );

				// textures

				const loader = new FOUR.TextureLoader();

				const floorNormal = loader.load( 'textures/floors/FloorsCheckerboard_S_Normal.jpg' );
				floorNormal.wrapS = FOUR.RepeatWrapping;
				floorNormal.wrapT = FOUR.RepeatWrapping;

				// refractor

				const verticalNormalScale = 0.1;
				const verticalUVOffset = texture( floorNormal, uv().mul( 5 ) ).xy.mul( 2 ).sub( 1 ).mul( verticalNormalScale );

				const refractorUV = screenUV.add( verticalUVOffset );
				const verticalRefractor = viewportSharedTexture( viewportSafeUV( refractorUV ) ).toInspector( 'Viewport Texture' );

				const planeGeo = new FOUR.PlaneGeometry( 100.1, 100.1 );

				const planeRefractor = new FOUR.Mesh( planeGeo, new FOUR.MeshBasicNodeMaterial( {
					backdropNode: verticalRefractor
				} ) );
				planeRefractor.material.transparent = true;
				planeRefractor.position.y = 50;
				scene.add( planeRefractor );

				// walls
			
				const planeTop = new FOUR.Mesh( planeGeo, new FOUR.MeshPhongMaterial( { color: 0xffffff } ) );
				planeTop.position.y = 100;
				planeTop.rotateX( Math.PI / 2 );
				scene.add( planeTop );

				const planeBottom = new FOUR.Mesh( planeGeo, new FOUR.MeshPhongMaterial( { color: 0xffffff } ) );
				planeBottom.rotateX( - Math.PI / 2 );
				scene.add( planeBottom );

				const planeBack = new FOUR.Mesh( planeGeo, new FOUR.MeshPhongMaterial( { color: 0x7f7fff } ) );
				planeBack.position.z = - 50;
				planeBack.position.y = 50;
				scene.add( planeBack );

				const planeRight = new FOUR.Mesh( planeGeo, new FOUR.MeshPhongMaterial( { color: 0x00ff00 } ) );
				planeRight.position.x = 50;
				planeRight.position.y = 50;
				planeRight.rotateY( - Math.PI / 2 );
				scene.add( planeRight );

				const planeLeft = new FOUR.Mesh( planeGeo, new FOUR.MeshPhongMaterial( { color: 0xff0000 } ) );
				planeLeft.position.x = - 50;
				planeLeft.position.y = 50;
				planeLeft.rotateY( Math.PI / 2 );
				scene.add( planeLeft );

				// lights

				const mainLight = new FOUR.PointLight( 0xe7e7e7, 2.5, 250, 0 );
				mainLight.position.y = 60;
				scene.add( mainLight );

				const greenLight = new FOUR.PointLight( 0x00ff00, 0.5, 1000, 0 );
				greenLight.position.set( 550, 50, 0 );
				scene.add( greenLight );

				const redLight = new FOUR.PointLight( 0xff0000, 0.5, 1000, 0 );
				redLight.position.set( - 550, 50, 0 );
				scene.add( redLight );

				const blueLight = new FOUR.PointLight( 0xbbbbfe, 0.5, 1000, 0 );
				blueLight.position.set( 0, 50, 550 );
				scene.add( blueLight );

				// renderer

				renderer = new FOUR.WebGPURenderer( /*{ antialias: true }*/ );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				// controls

				cameraControls = new OrbitControls( camera, renderer.domElement );
				cameraControls.target.set( 0, 50, 0 );
				cameraControls.maxDistance = 400;
				cameraControls.minDistance = 10;
				cameraControls.update();

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				const timer = Date.now() * 0.01;

				smallSphere.position.set(
					Math.cos( timer * 0.1 ) * 30,
					Math.abs( Math.cos( timer * 0.2 ) ) * 20 + 5,
					Math.sin( timer * 0.1 ) * 30
				);
				smallSphere.rotation.y = ( Math.PI / 2 ) - timer * 0.1;
				smallSphere.rotation.z = timer * 0.8;

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
