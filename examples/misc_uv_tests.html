<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js - uv mapping tests</title>
		<meta charset=utf-8 />
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js - uv mapping tests">
		<meta property="og:type" content="website">
		<style>
			body {
				background: #ffffff;
				color: #000000;
				text-align: center;
				font-family: sans-serif;
			}
			h3 {
				margin-top: 60px;
				margin-bottom: 30px;
				font-weight: normal;
			}
			canvas {
				width: 100%;
			}
		</style>
	</head>

	<body>
		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.module.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js';

			import { UVsDebug } from '@tnb1j/4js/addons/utils/UVsDebug.js';

			/*
			 * This is to help debug UVs problems in geometry,
			 * as well as allow a new user to visualize what UVs are about.
			 */

			function test( name, geometry ) {

				const d = document.createElement( 'div' );

				d.innerHTML = '<h3>' + name + '</h3>';

				d.appendChild( UVsDebug( geometry ) );

				document.body.appendChild( d );

			}

			const points = [];

			for ( let i = 0; i < 10; i ++ ) {

				points.push( new FOUR.Vector2( Math.sin( i * 0.2 ) * 15 + 50, ( i - 5 ) * 2 ) );

			}

			//

			test( 'new FOUR.PlaneGeometry( 100, 100, 4, 4 )', new FOUR.PlaneGeometry( 100, 100, 4, 4 ) );

			test( 'new FOUR.SphereGeometry( 75, 12, 6 )', new FOUR.SphereGeometry( 75, 12, 6 ) );

			test( 'new FOUR.IcosahedronGeometry( 30, 1 )', new FOUR.IcosahedronGeometry( 30, 1 ) );

			test( 'new FOUR.OctahedronGeometry( 30, 2 )', new FOUR.OctahedronGeometry( 30, 2 ) );

			test( 'new FOUR.CylinderGeometry( 25, 75, 100, 10, 5 )', new FOUR.CylinderGeometry( 25, 75, 100, 10, 5 ) );

			test( 'new FOUR.BoxGeometry( 100, 100, 100, 4, 4, 4 )', new FOUR.BoxGeometry( 100, 100, 100, 4, 4, 4 ) );

			test( 'new FOUR.LatheGeometry( points, 8 )', new FOUR.LatheGeometry( points, 8 ) );

			test( 'new FOUR.TorusGeometry( 50, 20, 8, 8 )', new FOUR.TorusGeometry( 50, 20, 8, 8 ) );

			test( 'new FOUR.TorusKnotGeometry( 50, 10, 12, 6 )', new FOUR.TorusKnotGeometry( 50, 10, 12, 6 ) );

		</script>

	</body>

</html>
