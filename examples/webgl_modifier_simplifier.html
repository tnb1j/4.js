<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - modifier - simplify modifier</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - modifier - simplify modifier">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>
		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.module.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs';

			import { OrbitControls } from 'fourjs/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'fourjs/addons/loaders/GLTFLoader.js';
			import { SimplifyModifier } from 'fourjs/addons/modifiers/SimplifyModifier.js';

			let renderer, scene, camera;

			init();

			function init() {

				const info = document.createElement( 'div' );
				info.style.position = 'absolute';
				info.style.top = '10px';
				info.style.width = '100%';
				info.style.textAlign = 'center';
				info.innerHTML = '<a href="../" target="_blank" rel="noopener">4.js</a> - Vertex Reduction using SimplifyModifier';
				document.body.appendChild( info );

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.body.appendChild( renderer.domElement );

				scene = new FOUR.Scene();

				camera = new FOUR.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.z = 15;

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.addEventListener( 'change', render ); // use if there is no animation loop
				controls.enablePan = false;
				controls.enableZoom = false;

				scene.add( new FOUR.AmbientLight( 0xffffff, 0.6 ) );

				const light = new FOUR.PointLight( 0xffffff, 400 );
				camera.add( light );
				scene.add( camera );

				new GLTFLoader().load( 'models/gltf/LeePerrySmith/LeePerrySmith.glb', function ( gltf ) {

					const mesh = gltf.scene.children[ 0 ];
					mesh.position.x = - 3;
					mesh.rotation.y = Math.PI / 2;
					scene.add( mesh );

					const modifier = new SimplifyModifier();

					const simplified = mesh.clone();
					simplified.material = simplified.material.clone();
					simplified.material.flatShading = true;
					const count = Math.floor( simplified.geometry.attributes.position.count * 0.875 ); // number of vertices to remove
					simplified.geometry = modifier.modify( simplified.geometry, count );

					simplified.position.x = 3;
					simplified.rotation.y = - Math.PI / 2;
					scene.add( simplified );

					render();

				} );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				renderer.setSize( window.innerWidth, window.innerHeight );

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				render();

			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
