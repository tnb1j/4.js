<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - postprocessing afterimage</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - postprocessing afterimage">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>After Image</span>
			</div>

			<small>
				Based on <a href="https://oosmoxiecode.com/archive/js_webgl/spiral/" target="_blank" rel="noopener">Particle Spiral</a>
				by <a href="https://github.com/oosmoxiecode" target="_blank" rel="noopener">oosmoxiecode</a>.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.webgpu.js",
					"fourjs/webgpu": "../build/4.webgpu.js",
					"fourjs/tsl": "../build/4.tsl.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs/webgpu';
			import { instancedBufferAttribute, uniform, mod, pass, texture, float, time, vec2, vec3, vec4, sin, cos } from 'fourjs/tsl';
			import { afterImage } from 'fourjs/addons/tsl/display/AfterImageNode.js';

			import { Inspector } from 'fourjs/addons/inspector/Inspector.js';

			let camera, scene, renderer, particles;
			let renderPipeline, afterImagePass, scenePass;

			const params = {

				damp: uniform( 0.8, 'float' ).setName( 'damp' ),
				enabled: true

			};

			init();

			function init() {

				renderer = new FOUR.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				camera = new FOUR.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 1, 10000 );
				camera.position.z = 1000;

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x000000 );

				const sprite = new FOUR.TextureLoader().load( 'textures/sprites/circle.png' );

				// geometry

				const radius = 600;
				const count = 50000;

				const vertex = new FOUR.Vector3();
				const color = new FOUR.Color();

				const colors = [];
				const vertices = [];
				const timeOffsets = [];

				for ( var i = 0; i < count; i ++ ) {

					getRandomPointOnSphere( radius, vertex );
					vertices.push( vertex.x, vertex.y, vertex.z );

					color.setHSL( i / count, 0.7, 0.7, FOUR.SRGBColorSpace );
					colors.push( color.r, color.g, color.b );

					timeOffsets.push( i / count );

				}

				const positionAttribute = new FOUR.InstancedBufferAttribute( new Float32Array( vertices ), 3 );
				const colorAttribute = new FOUR.InstancedBufferAttribute( new Float32Array( colors ), 3 );
				const timeAttribute = new FOUR.InstancedBufferAttribute( new Float32Array( timeOffsets ), 1 );

				// material and TSL

				const material = new FOUR.SpriteNodeMaterial( { blending: FOUR.AdditiveBlending, depthWrite: false } );

				const localTime = instancedBufferAttribute( timeAttribute ).add( time.mul( 0.1 ) );
				const modTime = mod( localTime, 1.0 );
				const accTime = modTime.mul( modTime );

				const angle = accTime.mul( 40.0 );
				const pulse = vec2( sin( angle ).mul( 20.0 ), cos( angle ).mul( 20.0 ) );
				const pos = instancedBufferAttribute( positionAttribute );

				const animated = vec3( pos.x.mul( accTime ).add( pulse.x ), pos.y.mul( accTime ).add( pulse.y ), pos.z.mul( accTime ).mul( 1.75 ) );
				const fAlpha = modTime.oneMinus().mul( 2.0 );

				material.colorNode = texture( sprite ).mul( vec4( instancedBufferAttribute( colorAttribute ), fAlpha ) );
				material.positionNode = animated;
				material.scaleNode = float( 2 );

				particles = new FOUR.Sprite( material );
				particles.count = count;
				scene.add( particles );

				// postprocessing

				renderPipeline = new FOUR.RenderPipeline( renderer );

				scenePass = pass( scene, camera );

				afterImagePass = afterImage( scenePass, params.damp );

				renderPipeline.outputNode = afterImagePass;

				//

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( afterImagePass.damp, 'value', 0.25, 1 );
				gui.add( params, 'enabled' ).onChange( updatePassChain );

				window.addEventListener( 'resize', onWindowResize );

			}

			function updatePassChain() {

				if ( params.enabled === true ) {

					renderPipeline.outputNode = afterImagePass;

				} else {

					renderPipeline.outputNode = scenePass;

				}

				renderPipeline.needsUpdate = true;


			}


			function getRandomPointOnSphere( r, v ) {

				const angle = Math.random() * Math.PI * 2;
				const u = Math.random() * 2 - 1;

				v.set(
					Math.cos( angle ) * Math.sqrt( 1 - Math.pow( u, 2 ) ) * r,
					Math.sin( angle ) * Math.sqrt( 1 - Math.pow( u, 2 ) ) * r,
					u * r
				);

				return v;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate( time ) {

				particles.rotation.z = time * 0.001;

				renderPipeline.render();

			}

		</script>
	</body>
</html>
