<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - glTF + compressed</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - glTF + compressed">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>glTF + Compression Extensions</span>
			</div>

			<small>
				glTF model loading with KTX2/Basis and Meshopt compression extensions.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.webgpu.js",
					"fourjs/webgpu": "../build/4.webgpu.js",
					"fourjs/tsl": "../build/4.tsl.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs/webgpu';

			import { GLTFLoader } from 'fourjs/addons/loaders/GLTFLoader.js';
			import { KTX2Loader } from 'fourjs/addons/loaders/KTX2Loader.js';
			import { MeshoptDecoder } from 'fourjs/addons/libs/meshopt_decoder.module.js';

			import { OrbitControls } from 'fourjs/addons/controls/OrbitControls.js';

			let camera, scene, renderer;

			init();

			async function init() {

				camera = new FOUR.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 1, 20 );
				camera.position.set( 2, 2, 2 );

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0xEEEEEE );

				//lights

				const light = new FOUR.PointLight( 0xffffff );
				light.power = 1300;
				camera.add( light );
				scene.add( camera );

				//renderer

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = FOUR.ReinhardToneMapping;
				renderer.toneMappingExposure = 1;
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 3;
				controls.maxDistance = 6;
				controls.update();

				const ktx2Loader = await new KTX2Loader()
					.detectSupport( renderer );

				const loader = new GLTFLoader();
				loader.setKTX2Loader( ktx2Loader );
				loader.setMeshoptDecoder( MeshoptDecoder );
				loader.load( 'models/gltf/coffeemat.glb', function ( gltf ) {

					const gltfScene = gltf.scene;
					gltfScene.position.y = - .8;
					gltfScene.scale.setScalar( .01 );

					scene.add( gltfScene );

				} );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
