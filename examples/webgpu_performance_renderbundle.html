<!DOCTYPE html>
<html lang="en">
<head>
	<title>4.js webgpu - Render Bundle</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - Render Bundle">
		<meta property="og:type" content="website">
	<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info" class="invert">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a>
				<span>Render Bundle</span>
			</div>

			<small>
				Performance Optimization with Render Bundles. Only supported with WebGPU.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';

			import { Inspector } from '@tnb1j/4js/addons/inspector/Inspector.js';

			import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';

			let camera, scene, renderer;
			let controls;
			let gui;
			let geometries, group, instancedMesh;

			//

			const position = new FOUR.Vector3();
			const rotation = new FOUR.Euler();
			const quaternion = new FOUR.Quaternion();
			const scale = new FOUR.Vector3();

			const instanceMatrix = new FOUR.Matrix4();
			const rotationMatrix = new FOUR.Matrix4();

			//

			const api = {
				webgpu: true,
				renderBundle: true,
				count: 4000,
				opacity: 1,
				dynamic: false
			};


			init();

			//

			function randomizeMatrix( matrix ) {

				position.x = Math.random() * 80 - 40;
				position.y = Math.random() * 80 - 40;
				position.z = Math.random() * 80 - 40;

				rotation.x = Math.random() * 2 * Math.PI;
				rotation.y = Math.random() * 2 * Math.PI;
				rotation.z = Math.random() * 2 * Math.PI;

				quaternion.setFromEuler( rotation );

				scale.x = scale.y = scale.z = 0.35 + ( Math.random() * 0.5 );

				return matrix.compose( position, quaternion, scale );

			}

			function randomizeRotationSpeed( rotation ) {

				rotation.x = Math.random() * .05;
				rotation.y = Math.random() * .05;
				rotation.z = Math.random() * .05;
				return rotation;

			}

			function initGeometries() {

				geometries = [
					new FOUR.ConeGeometry( 1.0, 2.0, 3, 1 ),
					new FOUR.BoxGeometry( 2.0, 2.0, 2.0 ),
					new FOUR.PlaneGeometry( 2.0, 2, 1, 1 ),
					new FOUR.CapsuleGeometry( ),
					new FOUR.CircleGeometry( 1.0, 3 ),
					new FOUR.CylinderGeometry( 1.0, 1.0, 2.0, 3, 1 ),
					new FOUR.DodecahedronGeometry( 1.0, 0 ),
					new FOUR.IcosahedronGeometry( 1.0, 0 ),
					new FOUR.OctahedronGeometry( 1.0, 0 ),
					new FOUR.PolyhedronGeometry( [ 0, 0, 0 ], [ 0, 0, 0 ], 1, 0 ),
					new FOUR.RingGeometry( 1.0, 1.5, 3 ),
					new FOUR.SphereGeometry( 1.0, 3, 2 ),
					new FOUR.TetrahedronGeometry( 1.0, 0 ),
					new FOUR.TorusGeometry( 1.0, 0.5, 3, 3 ),
					new FOUR.TorusKnotGeometry( 1.0, 0.5, 20, 3, 1, 1 ),
				];

			}

			function initMesh( count ) {

				group = api.renderBundle ? new FOUR.BundleGroup() : new FOUR.Group();

				for ( let i = 0; i < count; i ++ ) {

					const material = new FOUR.MeshToonNodeMaterial( {
						color: new FOUR.Color( Math.random() * 0xffffff ),
						side: FOUR.DoubleSide,
					} );

					const child = new FOUR.Mesh( geometries[ i % geometries.length ], material );
					randomizeMatrix( child.matrix );
					child.matrix.decompose( child.position, child.quaternion, child.scale );
					child.userData.rotationSpeed = randomizeRotationSpeed( new FOUR.Euler() );
					child.frustumCulled = false;
					group.add( child );

				}

				// instanced meshes are supported inside a bundle group, too

				instancedMesh = new FOUR.InstancedMesh( geometries[ 0 ], new FOUR.MeshToonNodeMaterial(), 10 );
				instancedMesh.userData.rotationSpeeds = [];

				const matrix = new FOUR.Matrix4();

				for ( let i = 0; i < instancedMesh.count; i ++ ) {

					randomizeMatrix( matrix );
					instancedMesh.setMatrixAt( i, matrix );

					instancedMesh.userData.rotationSpeeds.push( randomizeRotationSpeed( new FOUR.Euler() ) );

				}

				group.add( instancedMesh );

				//

				scene.add( group );

			}

			function init() {

				const searchParams = new URLSearchParams( window.location.search );
				api.webgpu = searchParams.get( 'backend' ) !== 'webgl';
				api.renderBundle = searchParams.get( 'renderBundle' ) !== 'false';
				api.count = parseFloat( searchParams.get( 'count' ) || 4000 );

				const count = api.count;

				// camera

				const aspect = window.innerWidth / window.innerHeight;

				camera = new FOUR.PerspectiveCamera( 70, aspect, 1, 100 );
				camera.position.z = 50;

				// renderer

				renderer = new FOUR.WebGPURenderer( { antialias: true, forceWebGL: ! api.webgpu } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.inspector = new Inspector();
				renderer.setAnimationLoop( animate );

				// scene

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0xc1c1c1 );

				const light = new FOUR.DirectionalLight( 0xffffff, 3.4 );
				scene.add( light );

				document.body.appendChild( renderer.domElement );

				initGeometries();
				initMesh( count );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.autoRotate = true;
				controls.autoRotateSpeed = 1.0;

				// gui

				gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( api, 'renderBundle' ).name( 'render bundle' ).onChange( reload );

				gui.add( api, 'webgpu' ).onChange( reload );

				gui.add( api, 'dynamic' ).onChange( () => {

					group.static = ! group.static;

				} );


				// listeners

				window.addEventListener( 'resize', onWindowResize );

				function onWindowResize() {

					const width = window.innerWidth;
					const height = window.innerHeight;

					camera.aspect = width / height;
					camera.updateProjectionMatrix();

					renderer.setSize( width, height );
					group.needsUpdate = true;

				}

				function reload() {

					const backendParam = 'backend=' + ( api.webgpu ? 'webgpu' : 'webgl' );
					const renderBundleParam = '&renderBundle=' + ( api.renderBundle ? 'true' : 'false' );
					const countParam = '&count=' + api.count;

					location.href = location.pathname + '?' + backendParam + renderBundleParam + countParam; // relative redirect with parameters

				}

				function animate() {

					animateMeshes();

					controls.update();

					renderer.render( scene, camera );

				}

				function animateMeshes() {

					if ( api.dynamic === false ) return;

					// rotate the regular meshes

					for ( let i = 0; i < api.count; i ++ ) {

						const child = group.children[ i ];
						const rotationSpeed = child.userData.rotationSpeed;

						child.rotation.set(
							child.rotation.x + rotationSpeed.x,
							child.rotation.y + rotationSpeed.y,
							child.rotation.z + rotationSpeed.z
						);

					}

					// rotate each instance of the instanced mesh individually

					const rotationSpeeds = instancedMesh.userData.rotationSpeeds;

					for ( let i = 0; i < instancedMesh.count; i ++ ) {

						rotationMatrix.makeRotationFromEuler( rotationSpeeds[ i ] );

						instancedMesh.getMatrixAt( i, instanceMatrix );
						instanceMatrix.multiply( rotationMatrix );
						instancedMesh.setMatrixAt( i, instanceMatrix );

					}

					instancedMesh.instanceMatrix.needsUpdate = true;

				}

			}

		</script>

	</body>
</html>
