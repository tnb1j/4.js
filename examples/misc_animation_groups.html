<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - animation - groups</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - animation - groups">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> webgl - animation - groups
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.module.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs';

			import Stats from 'fourjs/addons/libs/stats.module.js';

			let stats, timer;
			let scene, camera, renderer, mixer;

			init();

			function init() {

				scene = new FOUR.Scene();

				//

				camera = new FOUR.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.set( 50, 50, 100 );
				camera.lookAt( scene.position );

				// all objects of this animation group share a common animation state

				const animationGroup = new FOUR.AnimationObjectGroup();

				//

				const geometry = new FOUR.BoxGeometry( 5, 5, 5 );
				const material = new FOUR.MeshBasicMaterial( { transparent: true } );

				//

				for ( let i = 0; i < 5; i ++ ) {

					for ( let j = 0; j < 5; j ++ ) {

						const mesh = new FOUR.Mesh( geometry, material );

						mesh.position.x = 32 - ( 16 * i );
						mesh.position.y = 0;
						mesh.position.z = 32 - ( 16 * j );

						scene.add( mesh );
						animationGroup.add( mesh );

					}

				}

				// create some keyframe tracks

				const xAxis = new FOUR.Vector3( 1, 0, 0 );
				const qInitial = new FOUR.Quaternion().setFromAxisAngle( xAxis, 0 );
				const qFinal = new FOUR.Quaternion().setFromAxisAngle( xAxis, Math.PI );
				const quaternionKF = new FOUR.QuaternionKeyframeTrack( '.quaternion', [ 0, 1, 2 ], [ qInitial.x, qInitial.y, qInitial.z, qInitial.w, qFinal.x, qFinal.y, qFinal.z, qFinal.w, qInitial.x, qInitial.y, qInitial.z, qInitial.w ] );

				const colorKF = new FOUR.ColorKeyframeTrack( '.material.color', [ 0, 1, 2 ], [ 1, 0, 0, 0, 1, 0, 0, 0, 1 ], FOUR.InterpolateDiscrete );
				const opacityKF = new FOUR.NumberKeyframeTrack( '.material.opacity', [ 0, 1, 2 ], [ 1, 0, 1 ] );

				// create clip

				const clip = new FOUR.AnimationClip( 'default', 3, [ quaternionKF, colorKF, opacityKF ] );

				// apply the animation group to the mixer as the root object

				mixer = new FOUR.AnimationMixer( animationGroup );

				const clipAction = mixer.clipAction( clip );
				clipAction.play();

				//

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				//

				stats = new Stats();
				document.body.appendChild( stats.dom );

				//

				timer = new FOUR.Timer();
				timer.connect( document );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				if ( mixer ) {

					mixer.update( delta );

				}

				renderer.render( scene, camera );

				stats.update();

			}

		</script>

	</body>
</html>
