<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - postprocessing taau</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - postprocessing taau">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info" class="invert">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>TAAU</span>
			</div>

			<small>
				Temporal Reprojection Anti-Aliasing with Upsampling.<br />
				Model: <a href="https://artstation.com/artwork/1AGwX" target="_blank" rel="noopener">Littlest Tokyo</a> by <a href="https://artstation.com/glenatron" target="_blank" rel="noopener">Glen Fox</a>, CC Attribution.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';

			import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';
			import { GLTFLoader } from '@tnb1j/4js/addons/loaders/GLTFLoader.js';
			import { Inspector } from '@tnb1j/4js/addons/inspector/Inspector.js';
			import { RoomEnvironment } from '@tnb1j/4js/addons/environments/RoomEnvironment.js';
			import { DRACOLoader } from '@tnb1j/4js/addons/loaders/DRACOLoader.js';

			const params = {
				upscaleMethod: 'TAAU',
				resolutionScale: 0.5,
				sharpening: true,
				sharpness: 0.2,
			};

			let camera, scene, renderer, temporalPipeline, controls, mixer, timer;

			init();

			async function init() {

				camera = new FOUR.PerspectiveCamera( 25, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( - 0.5, 0, 12 );

				scene = new FOUR.Scene();

				timer = new FOUR.Timer();
				timer.connect( document );

				// model

				const dracoLoader = new DRACOLoader();
				const loader = new GLTFLoader();
				loader.setDRACOLoader( dracoLoader );

				loader.load( 'models/gltf/LittlestTokyo.glb', function ( gltf ) {

					const model = gltf.scene;
					model.scale.set( 0.01, 0.01, 0.01 );
					scene.add( model );

					mixer = new FOUR.AnimationMixer( model );
					mixer.clipAction( gltf.animations[ 0 ] ).play();

				} );

				// renderer

				renderer = new FOUR.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				const pmremGenerator = new FOUR.PMREMGenerator( renderer );

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0xbfe3dd );
				scene.environment = pmremGenerator.fromScene( new RoomEnvironment(), 0.04 ).texture;

				// controls

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.target.set( - 0.5, 0, 0 );

				// render pipeline

				temporalPipeline = new FOUR.TemporalPipeline( renderer, scene, camera, {
					resolutionScale: params.resolutionScale,
					sharpen: params.sharpening,
					sharpness: params.sharpness
				} );

				const scenePass = temporalPipeline.scenePass;

				const scenePassColor = scenePass.getTextureNode( 'output' ).toInspector( 'Color' );
				const scenePassDepth = scenePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => {

					return scenePass.getLinearDepthNode();

				} );
				const scenePassVelocity = scenePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );

				temporalPipeline.temporalNode.beautyNode = scenePassColor;
				temporalPipeline.temporalNode.depthNode = scenePassDepth;
				temporalPipeline.temporalNode.velocityNode = scenePassVelocity;

				function updatePipeline() {

					temporalPipeline.setEnabled( params.upscaleMethod === 'TAAU' );
					temporalPipeline.setSharpening( params.sharpening );

				}

				// gui

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( params, 'upscaleMethod', [ 'Bilinear', 'TAAU' ] ).onChange( updatePipeline );
				gui.add( params, 'resolutionScale', 0.25, 1.0, 0.25 ).onChange( ( value ) => {

					temporalPipeline.setResolutionScale( value );

				} );
				gui.add( params, 'sharpening' ).onChange( updatePipeline );
				gui.add( params, 'sharpness', 0, 2, 0.05 ).onChange( ( value ) => {

					temporalPipeline.setSharpness( value );

				} );

				updatePipeline();


				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			}

			function animate() {

				controls.update();

				timer.update();

				const delta = timer.getDelta();

				if ( mixer ) {

					mixer.update( delta );

				}

				temporalPipeline.render();

			}

		</script>
	</body>
</html>
