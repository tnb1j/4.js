<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - math - orientation transform</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - math - orientation transform">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="container"></div>
		<div id="info">
			<a href="../" target="_blank" rel="noopener noreferrer">4.js</a> - gradually transform an orientation to a target orientation
		</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.module.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core';

			import { GUI } from '@fourjs/core/addons/libs/lil-gui.module.min.js';

			let camera, scene, renderer, mesh, target;

			const spherical = new FOUR.Spherical();
			const rotationMatrix = new FOUR.Matrix4();
			const targetQuaternion = new FOUR.Quaternion();
			const timer = new FOUR.Timer();
			timer.connect( document );
			const speed = Math.PI / 2;

			const params = {
				useLookAt: false,
			};

			init();

			function init() {

				camera = new FOUR.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.01, 10 );
				camera.position.z = 5;

				scene = new FOUR.Scene();

				const geometry = new FOUR.ConeGeometry( 0.1, 0.5, 8 );
				geometry.rotateX( Math.PI * 0.5 );
				const material = new FOUR.MeshNormalMaterial();

				mesh = new FOUR.Mesh( geometry, material );
				scene.add( mesh );

				//

				const targetGeometry = new FOUR.SphereGeometry( 0.05 );
				const targetMaterial = new FOUR.MeshBasicMaterial( { color: 0xff0000 } );
				target = new FOUR.Mesh( targetGeometry, targetMaterial );
				scene.add( target );

				//

				const sphereGeometry = new FOUR.SphereGeometry( 2, 32, 32 );
				const sphereMaterial = new FOUR.MeshBasicMaterial( { color: 0xcccccc, wireframe: true, transparent: true, opacity: 0.3 } );
				const sphere = new FOUR.Mesh( sphereGeometry, sphereMaterial );
				scene.add( sphere );

				//

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				//

				window.addEventListener( 'resize', onWindowResize );

				//

				const gui = new GUI();

				gui.add( params, 'useLookAt' );
				gui.open();

				//

				generateTarget();

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				if ( mesh.quaternion.equals( targetQuaternion ) === false ) {

					if ( params.useLookAt === true ) {

						// using lookAt() will make the mesh instantly look at the target

						mesh.lookAt( target.position );

					} else {

						// using rotateTowards() will gradually rotate the mesh towards the target
						// the "speed" variable represents the rotation speed in radians per seconds

						const step = speed * delta;
						mesh.quaternion.rotateTowards( targetQuaternion, step );

					}

				}

				renderer.render( scene, camera );

			}

			function generateTarget() {

				// generate a random point on a sphere

				spherical.theta = Math.random() * Math.PI * 2;
				spherical.phi = Math.acos( ( 2 * Math.random() ) - 1 );
				spherical.radius = 2;

				target.position.setFromSpherical( spherical );

				// compute target rotation

				rotationMatrix.lookAt( target.position, mesh.position, mesh.up );
				targetQuaternion.setFromRotationMatrix( rotationMatrix );

				setTimeout( generateTarget, 2000 );

			}

	</script>

</body>
</html>
