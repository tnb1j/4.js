<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - lookup table</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - lookup table">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			body {
				background-color: #fff;
				color: #444;
			}
			a {
				color: red;
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> webgl - lookup table<br/>
			vertex color values from a range of data values
		</div>

		<div id="container"></div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.module.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js';

			import { GUI } from '@tnb1j/4js/addons/libs/lil-gui.module.min.js';

			import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';
			import { Lut } from '@tnb1j/4js/addons/math/Lut.js';

			let container;

			let perpCamera, orthoCamera, renderer, lut;

			let mesh, sprite;
			let scene, uiScene;

			let params;

			init();

			function init() {

				container = document.getElementById( 'container' );

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0xffffff );

				uiScene = new FOUR.Scene();

				lut = new Lut();

				const width = window.innerWidth;
				const height = window.innerHeight;

				perpCamera = new FOUR.PerspectiveCamera( 60, width / height, 1, 100 );
				perpCamera.position.set( 0, 0, 10 );
				scene.add( perpCamera );

				orthoCamera = new FOUR.OrthographicCamera( - 1, 1, 1, - 1, 1, 2 );
				orthoCamera.position.set( 0.5, 0, 1 );

				sprite = new FOUR.Sprite( new FOUR.SpriteMaterial( {
					map: new FOUR.CanvasTexture( lut.createCanvas() )
				} ) );
				sprite.material.map.colorSpace = FOUR.SRGBColorSpace;
				sprite.scale.x = 0.125;
				uiScene.add( sprite );

				mesh = new FOUR.Mesh( undefined, new FOUR.MeshLambertMaterial( {
					side: FOUR.DoubleSide,
					color: 0xF5F5F5,
					vertexColors: true
				} ) );
				scene.add( mesh );

				params	= {
					colorMap: 'rainbow',
				};
				loadModel( );

				const pointLight = new FOUR.PointLight( 0xffffff, 3, 0, 0 );
				perpCamera.add( pointLight );

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.autoClear = false;
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( width, height );
				container.appendChild( renderer.domElement );

				window.addEventListener( 'resize', onWindowResize );

				const controls = new OrbitControls( perpCamera, renderer.domElement );
				controls.addEventListener( 'change', render );

				const gui = new GUI();

				gui.add( params, 'colorMap', [ 'rainbow', 'cooltowarm', 'blackbody', 'grayscale' ] ).onChange( function () {

					updateColors();
					render();

				} );

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				perpCamera.aspect = width / height;
				perpCamera.updateProjectionMatrix();

				renderer.setSize( width, height );
				render();

			}

			function render() {

				renderer.clear();
				renderer.render( scene, perpCamera );
				renderer.render( uiScene, orthoCamera );

			}

			function loadModel( ) {

				const loader = new FOUR.BufferGeometryLoader();
				loader.load( 'models/json/pressure.json', function ( geometry ) {

					geometry.center();
					geometry.computeVertexNormals();

					// default color attribute
					const colors = [];

					for ( let i = 0, n = geometry.attributes.position.count; i < n; ++ i ) {

						colors.push( 1, 1, 1 );

					}

					geometry.setAttribute( 'color', new FOUR.Float32BufferAttribute( colors, 3 ) );

					mesh.geometry = geometry;
					updateColors();

					render();

				} );

			}

			function updateColors() {

				lut.setColorMap( params.colorMap );

				lut.setMax( 2000 );
				lut.setMin( 0 );

				const geometry = mesh.geometry;
				const pressures = geometry.attributes.pressure;
				const colors = geometry.attributes.color;
				const color = new FOUR.Color();

				for ( let i = 0; i < pressures.array.length; i ++ ) {

					const colorValue = pressures.array[ i ];

					color.copy( lut.getColor( colorValue ) ).convertSRGBToLinear();

					colors.setXYZ( i, color.r, color.g, color.b );

				}

				colors.needsUpdate = true;

				const map = sprite.material.map;
				lut.updateCanvas( map.image );
				map.needsUpdate = true;

			}

		</script>

	</body>
</html>
