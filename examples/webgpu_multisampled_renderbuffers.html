<html lang="en">
	<head>
		<title>4.js webgpu - multisampled renderbuffers</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - multisampled renderbuffers">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Multisampled Renderbuffers</span>
			</div>

			<small>
				Using multisampled renderbuffers for anti-aliasing.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.webgpu.js",
					"fourjs/webgpu": "../build/4.webgpu.js",
					"fourjs/tsl": "../build/4.tsl.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs/webgpu';
			import { texture } from 'fourjs/tsl';

			import { Inspector } from 'fourjs/addons/inspector/Inspector.js';

			let camera, scene, renderer;
			const mouse = new FOUR.Vector2();

			let quadMesh, renderTarget;

			let box, box2;

			const dpr = 1;

			const params = {
				animated: true,
				multisampling: true
			};

			const mat4 = new FOUR.Matrix4();

			const count = 50;
			const fullRadius = 20; // Radius of the sphere
			const halfRadius = 10; // Radius of the sphere
			const positions = new Array( count ).fill().map( ( _, i ) => {

				const radius = ( i % 2 === 0 ) ? fullRadius : halfRadius;

				const phi = Math.acos( 2 * Math.random() - 1 ) - Math.PI / 2; // phi: latitude, range -π/2 to π/2
				const theta = 2 * Math.PI * Math.random(); // theta: longitude, range 0 to 2π

				return new FOUR.Vector3(
					radius * Math.cos( phi ) * Math.cos( theta ), // x
					radius * Math.sin( phi ), // y
					radius * Math.cos( phi ) * Math.sin( theta ) // z
				);

			} );

			init();
			initGUI();

			function initGUI() {

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( params, 'multisampling' );
				gui.add( params, 'animated' );

			}

			function init() {

				camera = new FOUR.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.1, 50 );
				camera.position.z = 3;

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0x111111 );

				// textured mesh

				const geometryBox = new FOUR.BoxGeometry( 7, 7, 7, 12, 12, 12 );
				const materialBox = new FOUR.MeshBasicNodeMaterial();
				const materialBoxInner = new FOUR.MeshBasicNodeMaterial( { color: 0xff0000 } );

				materialBox.wireframe = true;

				//

				box = new FOUR.InstancedMesh( geometryBox, materialBox, count );
				box2 = new FOUR.InstancedMesh( geometryBox, materialBoxInner, count );

				for ( let i = 0; i < count; i ++ ) {

					box.setMatrixAt( i, mat4.identity().setPosition( positions[ i ] ) );
					box2.setMatrixAt( i, mat4.multiplyScalar( 0.996 ).setPosition( positions[ i ] ) );

				}

				scene.add( box, box2 );

				//

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.inspector = new Inspector();
				renderer.setPixelRatio( dpr );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				renderTarget = new FOUR.RenderTarget( window.innerWidth * dpr, window.innerHeight * dpr, {
					samples: params.multisampling ? 4 : 1,
					depthBuffer: true,
				} );

				window.addEventListener( 'mousemove', onWindowMouseMove );
				window.addEventListener( 'resize', onWindowResize );

				// FX

				// modulate the final color based on the mouse position

				const materialFX = new FOUR.MeshBasicNodeMaterial();
				materialFX.colorNode = texture( renderTarget.texture ).rgb;

				quadMesh = new FOUR.QuadMesh( materialFX );

			}

			function onWindowMouseMove( e ) {

				mouse.x = e.offsetX / window.innerWidth;
				mouse.y = e.offsetY / window.innerHeight;

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );
				renderTarget.setSize( window.innerWidth * dpr, window.innerHeight * dpr );

			}

			function animate() {

				if ( params.animated ) {

					box.rotation.x += 0.001;
					box.rotation.y += 0.002;
					box2.rotation.x += 0.001;
					box2.rotation.y += 0.002;

				}

				renderTarget.samples = params.multisampling ? 4 : 1;

				renderer.setRenderTarget( renderTarget );
				renderer.render( scene, camera );

				renderer.setRenderTarget( null );
				quadMesh.render( renderer );

			}

		</script>
	</body>
</html>
