<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - portal</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - portal">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Portal</span>
			</div>

			<small>
				The portal displays a different scene when viewed through it.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.webgpu.js",
					"fourjs/webgpu": "../build/4.webgpu.js",
					"fourjs/tsl": "../build/4.tsl.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs/webgpu';
			import { pass, color, mx_worley_noise_float, time, screenUV, vec2, uv, normalWorld, mx_fractal_noise_vec3 } from 'fourjs/tsl';

			import { GLTFLoader } from 'fourjs/addons/loaders/GLTFLoader.js';

			import { OrbitControls } from 'fourjs/addons/controls/OrbitControls.js';

			import { Inspector } from 'fourjs/addons/inspector/Inspector.js';

			let camera, sceneMain, scenePortal, renderer;
			let timer;

			const mixers = [];

			init();

			function init() {

				//

				sceneMain = new FOUR.Scene();
				sceneMain.background = new FOUR.Color( 0x222222 );
				sceneMain.backgroundNode = normalWorld.y.mix( color( 0x0066ff ), color( 0xff0066 ) );

				scenePortal = new FOUR.Scene();
				scenePortal.backgroundNode = mx_worley_noise_float( normalWorld.mul( 20 ).add( vec2( 0, time.oneMinus() ) ) ).mul( color( 0x0066ff ) );
				scenePortal.name = 'Portal Scene';

				//

				camera = new FOUR.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.01, 30 );
				camera.position.set( 2.5, 1, 3 );
				camera.position.multiplyScalar( .8 );
				camera.lookAt( 0, 1, 0 );

				timer = new FOUR.Timer();
				timer.connect( document );

				// lights

				const light = new FOUR.PointLight( 0xffffff, 1 );
				light.position.set( 0, 1, 5 );
				light.power = 17000;

				sceneMain.add( new FOUR.HemisphereLight( 0xff0066, 0x0066ff, 7 ) );
				sceneMain.add( light );
				scenePortal.add( light.clone() );

				// models

				const loader = new GLTFLoader();
				loader.load( 'models/gltf/Xbot.glb', function ( gltf ) {

					const createModel = ( colorNode = null ) => {

						let object;
			
						if ( mixers.length === 0 ) {

							object = gltf.scene;

						} else {

							object = gltf.scene.clone();

							const children = object.children[ 0 ].children;

							const applyFX = ( index ) => {

								children[ index ].material = children[ index ].material.clone();
								children[ index ].material.colorNode = colorNode;
								children[ index ].material.wireframe = true;

							};

							applyFX( 0 );
							applyFX( 1 );

						}

						const mixer = new FOUR.AnimationMixer( object );

						const action = mixer.clipAction( gltf.animations[ 6 ] );
						action.play();

						mixers.push( mixer );

						return object;

					};

					const colorNode = mx_fractal_noise_vec3( uv().mul( 20 ).add( time ) );

					const modelMain = createModel();
					const modelPortal = createModel( colorNode );

					// model portal

					sceneMain.add( modelMain );
					scenePortal.add( modelPortal );

				} );

				// portal

				const geometry = new FOUR.PlaneGeometry( 1.7, 2 );

				const material = new FOUR.MeshBasicNodeMaterial();
				material.colorNode = pass( scenePortal, camera ).context( { getUV: () => screenUV } );
				material.opacityNode = uv().distance( .5 ).remapClamp( .3, .5 ).oneMinus();
				material.side = FOUR.DoubleSide;
				material.transparent = true;

				const plane = new FOUR.Mesh( geometry, material );
				plane.position.set( 0, 1, .8 );
				sceneMain.add( plane );

				// renderer

				renderer = new FOUR.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = FOUR.LinearToneMapping;
				renderer.toneMappingExposure = 0.15;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				//

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 1, 0 );
				controls.update();


				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				for ( const mixer of mixers ) {

					mixer.update( delta );

				}

				renderer.render( sceneMain, camera );

			}

		</script>
	</body>
</html>
