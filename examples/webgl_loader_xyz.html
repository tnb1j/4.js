<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - loaders - XYZ</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - loaders - XYZ">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>
		<div id="info">
		<a href="../" target="_blank" rel="noopener">4.js</a> - XYZ loader<br/>
		asset from <a href="https://people.math.sc.edu/Burkardt/data/xyz/xyz.html" target="_blank" rel="noopener">people.math.sc.edu</a> via GNU LGPL
		</div>

		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.module.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core';

			import { XYZLoader } from '@fourjs/core/addons/loaders/XYZLoader.js';

			let camera, scene, renderer, timer;

			let points;

			init();

			function init() {

				camera = new FOUR.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 10, 7, 10 );

				scene = new FOUR.Scene();
				scene.add( camera );
				camera.lookAt( scene.position );

				timer = new FOUR.Timer();
				timer.connect( document );

				const loader = new XYZLoader();
				loader.load( 'models/xyz/helix_201.xyz', function ( geometry ) {

					geometry.center();

					const vertexColors = ( geometry.hasAttribute( 'color' ) === true );

					const material = new FOUR.PointsMaterial( { size: 0.1, vertexColors: vertexColors } );

					points = new FOUR.Points( geometry, material );
					scene.add( points );

				} );

				//

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				if ( points ) {

					points.rotation.x += delta * 0.2;
					points.rotation.y += delta * 0.5;

				}

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
