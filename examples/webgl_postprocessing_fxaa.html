<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js WebGL  - postprocessing - FXAA</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js WebGL  - postprocessing - FXAA">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			body {
				background-color: #fff;
				color: #222;
			}

			a {
				color: #08f;
			}

			#container {
				position: absolute;
				top: 70px;
				width: 100%;
				bottom: 0px;
			}
		</style>
	</head>

	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener">4.js</a> - postprocessing - FXAA<br />
			Left: No FXAA, Right: FXAA
		</div>
		<div id="container">
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.module.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js';

			import { EffectComposer } from '@tnb1j/4js/addons/postprocessing/EffectComposer.js';
			import { RenderPass } from '@tnb1j/4js/addons/postprocessing/RenderPass.js';
			import { OutputPass } from '@tnb1j/4js/addons/postprocessing/OutputPass.js';
			import { FXAAPass } from '@tnb1j/4js/addons/postprocessing/FXAAPass.js';
			import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';

			let camera, scene, renderer, controls, container;

			let composer1, composer2, fxaaPass;

			init();

			function init() {

				container = document.getElementById( 'container' );

				camera = new FOUR.PerspectiveCamera( 45, container.offsetWidth / container.offsetHeight, 1, 2000 );
				camera.position.z = 500;

				scene = new FOUR.Scene();

				//

				const hemiLight = new FOUR.HemisphereLight( 0xffffff, 0x8d8d8d );
				hemiLight.position.set( 0, 1000, 0 );
				scene.add( hemiLight );

				const dirLight = new FOUR.DirectionalLight( 0xffffff, 3 );
				dirLight.position.set( - 3000, 1000, - 1000 );
				scene.add( dirLight );

				//

				const geometry = new FOUR.TetrahedronGeometry( 10 );
				const material = new FOUR.MeshStandardMaterial( { color: 0xf73232, flatShading: true } );

				const mesh = new FOUR.InstancedMesh( geometry, material, 100 );
				const dummy = new FOUR.Object3D();

				for ( let i = 0; i < 100; i ++ ) {

					dummy.position.x = Math.random() * 500 - 250;
					dummy.position.y = Math.random() * 500 - 250;
					dummy.position.z = Math.random() * 500 - 250;

					dummy.scale.setScalar( Math.random() * 2 + 1 );

					dummy.rotation.x = Math.random() * Math.PI;
					dummy.rotation.y = Math.random() * Math.PI;
					dummy.rotation.z = Math.random() * Math.PI;

					dummy.updateMatrix();
					mesh.setMatrixAt( i, dummy.matrix );

				}

				scene.add( mesh );

				//

				renderer = new FOUR.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( container.offsetWidth, container.offsetHeight );
				renderer.setAnimationLoop( animate );
				renderer.autoClear = false;
				controls = new OrbitControls( camera, renderer.domElement );
				controls.autoRotate = true;
				container.appendChild( renderer.domElement );

				//

				const renderPass = new RenderPass( scene, camera );
				renderPass.clearAlpha = 0;

				//

				fxaaPass = new FXAAPass();

				const outputPass = new OutputPass();

				composer1 = new EffectComposer( renderer );
				composer1.addPass( renderPass );
				composer1.addPass( outputPass );

				//

				composer2 = new EffectComposer( renderer );
				composer2.addPass( renderPass );
				composer2.addPass( outputPass );

				// FXAA is engineered to be applied towards the end of engine post processing after conversion to low dynamic range and conversion to the sRGB color space for display.

				composer2.addPass( fxaaPass );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = container.offsetWidth / container.offsetHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( container.offsetWidth, container.offsetHeight );
				composer1.setSize( container.offsetWidth, container.offsetHeight );
				composer2.setSize( container.offsetWidth, container.offsetHeight );

			}

			function animate() {

				const halfWidth = container.offsetWidth / 2;

				controls.update();

				renderer.setScissorTest( true );

				renderer.setScissor( 0, 0, halfWidth - 1, container.offsetHeight );
				composer1.render();

				renderer.setScissor( halfWidth, 0, halfWidth, container.offsetHeight );
				composer2.render();

				renderer.setScissorTest( false );

			}

		</script>
	</body>
</html>
