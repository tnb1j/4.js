<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgl - pmrem equirectangular</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgl - pmrem equirectangular">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.module.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js';

			import { UltraHDRLoader } from '@tnb1j/4js/addons/loaders/UltraHDRLoader.js';

			import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';

			let camera, scene, renderer;

			init();

			async function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.25, 20 );
				camera.position.set( 0, 0, 8 );

				scene = new FOUR.Scene();

				renderer = new FOUR.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( render );
				renderer.toneMapping = FOUR.ACESFilmicToneMapping;

				container.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 2;
				controls.maxDistance = 10;
				controls.update();

				new UltraHDRLoader()
					.setPath( 'textures/equirectangular/' )
					.load( 'royal_esplanade_2k.hdr.jpg', function ( map ) {

						map.mapping = FOUR.EquirectangularReflectionMapping;

						const pmremGenerator = new FOUR.PMREMGenerator( renderer );
						const envMap = pmremGenerator.fromEquirectangular( map ).texture;

						scene.background = envMap;
						scene.backgroundBlurriness = 0.5;

						pmremGenerator.dispose();

						const geometry = new FOUR.SphereGeometry( 0.4, 64, 64 );

						for ( let i = 0; i < 6; i ++ ) {

							for ( let j = 0; j < 5; j ++ ) {

								const material = new FOUR.MeshPhysicalMaterial( {
									roughness: i / 5,
									metalness: j / 4,
									envMap: envMap
								} );

								const mesh = new FOUR.Mesh( geometry, material );
								mesh.position.x = i - 2.5;
								mesh.position.y = j - 2;
								scene.add( mesh );

							}

						}

					} );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function render() {

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
