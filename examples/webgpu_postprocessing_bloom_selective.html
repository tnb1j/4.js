<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - bloom selective</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - bloom selective">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Selective Bloom</span>
			</div>

			<small>Using MRT do define whether an object should be affected by Bloom or not.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"fourjs": "../build/4.webgpu.js",
					"fourjs/webgpu": "../build/4.webgpu.js",
					"fourjs/tsl": "../build/4.tsl.js",
					"fourjs/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from 'fourjs/webgpu';
			import { pass, mrt, output, float, uniform } from 'fourjs/tsl';
			import { bloom } from 'fourjs/addons/tsl/display/BloomNode.js';

			import { OrbitControls } from 'fourjs/addons/controls/OrbitControls.js';

			import { Inspector } from 'fourjs/addons/inspector/Inspector.js';

			// scene

			const scene = new FOUR.Scene();

			const camera = new FOUR.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 200 );
			camera.position.set( 0, 0, 20 );
			camera.lookAt( 0, 0, 0 );

			const geometry = new FOUR.IcosahedronGeometry( 1, 15 );

			for ( let i = 0; i < 50; i ++ ) {

				const color = new FOUR.Color();
				color.setHSL( Math.random(), 0.7, Math.random() * 0.2 + 0.05 );

				const bloomIntensity = Math.random() > 0.5 ? 1 : 0;

				const material = new FOUR.MeshBasicNodeMaterial( { color: color } );
				material.mrtNode = mrt( {
					bloomIntensity: uniform( bloomIntensity )
				} );

				const sphere = new FOUR.Mesh( geometry, material );
				sphere.position.x = Math.random() * 10 - 5;
				sphere.position.y = Math.random() * 10 - 5;
				sphere.position.z = Math.random() * 10 - 5;
				sphere.position.normalize().multiplyScalar( Math.random() * 4.0 + 2.0 );
				sphere.scale.setScalar( Math.random() * Math.random() + 0.5 );
				scene.add( sphere );

			}

			// renderer

			const renderer = new FOUR.WebGPURenderer();
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			renderer.inspector = new Inspector();
			renderer.toneMapping = FOUR.NeutralToneMapping;
			document.body.appendChild( renderer.domElement );

			// post processing

			const scenePass = pass( scene, camera );
			scenePass.setMRT( mrt( {
				output,
				bloomIntensity: float( 0 ) // default bloom intensity
			} ) );

			const outputPass = scenePass.getTextureNode().toInspector( 'Color' );
			const bloomIntensityPass = scenePass.getTextureNode( 'bloomIntensity' ).toInspector( 'Bloom Intensity' );

			const bloomPass = bloom( outputPass.mul( bloomIntensityPass ) );

			const renderPipeline = new FOUR.RenderPipeline( renderer );
			renderPipeline.outputColorTransform = false;
			renderPipeline.outputNode = outputPass.add( bloomPass ).renderOutput();

			// controls

			const controls = new OrbitControls( camera, renderer.domElement );
			controls.maxPolarAngle = Math.PI * 0.5;
			controls.minDistance = 1;
			controls.maxDistance = 100;

			// raycaster

			const raycaster = new FOUR.Raycaster();
			const mouse = new FOUR.Vector2();

			window.addEventListener( 'pointerdown', ( event ) => {

				mouse.x = ( event.clientX / window.innerWidth ) * 2 - 1;
				mouse.y = - ( event.clientY / window.innerHeight ) * 2 + 1;

				raycaster.setFromCamera( mouse, camera );

				const intersects = raycaster.intersectObjects( scene.children, false );

				if ( intersects.length > 0 ) {

					const material = intersects[ 0 ].object.material;

					const bloomIntensity = material.mrtNode.get( 'bloomIntensity' );
					bloomIntensity.value = bloomIntensity.value === 0 ? 1 : 0;

				}

			} );

			// gui

			const gui = renderer.inspector.createParameters( 'Settings' );

			const bloomFolder = gui.addFolder( 'Bloom' );
			bloomFolder.add( bloomPass.threshold, 'value', 0.0, 1.0 ).name( 'threshold' );
			bloomFolder.add( bloomPass.strength, 'value', 0.0, 3 ).name( 'strength' );
			bloomFolder.add( bloomPass.radius, 'value', 0.0, 1.0 ).name( 'radius' );

			const toneMappingFolder = gui.addFolder( 'Tone Mapping' );
			toneMappingFolder.add( renderer, 'toneMappingExposure', 0.1, 3 ).name( 'exposure' );

			// events

			window.onresize = function () {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize( width, height );

			};

			// animate

			function animate() {

				renderPipeline.render();

			}

		</script>

	</body>

</html>
