<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - FXAA</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - FXAA">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>

	<body>

		<div id="info" class="invert">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>FXAA</span>
			</div>

			<small>Fast Approximate Anti-Aliasing.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"@tnb1j/4js": "../build/4.webgpu.js",
					"@tnb1j/4js/webgpu": "../build/4.webgpu.js",
					"@tnb1j/4js/tsl": "../build/4.tsl.js",
					"@tnb1j/4js/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@tnb1j/4js/webgpu';
			import { pass, renderOutput } from '@tnb1j/4js/tsl';
			import { fxaa } from '@tnb1j/4js/addons/tsl/display/FXAANode.js';

			import { Inspector } from '@tnb1j/4js/addons/inspector/Inspector.js';

			const params = {
				enabled: true,
				animated: false
			};

			let camera, scene, renderer, timer, group;
			let renderPipeline;

			init();

			async function init() {

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 200 );
				camera.position.z = 50;

				scene = new FOUR.Scene();
				scene.background = new FOUR.Color( 0xffffff );

				timer = new FOUR.Timer();
				timer.connect( document );

				//

				const hemiLight = new FOUR.HemisphereLight( 0xffffff, 0x8d8d8d );
				hemiLight.position.set( 0, 1000, 0 );
				scene.add( hemiLight );

				const dirLight = new FOUR.DirectionalLight( 0xffffff, 3 );
				dirLight.position.set( - 3000, 1000, - 1000 );
				scene.add( dirLight );

				//

				group = new FOUR.Group();

				const geometry = new FOUR.TetrahedronGeometry();
				const material = new FOUR.MeshStandardMaterial( { color: 0xf73232, flatShading: true } );

				const mesh = new FOUR.InstancedMesh( geometry, material, 100 );
				const dummy = new FOUR.Object3D();

				for ( let i = 0; i < 100; i ++ ) {

					dummy.position.x = Math.random() * 50 - 25;
					dummy.position.y = Math.random() * 50 - 25;
					dummy.position.z = Math.random() * 50 - 25;

					dummy.scale.setScalar( Math.random() * 2 + 1 );

					dummy.rotation.x = Math.random() * Math.PI;
					dummy.rotation.y = Math.random() * Math.PI;
					dummy.rotation.z = Math.random() * Math.PI;

					dummy.updateMatrix();
					mesh.setMatrixAt( i, dummy.matrix );

				}

				group.add( mesh );
				scene.add( group );

				renderer = new FOUR.WebGPURenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				// post processing

				renderPipeline = new FOUR.RenderPipeline( renderer );

				// ignore default output color transform ( toneMapping and outputColorSpace )
				// use renderOutput() for control the sequence

				renderPipeline.outputColorTransform = false;

				// scene pass

				const scenePass = pass( scene, camera ).toInspector( 'Color' );
				const outputPass = renderOutput( scenePass );

				// FXAA must be computed in sRGB color space (so after tone mapping and color space conversion)

				const fxaaPass = fxaa( outputPass );
				renderPipeline.outputNode = fxaaPass;

				//

				window.addEventListener( 'resize', onWindowResize );

				//

				const gui = renderer.inspector.createParameters( 'Settings' );
				gui.add( params, 'enabled' ).onChange( ( value ) => {
			
					if ( value === true ) {

						renderPipeline.outputNode = fxaaPass;

					} else {

						renderPipeline.outputNode = outputPass;

					}

					renderPipeline.needsUpdate = true;

				} );
				gui.add( params, 'animated' );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				if ( params.animated === true ) {

					group.rotation.y += delta * 0.1;

				}

				renderPipeline.render();

			}

		</script>

	</body>
</html>
