<!DOCTYPE html>
<html lang="en">
	<head>
		<title>4.js webgpu - cubemap mix</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="4.js webgpu - cubemap mix">
		<meta property="og:type" content="website">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="../" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="../" target="_blank" rel="noopener">4.js</a><span>Cubemap Mix</span>
			</div>

			<small>
				Mixing two cube maps.<br/>
				Battle Damaged Sci-fi Helmet by <a href="https://sketchfab.com/theblueturtle_" target="_blank" rel="noopener">theblueturtle_</a>
			</small>
		</div>
		<script type="importmap">
			{
				"imports": {
					"@fourjs/core": "../build/4.webgpu.js",
					"@fourjs/core/webgpu": "../build/4.webgpu.js",
					"@fourjs/core/tsl": "../build/4.tsl.js",
					"@fourjs/core/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as FOUR from '@fourjs/core/webgpu';
			import { mix, oscSine, time, pmremTexture, float } from '@fourjs/core/tsl';

			import { HDRCubeTextureLoader } from '@fourjs/core/addons/loaders/HDRCubeTextureLoader.js';

			import { OrbitControls } from '@fourjs/core/addons/controls/OrbitControls.js';
			import { GLTFLoader } from '@fourjs/core/addons/loaders/GLTFLoader.js';

			import { Inspector } from '@fourjs/core/addons/inspector/Inspector.js';

			let camera, scene, renderer;

			init();

			async function init() {

				camera = new FOUR.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.25, 20 );
				camera.position.set( - 1.8, 0.6, 2.7 );

				scene = new FOUR.Scene();

				const hdrUrls = [ 'px.hdr', 'nx.hdr', 'py.hdr', 'ny.hdr', 'pz.hdr', 'nz.hdr' ];
				const cube1Texture = new HDRCubeTextureLoader()
					.setPath( './textures/cube/pisaHDR/' )
					.load( hdrUrls );

				cube1Texture.generateMipmaps = true;
				cube1Texture.minFilter = FOUR.LinearMipmapLinearFilter;

				const cube2Urls = [ 'dark-s_px.jpg', 'dark-s_nx.jpg', 'dark-s_py.jpg', 'dark-s_ny.jpg', 'dark-s_pz.jpg', 'dark-s_nz.jpg' ];
				const cube2Texture = await new FOUR.CubeTextureLoader()
					.setPath( './textures/cube/MilkyWay/' )
					.loadAsync( cube2Urls );

				cube2Texture.generateMipmaps = true;
				cube2Texture.minFilter = FOUR.LinearMipmapLinearFilter;

				scene.environmentNode = mix( pmremTexture( cube2Texture ), pmremTexture( cube1Texture ), oscSine( time.mul( .1 ) ) );

				scene.backgroundNode = scene.environmentNode.context( {
					getTextureLevel: () => float( .5 )
				} );

				const loader = new GLTFLoader().setPath( 'models/gltf/DamagedHelmet/glTF/' );
				const gltf = await loader.loadAsync( 'DamagedHelmet.gltf' );

				scene.add( gltf.scene );

				renderer = new FOUR.WebGPURenderer( { antialias: true } );

				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = FOUR.LinearToneMapping;
				renderer.inspector = new Inspector();
				renderer.setAnimationLoop( render );
				document.body.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.minDistance = 2;
				controls.maxDistance = 10;

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function render() {

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
