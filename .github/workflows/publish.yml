name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag'
        required: true
        default: 'preview'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Build bundles
        run: npm run build
      - name: Publish to npm
        run: npm publish --access public --tag ${{ github.event.inputs.tag || 'preview' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
