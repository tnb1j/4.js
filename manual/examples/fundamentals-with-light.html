<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>4.js - Fundamentals with light</title>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
<script type="importmap">
{
  "imports": {
    "@tnb1j/4js": "../../build/4.module.js"
  }
}
</script>

<script type="module">
import * as FOUR from '@tnb1j/4js';

function main() {

	const canvas = document.querySelector( '#c' );
	const renderer = new FOUR.WebGLRenderer( { antialias: true, canvas } );

	const fov = 75;
	const aspect = 2; // the canvas default
	const near = 0.1;
	const far = 5;
	const camera = new FOUR.PerspectiveCamera( fov, aspect, near, far );
	camera.position.z = 2;

	const scene = new FOUR.Scene();

	{

		const color = 0xFFFFFF;
		const intensity = 3;
		const light = new FOUR.DirectionalLight( color, intensity );
		light.position.set( - 1, 2, 4 );
		scene.add( light );

	}

	const boxWidth = 1;
	const boxHeight = 1;
	const boxDepth = 1;
	const geometry = new FOUR.BoxGeometry( boxWidth, boxHeight, boxDepth );

	const material = new FOUR.MeshPhongMaterial( { color: 0x44aa88 } ); // greenish blue

	const cube = new FOUR.Mesh( geometry, material );
	scene.add( cube );

	function render( time ) {

		time *= 0.001; // convert time to seconds

		cube.rotation.x = time;
		cube.rotation.y = time;

		renderer.render( scene, camera );

		requestAnimationFrame( render );

	}

	requestAnimationFrame( render );

}

main();
</script>
</html>
