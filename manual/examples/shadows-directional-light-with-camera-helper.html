<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>4.js - Shadows - Directional Light w/CameraHelper</title>
    <style>
    html, body {
        margin: 0;
        height: 100%;
    }
    #c {
        width: 100%;
        height: 100%;
        display: block;
    }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
<script type="importmap">
{
  "imports": {
    "@tnb1j/4js": "../../build/4.module.js",
    "@tnb1j/4js/addons/": "../../examples/jsm/"
  }
}
</script>

<script type="module">
import * as FOUR from '@tnb1j/4js';
import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';
import { GUI } from '@tnb1j/4js/addons/libs/lil-gui.module.min.js';

function main() {

	const canvas = document.querySelector( '#c' );
	const renderer = new FOUR.WebGLRenderer( { antialias: true, canvas } );
	renderer.shadowMap.enabled = true;

	const fov = 45;
	const aspect = 2; // the canvas default
	const near = 0.1;
	const far = 100;
	const camera = new FOUR.PerspectiveCamera( fov, aspect, near, far );
	camera.position.set( 0, 10, 20 );

	const controls = new OrbitControls( camera, canvas );
	controls.target.set( 0, 5, 0 );
	controls.update();

	const scene = new FOUR.Scene();
	scene.background = new FOUR.Color( 'black' );

	{

		const planeSize = 40;

		const loader = new FOUR.TextureLoader();
		const texture = loader.load( 'resources/images/checker.png' );
		texture.wrapS = FOUR.RepeatWrapping;
		texture.wrapT = FOUR.RepeatWrapping;
		texture.magFilter = FOUR.NearestFilter;
		texture.colorSpace = FOUR.SRGBColorSpace;
		const repeats = planeSize / 2;
		texture.repeat.set( repeats, repeats );

		const planeGeo = new FOUR.PlaneGeometry( planeSize, planeSize );
		const planeMat = new FOUR.MeshPhongMaterial( {
			map: texture,
			side: FOUR.DoubleSide,
		} );
		const mesh = new FOUR.Mesh( planeGeo, planeMat );
		mesh.receiveShadow = true;
		mesh.rotation.x = Math.PI * - .5;
		scene.add( mesh );

	}

	{

		const cubeSize = 4;
		const cubeGeo = new FOUR.BoxGeometry( cubeSize, cubeSize, cubeSize );
		const cubeMat = new FOUR.MeshPhongMaterial( { color: '#8AC' } );
		const mesh = new FOUR.Mesh( cubeGeo, cubeMat );
		mesh.castShadow = true;
		mesh.receiveShadow = true;
		mesh.position.set( cubeSize + 1, cubeSize / 2, 0 );
		scene.add( mesh );

	}

	{

		const sphereRadius = 3;
		const sphereWidthDivisions = 32;
		const sphereHeightDivisions = 16;
		const sphereGeo = new FOUR.SphereGeometry( sphereRadius, sphereWidthDivisions, sphereHeightDivisions );
		const sphereMat = new FOUR.MeshPhongMaterial( { color: '#CA8' } );
		const mesh = new FOUR.Mesh( sphereGeo, sphereMat );
		mesh.castShadow = true;
		mesh.receiveShadow = true;
		mesh.position.set( - sphereRadius - 1, sphereRadius + 2, 0 );
		scene.add( mesh );

	}

	class ColorGUIHelper {

		constructor( object, prop ) {

			this.object = object;
			this.prop = prop;

		}
		get value() {

			return `#${this.object[ this.prop ].getHexString()}`;

		}
		set value( hexString ) {

			this.object[ this.prop ].set( hexString );

		}

	}

	function makeXYZGUI( gui, vector3, name, onChangeFn ) {

		const folder = gui.addFolder( name );
		folder.add( vector3, 'x', - 10, 10 ).onChange( onChangeFn );
		folder.add( vector3, 'y', 0, 10 ).onChange( onChangeFn );
		folder.add( vector3, 'z', - 10, 10 ).onChange( onChangeFn );
		folder.open();

	}

	{

		const color = 0xFFFFFF;
		const intensity = 3;
		const light = new FOUR.DirectionalLight( color, intensity );
		light.castShadow = true;
		light.position.set( 0, 10, 0 );
		light.target.position.set( - 4, 0, - 4 );
		scene.add( light );
		scene.add( light.target );

		const cameraHelper = new FOUR.CameraHelper( light.shadow.camera );
		scene.add( cameraHelper );

		const helper = new FOUR.DirectionalLightHelper( light );
		scene.add( helper );

		const onChange = () => {

			light.target.updateMatrixWorld();
			helper.update();

		};

		onChange();

		const gui = new GUI();
		gui.addColor( new ColorGUIHelper( light, 'color' ), 'value' ).name( 'color' );
		gui.add( light, 'intensity', 0, 10, 0.01 );

		makeXYZGUI( gui, light.position, 'position', onChange );
		makeXYZGUI( gui, light.target.position, 'target', onChange );

	}

	function resizeRendererToDisplaySize( renderer ) {

		const canvas = renderer.domElement;
		const width = canvas.clientWidth;
		const height = canvas.clientHeight;
		const needResize = canvas.width !== width || canvas.height !== height;
		if ( needResize ) {

			renderer.setSize( width, height, false );

		}

		return needResize;

	}

	function render() {

		resizeRendererToDisplaySize( renderer );

		{

			const canvas = renderer.domElement;
			camera.aspect = canvas.clientWidth / canvas.clientHeight;
			camera.updateProjectionMatrix();

		}

		renderer.render( scene, camera );

		requestAnimationFrame( render );

	}

	requestAnimationFrame( render );

}

main();
</script>
</html>
