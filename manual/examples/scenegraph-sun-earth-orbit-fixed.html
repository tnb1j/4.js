<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>4.js - Scenegraph - Sun Earth</title>
    <style>
    html, body {
        height: 100%;
        margin: 0;
    }
    #c {
        width: 100%;
        height: 100%;
        display: block;
    }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
<script type="importmap">
{
  "imports": {
    "@tnb1j/4js": "../../build/4.module.js"
  }
}
</script>

<script type="module">
import * as FOUR from '@tnb1j/4js';

function main() {

	const canvas = document.querySelector( '#c' );
	const renderer = new FOUR.WebGLRenderer( { antialias: true, canvas } );

	const fov = 40;
	const aspect = 2; // the canvas default
	const near = 0.1;
	const far = 1000;
	const camera = new FOUR.PerspectiveCamera( fov, aspect, near, far );
	camera.position.set( 0, 50, 0 );
	camera.up.set( 0, 0, 1 );
	camera.lookAt( 0, 0, 0 );

	const scene = new FOUR.Scene();

	{

		const color = 0xFFFFFF;
		const intensity = 500;
		const light = new FOUR.PointLight( color, intensity );
		scene.add( light );

	}

	const objects = [];

	const radius = 1;
	const widthSegments = 6;
	const heightSegments = 6;
	const sphereGeometry = new FOUR.SphereGeometry(
		radius, widthSegments, heightSegments );

	const solarSystem = new FOUR.Object3D();
	scene.add( solarSystem );
	objects.push( solarSystem );

	const sunMaterial = new FOUR.MeshPhongMaterial( { emissive: 0xFFFF00 } );
	const sunMesh = new FOUR.Mesh( sphereGeometry, sunMaterial );
	sunMesh.scale.set( 5, 5, 5 );
	solarSystem.add( sunMesh );
	objects.push( sunMesh );

	const earthMaterial = new FOUR.MeshPhongMaterial( { color: 0x2233FF, emissive: 0x112244 } );
	const earthMesh = new FOUR.Mesh( sphereGeometry, earthMaterial );
	earthMesh.position.x = 10;
	solarSystem.add( earthMesh );
	objects.push( earthMesh );

	function resizeRendererToDisplaySize( renderer ) {

		const canvas = renderer.domElement;
		const width = canvas.clientWidth;
		const height = canvas.clientHeight;
		const needResize = canvas.width !== width || canvas.height !== height;
		if ( needResize ) {

			renderer.setSize( width, height, false );

		}

		return needResize;

	}

	function render( time ) {

		time *= 0.001;

		if ( resizeRendererToDisplaySize( renderer ) ) {

			const canvas = renderer.domElement;
			camera.aspect = canvas.clientWidth / canvas.clientHeight;
			camera.updateProjectionMatrix();

		}

		objects.forEach( ( obj ) => {

			obj.rotation.y = time;

		} );

		renderer.render( scene, camera );

		requestAnimationFrame( render );

	}

	requestAnimationFrame( render );

}

main();
</script>
</html>
