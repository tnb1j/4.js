<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>4.js - Responsive</title>
    <style>
    html, body {
        height: 100%;
        margin: 0;
    }
    #c {
        width: 100%;
        height: 100%;
        display: block;
    }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
<script type="importmap">
{
  "imports": {
    "fourjs": "../../build/4.module.js"
  }
}
</script>

<script type="module">
import * as FOUR from 'fourjs';

function main() {

	const canvas = document.querySelector( '#c' );
	const renderer = new FOUR.WebGLRenderer( { antialias: true, canvas } );

	const rtWidth = 512;
	const rtHeight = 512;
	const renderTarget = new FOUR.WebGLRenderTarget( rtWidth, rtHeight );

	const rtFov = 75;
	const rtAspect = rtWidth / rtHeight;
	const rtNear = 0.1;
	const rtFar = 5;
	const rtCamera = new FOUR.PerspectiveCamera( rtFov, rtAspect, rtNear, rtFar );
	rtCamera.position.z = 2;

	const rtScene = new FOUR.Scene();
	rtScene.background = new FOUR.Color( 'red' );

	{

		const color = 0xFFFFFF;
		const intensity = 3;
		const light = new FOUR.DirectionalLight( color, intensity );
		light.position.set( - 1, 2, 4 );
		rtScene.add( light );

	}

	const boxWidth = 1;
	const boxHeight = 1;
	const boxDepth = 1;
	const geometry = new FOUR.BoxGeometry( boxWidth, boxHeight, boxDepth );

	function makeInstance( geometry, color, x ) {

		const material = new FOUR.MeshPhongMaterial( { color } );

		const cube = new FOUR.Mesh( geometry, material );
		rtScene.add( cube );

		cube.position.x = x;

		return cube;

	}

	const rtCubes = [
		makeInstance( geometry, 0x44aa88, 0 ),
		makeInstance( geometry, 0x8844aa, - 2 ),
		makeInstance( geometry, 0xaa8844, 2 ),
	];

	const fov = 75;
	const aspect = 2; // the canvas default
	const near = 0.1;
	const far = 5;
	const camera = new FOUR.PerspectiveCamera( fov, aspect, near, far );
	camera.position.z = 2;

	const scene = new FOUR.Scene();

	{

		const color = 0xFFFFFF;
		const intensity = 1;
		const light = new FOUR.DirectionalLight( color, intensity );
		light.position.set( - 1, 2, 4 );
		scene.add( light );

	}

	const material = new FOUR.MeshPhongMaterial( {
		map: renderTarget.texture,
	} );
	const cube = new FOUR.Mesh( geometry, material );
	scene.add( cube );

	function resizeRendererToDisplaySize( renderer ) {

		const canvas = renderer.domElement;
		const width = canvas.clientWidth;
		const height = canvas.clientHeight;
		const needResize = canvas.width !== width || canvas.height !== height;
		if ( needResize ) {

			renderer.setSize( width, height, false );

		}

		return needResize;

	}

	function render( time ) {

		time *= 0.001;

		if ( resizeRendererToDisplaySize( renderer ) ) {

			const canvas = renderer.domElement;
			camera.aspect = canvas.clientWidth / canvas.clientHeight;
			camera.updateProjectionMatrix();

		}

		// rotate all the cubes in the render target scene
		rtCubes.forEach( ( cube, ndx ) => {

			const speed = 1 + ndx * .1;
			const rot = time * speed;
			cube.rotation.x = rot;
			cube.rotation.y = rot;

		} );

		// draw render target scene to render target
		renderer.setRenderTarget( renderTarget );
		renderer.render( rtScene, rtCamera );
		renderer.setRenderTarget( null );

		// rotate the cube in the scene
		cube.rotation.x = time;
		cube.rotation.y = time * 1.1;

		// render the scene to the canvas
		renderer.render( scene, camera );

		requestAnimationFrame( render );

	}

	requestAnimationFrame( render );

}

main();
</script>
</html>
