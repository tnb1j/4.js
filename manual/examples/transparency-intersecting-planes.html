<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>4.js - Transparency - Intersecting Planes</title>
    <style>
    html, body {
        height: 100%;
        margin: 0;
    }
    #c {
        width: 100%;
        height: 100%;
        display: block;
    }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
<script type="importmap">
{
  "imports": {
    "@tnb1j/4js": "../../build/4.module.js",
    "@tnb1j/4js/addons/": "../../examples/jsm/"
  }
}
</script>

<script type="module">
import * as FOUR from '@tnb1j/4js';
import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';

function main() {

	const canvas = document.querySelector( '#c' );
	const renderer = new FOUR.WebGLRenderer( { antialias: true, canvas } );

	const fov = 75;
	const aspect = 2; // the canvas default
	const near = 0.1;
	const far = 25;
	const camera = new FOUR.PerspectiveCamera( fov, aspect, near, far );
	camera.position.set( 0.5, 1, 0.5 );

	const controls = new OrbitControls( camera, canvas );
	controls.target.set( 0, 0, 0 );
	controls.update();

	const scene = new FOUR.Scene();
	scene.background = new FOUR.Color( 'white' );

	function addLight( x, y, z ) {

		const color = 0xFFFFFF;
		const intensity = 3;
		const light = new FOUR.DirectionalLight( color, intensity );
		light.position.set( x, y, z );
		scene.add( light );

	}

	addLight( - 1, 2, 4 );
	addLight( 1, - 1, - 2 );

	const planeWidth = 1;
	const planeHeight = 1;
	const geometry = new FOUR.PlaneGeometry( planeWidth, planeHeight );

	const loader = new FOUR.TextureLoader();

	function makeInstance( geometry, color, rotY, url ) {

		const texture = loader.load( url, render );
		texture.colorSpace = FOUR.SRGBColorSpace;
		const material = new FOUR.MeshPhongMaterial( {
			color,
			map: texture,
			opacity: 0.5,
			transparent: true,
			side: FOUR.DoubleSide,
		} );

		const mesh = new FOUR.Mesh( geometry, material );
		scene.add( mesh );

		mesh.rotation.y = rotY;

	}

	makeInstance( geometry, 'pink', 0, 'resources/images/happyface.png' ); /* threejs.org: url */
	makeInstance( geometry, 'lightblue', Math.PI * 0.5, 'resources/images/hmmmface.png' ); /* threejs.org: url */

	function resizeRendererToDisplaySize( renderer ) {

		const canvas = renderer.domElement;
		const width = canvas.clientWidth;
		const height = canvas.clientHeight;
		const needResize = canvas.width !== width || canvas.height !== height;
		if ( needResize ) {

			renderer.setSize( width, height, false );

		}

		return needResize;

	}

	let renderRequested = false;

	function render() {

		renderRequested = undefined;

		if ( resizeRendererToDisplaySize( renderer ) ) {

			const canvas = renderer.domElement;
			camera.aspect = canvas.clientWidth / canvas.clientHeight;
			camera.updateProjectionMatrix();

		}

		renderer.render( scene, camera );

	}

	render();

	function requestRenderIfNotRequested() {

		if ( ! renderRequested ) {

			renderRequested = true;
			requestAnimationFrame( render );

		}

	}

	controls.addEventListener( 'change', requestRenderIfNotRequested );
	window.addEventListener( 'resize', requestRenderIfNotRequested );

}

main();
</script>
</html>
