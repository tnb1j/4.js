<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>4.js - Shadertoy Prep</title>
    <style>
    html, body {
        height: 100%;
        margin: 0;
    }
    #c {
        width: 100%;
        height: 100%;
        display: block;
    }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
<script type="importmap">
{
  "imports": {
    "@fourjs/core": "../../build/4.module.js"
  }
}
</script>

<script type="module">
import * as FOUR from '@fourjs/core';

function main() {

	const canvas = document.querySelector( '#c' );
	const renderer = new FOUR.WebGLRenderer( { antialias: true, canvas } );
	renderer.autoClearColor = false;

	const camera = new FOUR.OrthographicCamera(
		- 1, // left
		1, // right
		1, // top
		- 1, // bottom
		- 1, // near,
		1, // far
	);
	const scene = new FOUR.Scene();
	const plane = new FOUR.PlaneGeometry( 2, 2 );
	const material = new FOUR.MeshBasicMaterial( {
		color: 'red',
	} );
	scene.add( new FOUR.Mesh( plane, material ) );

	function resizeRendererToDisplaySize( renderer ) {

		const canvas = renderer.domElement;
		const width = canvas.clientWidth;
		const height = canvas.clientHeight;
		const needResize = canvas.width !== width || canvas.height !== height;
		if ( needResize ) {

			renderer.setSize( width, height, false );

		}

		return needResize;

	}

	function render() {

		resizeRendererToDisplaySize( renderer );

		renderer.render( scene, camera );

		requestAnimationFrame( render );

	}

	requestAnimationFrame( render );

}

main();
</script>
</html>
