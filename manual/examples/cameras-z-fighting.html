<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>4.js - Cameras - Z Fighting</title>
    <style>
    html, body {
        margin: 0;
        height: 100%;
    }
    #c {
        width: 100%;
        height: 100%;
        display: block;
    }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
<script type="importmap">
{
  "imports": {
    "@tnb1j/4js": "../../build/4.module.js",
    "@tnb1j/4js/addons/": "../../examples/jsm/"
  }
}
</script>

<script type="module">
import * as FOUR from '@tnb1j/4js';
import { OrbitControls } from '@tnb1j/4js/addons/controls/OrbitControls.js';
import { GUI } from '@tnb1j/4js/addons/libs/lil-gui.module.min.js';

function main() {

	const canvas = document.querySelector( '#c' );
	const renderer = new FOUR.WebGLRenderer( { antialias: true, canvas } );
	const fov = 45;
	const aspect = 2; // the canvas default
	const near = 0.00001;
	const far = 100;
	const camera = new FOUR.PerspectiveCamera( fov, aspect, near, far );
	camera.position.set( 10, 6, 10 );

	class MinMaxGUIHelper {

		constructor( obj, minProp, maxProp, minDif ) {

			this.obj = obj;
			this.minProp = minProp;
			this.maxProp = maxProp;
			this.minDif = minDif;

		}
		get min() {

			return this.obj[ this.minProp ];

		}
		set min( v ) {

			this.obj[ this.minProp ] = v;
			this.obj[ this.maxProp ] = Math.max( this.obj[ this.maxProp ], v + this.minDif );

		}
		get max() {

			return this.obj[ this.maxProp ];

		}
		set max( v ) {

			this.obj[ this.maxProp ] = v;
			this.min = this.min; // this will call the min setter

		}

	}

	function updateCamera() {

		camera.updateProjectionMatrix();

	}

	const gui = new GUI();
	gui.add( camera, 'fov', 1, 180 ).onChange( updateCamera );
	const minMaxGUIHelper = new MinMaxGUIHelper( camera, 'near', 'far', 0.1 );
	gui.add( minMaxGUIHelper, 'min', 0.00001, 50, 0.00001 ).name( 'near' ).onChange( updateCamera );
	gui.add( minMaxGUIHelper, 'max', 0.1, 50, 0.1 ).name( 'far' ).onChange( updateCamera );

	const controls = new OrbitControls( camera, canvas );
	controls.target.set( 0, 5, 0 );
	controls.update();

	const scene = new FOUR.Scene();
	scene.background = new FOUR.Color( 'black' );

	{

		const planeSize = 40;

		const loader = new FOUR.TextureLoader();
		const texture = loader.load( 'resources/images/checker.png' );
		texture.wrapS = FOUR.RepeatWrapping;
		texture.wrapT = FOUR.RepeatWrapping;
		texture.magFilter = FOUR.NearestFilter;
		texture.colorSpace = FOUR.SRGBColorSpace;
		const repeats = planeSize / 2;
		texture.repeat.set( repeats, repeats );

		const planeGeo = new FOUR.PlaneGeometry( planeSize, planeSize );
		const planeMat = new FOUR.MeshPhongMaterial( {
			map: texture,
			side: FOUR.DoubleSide,
		} );
		const mesh = new FOUR.Mesh( planeGeo, planeMat );
		mesh.rotation.x = Math.PI * - .5;
		scene.add( mesh );

	}

	{

		const sphereRadius = 3;
		const sphereWidthDivisions = 32;
		const sphereHeightDivisions = 16;
		const sphereGeo = new FOUR.SphereGeometry( sphereRadius, sphereWidthDivisions, sphereHeightDivisions );
		const numSpheres = 20;
		for ( let i = 0; i < numSpheres; ++ i ) {

			const sphereMat = new FOUR.MeshPhongMaterial();
			sphereMat.color.setHSL( i * .73, 1, 0.5 );
			const mesh = new FOUR.Mesh( sphereGeo, sphereMat );
			mesh.position.set( - sphereRadius - 1, sphereRadius + 2, i * sphereRadius * - 2.2 );
			scene.add( mesh );

		}

	}

	{

		const color = 0xFFFFFF;
		const intensity = 3;
		const light = new FOUR.DirectionalLight( color, intensity );
		light.position.set( 0, 10, 0 );
		light.target.position.set( - 5, 0, 0 );
		scene.add( light );
		scene.add( light.target );

	}

	function resizeRendererToDisplaySize( renderer ) {

		const canvas = renderer.domElement;
		const width = canvas.clientWidth;
		const height = canvas.clientHeight;
		const needResize = canvas.width !== width || canvas.height !== height;
		if ( needResize ) {

			renderer.setSize( width, height, false );

		}

		return needResize;

	}

	function render() {

		if ( resizeRendererToDisplaySize( renderer ) ) {

			const canvas = renderer.domElement;
			camera.aspect = canvas.clientWidth / canvas.clientHeight;
			camera.updateProjectionMatrix();

		}

		renderer.render( scene, camera );

		requestAnimationFrame( render );

	}

	requestAnimationFrame( render );

}

main();
</script>
</html>
